# .github/workflows/portable-package.yml
#
# Canonical Self-Healing Supervisor release path. A release artifact is uploaded
# only after the portable boundary, focused safety regressions, TypeScript
# compilation, declarations, checksums, SBOM, clean npm install, public import
# and five-language acceptance all pass against the exact tarball.

name: Self-Healing portable release

on:
  push:
    branches: [main]
    paths:
      - 'saas/lib/supervisor/**'
      - 'saas/portable-license/**'
      - 'saas/tests/supervisorReleaseBlockers.node.test.ts'
      - 'saas/tests/selfHealingPortableCapabilityPolicy.node.test.ts'
      - 'saas/scripts/build-portable.mjs'
      - 'docs/portables/self-healing-*.md'
      - '.github/workflows/portable-package.yml'
  pull_request:
    paths:
      - 'saas/lib/supervisor/**'
      - 'saas/portable-license/**'
      - 'saas/tests/supervisorReleaseBlockers.node.test.ts'
      - 'saas/tests/selfHealingPortableCapabilityPolicy.node.test.ts'
      - 'saas/scripts/build-portable.mjs'
      - 'docs/portables/self-healing-*.md'
      - '.github/workflows/portable-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install locked build dependencies
        run: npm ci

      - name: Run audited release-blocker regressions
        run: node --test tests/supervisorReleaseBlockers.node.test.ts tests/selfHealingPortableCapabilityPolicy.node.test.ts

      - name: Verify buyer boundary
        run: node scripts/build-portable.mjs --check

      - name: Build, pack, clean-install and accept exact tarball
        run: node scripts/build-portable.mjs

      - name: Verify package and archive checksums
        run: |
          set -euo pipefail
          cd dist/portable
          test -f manifest.json
          test -f sbom.json
          test -f SHA256SUMS
          sha256sum -c ./*.tgz.sha256

      - name: Reject credential-shaped material
        run: |
          set -euo pipefail
          if grep -rInE '(BEGIN [A-Z ]*PRIVATE KEY|sk-[A-Za-z0-9]{20,}|xox[baprs]-)' dist/self-healing-build/package/dist; then
            echo '::error::credential-shaped material found in compiled payload'
            exit 1
          fi

      - name: Upload exact evaluated release
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-supervisor-${{ github.sha }}
          path: |
            saas/dist/portable/*.tgz
            saas/dist/portable/*.tgz.sha256
            saas/dist/portable/manifest.json
            saas/dist/portable/sbom.json
            saas/dist/portable/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
