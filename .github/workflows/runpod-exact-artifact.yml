name: RunPod Exact Artifact Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'runpod/exact-artifact/**'
      - '.github/workflows/runpod-exact-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable exact-artifact worker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/exact-artifact
          push: false
          tags: ghcr.io/signalboost/itmounts-exact-artifact:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
