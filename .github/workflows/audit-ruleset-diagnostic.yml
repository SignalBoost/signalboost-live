name: Audit Ruleset Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-ruleset-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate proposed audit workflow with actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: fix/audit-workflow-invalid-runner-context
        run: |
          set -euo pipefail
          curl --get --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "ref=${TARGET_REF}" \
            "https://api.github.com/repos/${GH_REPO}/contents/.github/workflows/audit-remediation-regression.yml" \
            | jq -r '.content' | base64 --decode > /tmp/audit-remediation-regression.yml

          bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -oneline /tmp/audit-remediation-regression.yml
          echo 'ACTIONLINT_STATUS=0'
