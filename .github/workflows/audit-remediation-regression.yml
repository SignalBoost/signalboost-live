name: Audit Remediation Regression

on:
  # GitHub's enforced required-workflow runner invokes this workflow with `push`
  # for protected branch commits. Keep all supported events unfiltered so the
  # required job is present for audit branches, pull requests, and merge queues.
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      global_approval:
        description: 'Run the owner-approved audit-remediation lifecycle validation batch.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit-remediation:
    name: Verify single-approval autonomous remediation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the only job allowed to execute dependency lifecycle scripts.
    # Job-level env cannot use runner.* because the runner does not exist yet.
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
      NODE_VERSION: '24.x'
      NPM_POLICY: dangerously-allow-all-scripts
      npm_config_cache: /tmp/signalboost-audit-npm-cache
      npm_config_ignore_scripts: 'false'
      npm_config_install_links: 'true'
    defaults:
      run:
        working-directory: saas
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install audit-remediation dependencies
        # npm ci installs the package-lock's directory, tarball, git, and HTTPS
        # dependency specs. The explicit policy is deliberately scoped to this job.
        run: npm ci --dangerously-allow-all-scripts

      - name: Verify autonomous remediation boundary
        run: npm run test:audit-remediation

      - name: Verify Audit COS reasoning boundary
        run: npm run test:audit-cos

      - name: Verify truthful global approval lifecycle
        run: npm run test:audit-global-approval

      - name: Verify end-to-end remediation recovery
        run: node --test tests/auditRemediationSystem.node.test.ts

      - name: Verify required workflow trigger
        run: node --test tests/auditRemediationWorkflowTrigger.node.test.ts

      - name: Run globally approved remediation batch
        if: github.event_name == 'workflow_dispatch' && inputs.global_approval
        # This repeats every lifecycle contract under the manual validation gate.
        run: npm run test:audit-remediation && npm run test:audit-cos && npm run test:audit-global-approval && node --test tests/auditRemediationSystem.node.test.ts tests/auditRemediationWorkflowTrigger.node.test.ts

      - name: Verify worker guard
        working-directory: .
        run: node scripts/verify-workers.mjs

      - name: Write audit-remediation run log
        if: always()
        working-directory: .
        run: |
          status="${{ job.status }}"
          case "$status" in
            success) status="completed" ;;
            *) status="failed" ;;
          esac
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{\n  "runId": "%s",\n  "nodeVersion": "24.x",\n  "npmPolicy": "dangerously-allow-all-scripts",\n  "status": "%s",\n  "timestamp": "%s"\n}\n' \
            "${{ github.run_id }}" "$status" "$timestamp" | tee audit-remediation-run.json

      - name: Upload audit-remediation run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-run-${{ github.run_id }}
          path: audit-remediation-run.json
          if-no-files-found: error
