name: CrewAI specialist delegation bootstrap

on:
  push:
    branches:
      - feat/cos-crewai-specialist-crew-20260911
    paths:
      - '.github/workflows/crewai-specialist-bootstrap.yml'
      - 'scripts/patch_crewai_specialist_delegation.py'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cos-crewai-specialist-crew-20260911
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Wire COS delegation and ONBOARD
        run: python scripts/patch_crewai_specialist_delegation.py

      - name: Install CrewAI service dependencies
        working-directory: services/cos-ai-department
        run: pip install -r requirements.txt

      - name: Test CrewAI authority and runtime boundaries
        working-directory: services/cos-ai-department
        env:
          PYTHONPATH: .
        run: pytest -q tests

      - name: Install SaaS dependencies
        working-directory: saas
        run: npm ci

      - name: Test COS CrewAI bridge
        working-directory: saas
        run: node --test tests/cosSpecialistCrewClient.node.test.ts tests/cosLangGraph.node.test.ts

      - name: Typecheck SaaS
        working-directory: saas
        run: npm run typecheck

      - name: Verify Python syntax
        run: python -m compileall -q services/cos-ai-department/app services/cos-ai-department/tests

      - name: Commit verified COS delegation
        run: |
          rm .github/workflows/crewai-specialist-bootstrap.yml
          rm scripts/patch_crewai_specialist_delegation.py
          git config user.name 'SignalBoost Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/app/api/support/routeCoreLegacy.ts ONBOARD.md .github/workflows/crewai-specialist-bootstrap.yml scripts/patch_crewai_specialist_delegation.py
          git commit -m 'feat(cos): delegate specialist review through CrewAI'
          git push origin HEAD:feat/cos-crewai-specialist-crew-20260911
