name: Builder Provider Selection
on:
  pull_request:
    paths:
      - 'saas/lib/builder/provider-selection.ts'
      - 'saas/tests/builderProviderSelection.node.test.ts'
      - '.github/workflows/builder-provider-selection.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: saas
      - run: npx tsx --test tests/builderProviderSelection.node.test.ts
        working-directory: saas
