name: Universal MCP Live Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/universal-mcp-live-acceptance.yml'
      - 'saas/provider-hub-host/mcp-outbound-client.ts'
      - 'saas/provider-hub-host/mcp-connection-registry.ts'
      - 'saas/provider-hub-host/mcp-streamable-http-transport.ts'
      - 'saas/provider-hub-host/universal-mcp-profiles.ts'
      - 'saas/provider-hub-host/universal-mcp-gateway.ts'
      - 'saas/provider-hub-host/mcp-certification.ts'
      - 'saas/provider-hub-host/mcp-gateway-audit.ts'
      - 'saas/scripts/mcp-gateway/run-universal-mcp-acceptance.ts'
      - 'saas/tests/providerHubMcpHttpTransport.node.test.ts'
      - 'saas/tests/mcpCertification.node.test.ts'
      - 'saas/tests/universalMcpGateway.node.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/universal-mcp-live-acceptance.yml'
      - 'saas/provider-hub-host/mcp-outbound-client.ts'
      - 'saas/provider-hub-host/mcp-connection-registry.ts'
      - 'saas/provider-hub-host/mcp-streamable-http-transport.ts'
      - 'saas/provider-hub-host/universal-mcp-profiles.ts'
      - 'saas/provider-hub-host/universal-mcp-gateway.ts'
      - 'saas/provider-hub-host/mcp-certification.ts'
      - 'saas/provider-hub-host/mcp-gateway-audit.ts'
      - 'saas/scripts/mcp-gateway/run-universal-mcp-acceptance.ts'

permissions:
  contents: read

jobs:
  live-universal-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_MCP_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MCP_PROJECT_REF: qpblefwtnbivuusxmabv
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      FIGMA_MCP_OAUTH_ACCESS_TOKEN: ${{ secrets.FIGMA_MCP_OAUTH_ACCESS_TOKEN }}
      VERCEL_MCP_OAUTH_ACCESS_TOKEN: ${{ secrets.VERCEL_MCP_OAUTH_ACCESS_TOKEN }}
      VERCEL_MCP_TEAM_SLUG: ${{ secrets.VERCEL_MCP_TEAM_SLUG }}
      VERCEL_MCP_PROJECT_SLUG: ${{ secrets.VERCEL_MCP_PROJECT_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript runner
        working-directory: saas
        run: npm install --no-save --ignore-scripts tsx@4.20.6
      - name: Require Supabase MCP management credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is required for real Supabase MCP acceptance."
            exit 1
          fi
      - name: Run real GitHub Supabase Context7 and optional Figma Vercel MCP acceptance
        working-directory: saas
        run: npx tsx scripts/mcp-gateway/run-universal-mcp-acceptance.ts
      - name: Upload metadata-only MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-mcp-live-acceptance
          path: saas/artifacts/universal-mcp-live-acceptance.json
          if-no-files-found: warn
