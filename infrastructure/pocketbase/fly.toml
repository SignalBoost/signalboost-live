app = "signalboost-pocketbase-cadomos"
primary_region = "iad"

[build]
  dockerfile = "infrastructure/pocketbase/Dockerfile"
  [build.args]
    PB_VERSION = "0.29.3"

[env]
  PORT = "8090"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "pocketbase_data"
  destination = "/pb/pb_data"
