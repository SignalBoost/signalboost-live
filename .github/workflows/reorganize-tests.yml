# .github/workflows/reorganize-tests.yml
name: Reorganize tests directory

# Run this from the Actions tab: pick this workflow, press "Run workflow".
# It pushes a branch and prints a ready-to-paste pull request body in the run
# summary. Nothing changes on main until you open that PR and merge it.
#
# Why this workflow no longer opens the PR itself (2026-09-20):
#   1. A PR opened with GITHUB_TOKEN does not start `pull_request` workflow runs.
#      "Main Write Discipline" and "Onboarding Enforcement" are required checks,
#      so a bot-opened PR sits with those checks never reported and can never be
#      merged. The button looked pressed and nothing ever landed.
#   2. "Onboarding Enforcement" also requires ONBOARD_ACK_BLOB and REPO_SCAN_HEAD
#      lines in the PR body. The previous body carried neither, so even a
#      human-triggered re-run would have failed that check.
# The branch it pushes is fully compliant: .github/main-write-token already names
# the base commit and the branch, and the summary gives you the exact body text.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Move tests into domain directories
        working-directory: saas
        run: node scripts/reorganize-tests.mjs

      - name: Verify the layout guard passes
        working-directory: saas
        run: node scripts/check-test-directory-health.mjs

      - name: Push the branch and print the pull request body
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="chore/reorganize-tests-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Branch protection on main requires this file to name the PR base and
          # the PR branch, and requires the PR to modify it. GITHUB_SHA is the
          # commit this run checked out, which is what GitHub will report as the
          # PR base as long as main has not advanced in the meantime.
          printf 'base_sha=%s\nbranch=%s\n' "$GITHUB_SHA" "$BRANCH" > .github/main-write-token

          git add -A
          git commit -m "chore: split saas/tests into domain directories and discover tests by glob"
          git push origin "$BRANCH"

          HEAD_SHA="$(git rev-parse HEAD)"
          ONBOARD_BLOB="$(git hash-object ONBOARD.md)"
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"

          {
            echo "## Branch pushed"
            echo
            echo "**${BRANCH}**"
            echo
            echo "Open the pull request here: ${COMPARE_URL}"
            echo
            echo "Paste this as the **entire** pull request body. Both acknowledgement"
            echo "lines are checked verbatim by Onboarding Enforcement."
            echo
            echo '```text'
            echo "Moves every file in saas/tests into a domain subdirectory so no directory"
            echo "approaches GitHub's 1,000-file listing cap, rewrites relative imports and"
            echo "new URL source reads for the new depth, replaces the hand-maintained test"
            echo "filename list with glob discovery so every test file actually runs in CI,"
            echo "repoints workflow path filters, and adds a prebuild guard against regrowth."
            echo "Verified: no import that resolved before the move fails after it."
            echo
            echo "ONBOARD_ACK_BLOB: ${ONBOARD_BLOB}"
            echo "REPO_SCAN_HEAD: ${HEAD_SHA}"
            echo '```'
            echo
            echo "If main advances before you open the PR, Main Write Discipline will report"
            echo "a stale base. Re-run this workflow rather than editing the token by hand."
          } >> "$GITHUB_STEP_SUMMARY"
