name: One-shot ONBOARD Builder model update

on:
  push:
    branches:
      - feat/builder-deepseek-routing-20260902

permissions:
  contents: write

jobs:
  update-onboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-deepseek-routing-20260902
          fetch-depth: 0

      - name: Update ONBOARD without rewriting unrelated content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ONBOARD.md')
          text = path.read_text()

          text = text.replace('**Version:** 1.31', '**Version:** 1.32', 1)
          text = text.replace('**Updated:** 2026-09-01 UTC', '**Updated:** 2026-09-03 UTC', 1)

          primary = '**COS primary reasoner:** DeepInfra managed open-model runtime → `Qwen/Qwen3.6-35B-A3B`  '
          model_line = ('**Builder coding reasoner — PR #1809 implementation / runtime acceptance pending:** '
                        'DeepInfra managed open-model runtime → `deepseek-ai/DeepSeek-V4-Flash-0731`. '
                        'This coding model is selected only after a request has entered authenticated COS Builder or COS Platform Engineer; '
                        'ordinary COS and Concierge reasoning remains on `Qwen/Qwen3.6-35B-A3B`. '
                        'Builder uses the existing DeepInfra endpoint and credentials through a dedicated coding port, bypassing shared answer-cache reuse '
                        'and external-provider fallback while preserving all existing workspace/repository authority, sandbox, approval, and proving-command gates. '
                        '`DEEPINFRA_BUILDER_MODEL` is an independent controlled-evaluation override; no automatic DeepSeek V4 Pro escalation is enabled.')
          if model_line not in text:
              if primary not in text:
                  raise SystemExit('COS primary reasoner anchor not found')
              text = text.replace(primary, primary + '\n' + model_line, 1)

          builder_detail = ('**Builder model specialization — PR #1809:** implementation routes both ordinary Builder workspace jobs and '
                            'SignalBoost repository-repair/Platform Engineer jobs through the Builder-only DeepSeek V4 Flash coding port. '
                            'The mandatory routing regression proves the actual `/chat/completions` request selects '
                            '`deepseek-ai/DeepSeek-V4-Flash-0731` while `LOCAL_AI_MODEL` remains `Qwen/Qwen3.6-35B-A3B`; TypeScript, full unit tests, '
                            'Next production build, Playwright, Repo Targeting QA, Main Write Discipline, Onboarding Enforcement, Pipeline Integrity, and '
                            'other triggered GitHub checks were green on the first PR head before this documentation update. '
                            'Do not call this Production-accepted until the merged deployment and a real authenticated Builder coding/repair turn show '
                            'model telemetry for DeepSeek plus successful tool proof. No Pro escalation is part of this change.')
          if builder_detail not in text:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if line.startswith('**COS Builder developer loop:**'):
                      lines.insert(index + 1, builder_detail)
                      text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
                      break
              else:
                  raise SystemExit('COS Builder developer loop anchor not found')

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit documentation
        run: |
          rm .github/workflows/update-onboard-builder-deepseek-once.yml
          git config user.name "SignalBoost Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ONBOARD.md .github/workflows/update-onboard-builder-deepseek-once.yml
          git diff --cached --check
          git commit -m "docs(onboard): record Builder DeepSeek routing"
          git push origin HEAD:feat/builder-deepseek-routing-20260902