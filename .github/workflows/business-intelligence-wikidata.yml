name: Business Intelligence Wikidata Seed

on:
  pull_request:
    paths:
      - 'saas/lib/business-intelligence-corpus/wikidata-public.ts'
      - 'saas/lib/business-intelligence-corpus/wikidata-public-parser.ts'
      - 'saas/lib/business-intelligence-corpus/wikidata-population.ts'
      - 'saas/app/api/admin/business-intelligence-corpus/seed-wikidata/route.ts'
      - 'saas/app/api/cron/business-intelligence-corpus-populate/route.ts'
      - 'saas/supabase/migrations/20260816_business_intelligence_corpus_seed_state.sql'
      - 'saas/tests/businessIntelligenceWikidata.node.test.ts'
      - 'saas/tests/businessIntelligenceWikidataPopulation.node.test.ts'
      - 'saas/vercel.json'
      - '.github/workflows/business-intelligence-wikidata.yml'
  push:
    branches: [main]
    paths:
      - 'saas/lib/business-intelligence-corpus/wikidata-public.ts'
      - 'saas/lib/business-intelligence-corpus/wikidata-public-parser.ts'
      - 'saas/lib/business-intelligence-corpus/wikidata-population.ts'
      - 'saas/app/api/admin/business-intelligence-corpus/seed-wikidata/route.ts'
      - 'saas/app/api/cron/business-intelligence-corpus-populate/route.ts'
      - 'saas/supabase/migrations/20260816_business_intelligence_corpus_seed_state.sql'
      - 'saas/tests/businessIntelligenceWikidata.node.test.ts'
      - 'saas/tests/businessIntelligenceWikidataPopulation.node.test.ts'
      - 'saas/vercel.json'
      - '.github/workflows/business-intelligence-wikidata.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - run: node --test tests/businessIntelligenceWikidata.node.test.ts tests/businessIntelligenceWikidataPopulation.node.test.ts
      - run: npm run typecheck
