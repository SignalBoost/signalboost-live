name: Pipeline Integrity

# Run once for each PR revision and once after changes land on main.
# Feature-branch push events are intentionally excluded because the PR event
# validates the same revision and duplicate runs create Actions queue pressure.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-integrity-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Verify workers, workflows, and routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Zero-dependency checks — no npm install, finishes in seconds.
      - name: Verify worker scripts and workflow files (misfile guard)
        run: node scripts/verify-workers.mjs

      - name: Verify Actions queue policy
        run: node scripts/verify-actions-queue-policy.mjs

      - name: Verify route handler / page structure
        run: node scripts/verify-route-handlers.mjs
