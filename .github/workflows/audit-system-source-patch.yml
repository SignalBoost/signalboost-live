name: Audit System Source Patch

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-system-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Move merge ownership to the end-to-end controller
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('saas/lib/audit/approvedRunRemediation.ts')
          content = path.read_text()

          old_existing = """    if (payload?.kind === 'audit_batch_remediation' && payload?.approval === 'final' && payload?.ok === true) {
              return payload as ApprovedRunRemediationResult
            }"""
          new_existing = """    if (
              payload?.kind === 'audit_batch_remediation' &&
              payload?.approval === 'final' &&
              payload?.ok === true &&
              payload?.status !== 'partial' &&
              payload?.lifecycleStatus !== 'partial'
            ) {
              return payload as ApprovedRunRemediationResult
            }"""

          old_merge = "  const autoMerge = await queueAutoMerge(prNumber)"
          new_merge = "  const autoMerge = { queued: false, error: 'Deferred to the end-to-end remediation controller.' }"

          if content.count(old_existing) != 1:
              raise SystemExit(f'expected one existing-remediation block, found {content.count(old_existing)}')
          if content.count(old_merge) != 1:
              raise SystemExit(f'expected one legacy auto-merge call, found {content.count(old_merge)}')

          content = content.replace(old_existing, new_existing)
          content = content.replace(old_merge, new_merge)
          path.write_text(content)
          PY

      - name: Commit focused source change
        run: |
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/lib/audit/approvedRunRemediation.ts
          git commit -m 'Defer audit merge until lifecycle preparation completes'
          git push origin HEAD:fix/audit-system-end-to-end
