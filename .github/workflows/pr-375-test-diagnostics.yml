name: PR 375 Test Diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-375-test-diagnostics.yml'
      - 'saas/**'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - shell: bash
        run: |
          set +e
          cd saas
          npm install --no-audit --no-fund >/dev/null 2>&1
          npm test > ../saas-test.log 2>&1
          echo $? > ../saas-test.exit
          npm run verify:issue-205 > ../issue-205.log 2>&1
          echo $? > ../issue-205.exit
      - uses: actions/upload-artifact@v4
        with:
          name: pr-375-test-diagnostics
          path: |
            *.log
            *.exit
