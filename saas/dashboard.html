
<script>
  async function publishSite() {
    const res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: 'index.html',
        content: '<h1>SignalBoost</h1>'
      })
    });
    const data = await res.json();
    alert(data.message);
  }
</script>
<button onclick="publishSite()">Publish Site</button>
