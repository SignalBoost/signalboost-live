name: Require ONBOARD.md Critical File Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - 'ONBOARD.md'
      - '.github/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'auditor-router/**'
      - 'compliance/**'
      - 'k8s/**'
      - 'monitoring/**'
      - 'services/cos-ai-department/**'
      - 'saas/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  critical-onboard-maintenance:
    name: Critical files require ONBOARD.md update or no-change statement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ONBOARD.md maintenance for critical files
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          EXCEPTION='No onboarding behavior change; mechanical/refactor-only update.'

          echo "Changed files in this PR:"
          echo "$CHANGED_FILES"
          echo ""

          CRITICAL_PATTERN='(^ONBOARD\.md$|^\.github/(workflows/|CODEOWNERS|pull_request_template\.md)|(^|/)(cosa|cos-|video|provider|template|vercel|env|supabase|storage|bucket|audit|auditor|cyber|security|vault|secret|approval|infra|infrastructure|workflow|onboard)[^/]*|^(app|components|lib|scripts|auditor-router|compliance|k8s|monitoring|services/cos-ai-department|saas)/(.*(cosa|cos-|video|provider|template|vercel|env|supabase|storage|bucket|audit|auditor|cyber|security|vault|secret|approval|infra|infrastructure|workflow|onboard).*)|^saas/(app|components|lib|scripts|supabase|marketing-sales-core|marketing-sales-host|docs)/|^docs/.*(COSA|AUDIT|audit|cyber|supabase|vercel|onboard).*)'
          CRITICAL_FILES="$(echo "$CHANGED_FILES" | grep -Ei "$CRITICAL_PATTERN" || true)"
          ONBOARD_UPDATED="$(echo "$CHANGED_FILES" | grep -x 'ONBOARD.md' || true)"

          if [ -n "$CRITICAL_FILES" ] && [ -z "$ONBOARD_UPDATED" ] && ! grep -Fq "$EXCEPTION" <<< "$PR_BODY"; then
            echo "::error title=ONBOARD.md update or no-change statement required::This PR changes ONBOARD-sensitive files but does not update ONBOARD.md or include the exact mechanical/refactor-only statement."
            echo ""
            echo "❌ CRITICAL ONBOARDING CHECK FAILED"
            echo ""
            echo "Why this failed:"
            echo "  Critical changes can affect COSA, video pipeline, provider templates, Vercel env handling, Supabase, storage buckets, audit, cybersecurity, or other onboarding-sensitive behavior."
            echo "  The owner should not have to manually remind developers to keep ONBOARD.md current."
            echo ""
            echo "Critical files that triggered the rule:"
            echo "$CRITICAL_FILES" | sed 's/^/  - /'
            echo ""
            echo "How to fix one of two ways:"
            echo "  1. Update ONBOARD.md in this PR to describe the changed onboarding-relevant behavior."
            echo "  2. If this is only a mechanical/refactor-only update, edit the PR body and add this exact sentence:"
            echo ""
            echo "     No onboarding behavior change; mechanical/refactor-only update."
            echo ""
            echo "Rule triggered by pattern:"
            echo "  $CRITICAL_PATTERN"
            exit 1
          fi

          echo "✅ Critical onboarding check passed."
          if [ -n "$CRITICAL_FILES" ]; then
            if [ -n "$ONBOARD_UPDATED" ]; then
              echo "Critical files changed and ONBOARD.md was updated."
            else
              echo "Critical files changed and PR body contains the approved mechanical/refactor-only statement."
            fi
          else
            echo "No ONBOARD-sensitive critical paths changed."
          fi
