# .github/workflows/diag-cos-assistant-evidence.yml
# Temporary, read-only evidence pull for the 2026-10-15 Assistant timeout. Runs only on this branch.
name: Diag COS Assistant Evidence
on:
  push:
    branches: [diag/cos-assistant-evidence-20261015]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read recent owner turns
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_URL2: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const url = (process.env.SB_URL || process.env.SB_URL2 || '').replace(/\/$/, '')
          const key = process.env.SB_KEY || ''
          const esc = v => String(v).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A')
          const note = (t, v) => console.log(`::notice title=${t}::${esc(v)}`)
          if (!url || !key) { note('config', `url=${Boolean(url)} key=${Boolean(key)}`); process.exit(1) }
          const h = { apikey: key, Authorization: `Bearer ${key}` }
          const get = async path => { const r = await fetch(`${url}/rest/v1/${path}`, { headers: h }); return { status: r.status, body: await r.json().catch(() => null) } }
          const since = new Date(Date.now() - 4 * 3600_000).toISOString()
          const users = await get(`assistant_messages?select=id,conversation_id,user_id,created_at,content&role=eq.user&created_at=gte.${since}&content=ilike.*Thank%20you%20Tim*&order=created_at.asc&limit=20`)
          note('user-turns', `http=${users.status} count=${Array.isArray(users.body) ? users.body.length : JSON.stringify(users.body).slice(0,300)}`)
          for (const u of (Array.isArray(users.body) ? users.body : [])) {
            const next = await get(`assistant_messages?select=role,created_at,content,provenance&conversation_id=eq.${u.conversation_id}&created_at=gte.${encodeURIComponent(u.created_at)}&order=created_at.asc&limit=4`)
            const rows = (Array.isArray(next.body) ? next.body : []).map(r => `${r.created_at} ${r.role} src=${r.provenance?.response_source || r.provenance?.source || r.provenance?.schema || '-'} status=${r.provenance?.status || '-'} :: ${String(r.content || '').replace(/\s+/g,' ').slice(0, 160)}`)
            note(`turn ${u.created_at}`, `conv=${u.conversation_id} len=${String(u.content).length}\n` + rows.join('\n'))
          }
          const convs = await get(`assistant_conversations?select=id,updated_at,message_count,title&updated_at=gte.${since}&order=updated_at.desc&limit=8`)
          note('recent-conversations', (Array.isArray(convs.body) ? convs.body : [convs.body]).map(c => `${c?.updated_at} n=${c?.message_count} ${String(c?.title || '').slice(0,60)} ${c?.id}`).join('\n'))
          NODE
