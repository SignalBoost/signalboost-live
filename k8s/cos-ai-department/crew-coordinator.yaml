apiVersion: apps/v1
kind: Deployment
metadata:
  name: cos-ai-crew-coordinator
  namespace: cos-ai-department
  labels:
    app: cos-ai-department
    role: crew-coordinator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cos-ai-department
      role: crew-coordinator
  template:
    metadata:
      labels:
        app: cos-ai-department
        role: crew-coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: signalboost/cos-ai-department:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COS_AI_ROLE
              value: crew-coordinator
            - name: COS_CREWAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: cos-crewai-private-inference
                  key: base-url
            - name: COS_CREWAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: cos-crewai-private-inference
                  key: model
            - name: COS_CREWAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cos-crewai-private-inference
                  key: api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cos-ai-crew-coordinator
  namespace: cos-ai-department
  labels:
    app: cos-ai-department
    role: crew-coordinator
spec:
  selector:
    app: cos-ai-department
    role: crew-coordinator
  ports:
    - name: http
      port: 80
      targetPort: http
