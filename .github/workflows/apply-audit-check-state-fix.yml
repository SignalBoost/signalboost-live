          let autonomousTest = fs.readFileSync(autonomousTestPath, 'utf8')
          autonomousTest += `

test('failed GitHub checks and stalled stages never look actively pending', () => {
  const lifecycle = read('../components/audit/RemediationLifecyclePanel.tsx')
