name: RunPod Serverless Embedding Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'runpod/serverless-embedding/**'
      - '.github/workflows/runpod-serverless-embedding.yml'
  push:
    branches: [main]
    paths:
      - 'runpod/serverless-embedding/**'
      - '.github/workflows/runpod-serverless-embedding.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish only from main
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/serverless-embedding
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/signalboost/itmounts-embedding-serverless:latest
            ghcr.io/signalboost/itmounts-embedding-serverless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
