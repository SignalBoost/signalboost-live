name: Restore Mission 001 onboarding guidance

on:
  push:
    branches:
      - codex/mission-001-bpal-audited-selector
    paths:
      - .github/workflows/mission-001-restore-onboard.yml

permissions:
  contents: write

jobs:
  restore-onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/mission-001-bpal-audited-selector
          fetch-depth: 0

      - name: Restore exact RLS guidance and remove helper workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ONBOARD.md')
          content = path.read_text(encoding='utf-8')
          before = "Durable records are coordination/audit metadata only. They cannot authorize replay, cannot reconstruct a lost browser session, cannot persist Browser/Page/Context objects, and cannot store approval tokens, credentials, cookies, secrets, authorization headers, or browser storage. Browser owner loss marks browser work abandoned; retries require a new execution ID, new policy decision, and fresh Browser Runtime approvals. Production and real-provider Browser execution remain disabled.\n### Sprint 17 — Durable Sandbox Execution Records and Operator Audit History"
          after = "Durable records are coordination/audit metadata only. They cannot authorize replay, cannot reconstruct a lost browser session, cannot persist Browser/Page/Context objects, and cannot store approval tokens, credentials, cookies, secrets, authorization headers, or browser storage. Browser owner loss marks browser work abandoned; retries require a new execution ID, new policy decision, and fresh Browser Runtime approvals. Production and real-provider Browser execution remain disabled.\n\nRLS is enabled for coordination tables. Anonymous reads are denied, public client writes are not granted, mutation RPCs are reserved for server/service-role paths, and authenticated operator visibility is read-only and sanitized. All new operator-facing labels must exist in English, Spanish, Portuguese, Polish, and Russian.\n\n### Sprint 17 — Durable Sandbox Execution Records and Operator Audit History"
          if content.count(before) != 1:
              raise SystemExit('Expected exactly one missing-RLS onboarding boundary')
          path.write_text(content.replace(before, after, 1), encoding='utf-8')
          PY
          rm .github/workflows/mission-001-restore-onboard.yml
          git diff --check
          grep -F "RLS is enabled for coordination tables." ONBOARD.md
          grep -F "Added the governed Mission 001 BPAL selector boundary." ONBOARD.md

      - name: Commit focused correction
        shell: bash
        run: |
          git config user.name "SignalBoost Mission 001"
          git config user.email "actions@users.noreply.github.com"
          git add ONBOARD.md .github/workflows/mission-001-restore-onboard.yml
          git commit -m "docs: restore Sprint 19 RLS guidance"
          git push origin HEAD:codex/mission-001-bpal-audited-selector
