name: Patch Audit Check State Typing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-check-failure-progress
          fetch-depth: 0

      - name: Complete PullRequestRef typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('saas/lib/audit/approvedRunRemediationSystem.ts')
          text = path.read_text()
          before = "      mergeable: true,\n      mergeableState: 'clean',\n    }"
          after = "      mergeable: true,\n      mergeableState: 'clean',\n      baseSha: '',\n      headRef: '',\n    }"
          if before not in text:
              raise SystemExit('Synthetic PR object not found')
          path.write_text(text.replace(before, after, 1))
          PY
          rm -f .github/workflows/patch-audit-check-state-typing.yml

      - name: Commit typing fix
        run: |
          git config user.name "SignalBoost Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete audit check-state typing"
          git push origin HEAD:fix/audit-check-failure-progress
