name: Onboarding Enforcement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-current-onboarding:
    name: Require current ONBOARD, repo scan, and main integration token
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify acknowledgement matches current files and head
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ ! -f ONBOARD.md ]]; then
            echo "::error::ONBOARD.md is missing from the PR head."
            exit 1
          fi

          onboard_blob="$(git hash-object ONBOARD.md)"
          body="${PR_BODY:-}"

          expected_onboard="ONBOARD_ACK_BLOB: ${onboard_blob}"
          expected_scan="REPO_SCAN_HEAD: ${PR_HEAD}"

          if ! grep -Fqx "${expected_onboard}" <<< "${body}"; then
            echo "::error::Missing or stale ONBOARD acknowledgement. Read the current root ONBOARD.md and add this exact line to the PR body:"
            echo "${expected_onboard}"
            exit 1
          fi

          if ! grep -Fqx "${expected_scan}" <<< "${body}"; then
            echo "::error::Missing or stale repository-scan acknowledgement. Re-scan the repository at the current PR head and add this exact line to the PR body:"
            echo "${expected_scan}"
            exit 1
          fi

          if [[ "$PR_BASE_REF" == "main" ]]; then
            token='.github/main-write-token'
            if [[ ! -f "$token" ]]; then
              echo "::error::${token} is missing. Every PR targeting main must update the shared serialization token."
              exit 1
            fi

            expected_base="base_sha=${PR_BASE}"
            expected_branch="branch=${PR_HEAD_REF}"
            if ! grep -Fqx "$expected_base" "$token"; then
              echo "::error::Stale main integration base. Refresh from current main and set: ${expected_base}"
              exit 1
            fi
            if ! grep -Fqx "$expected_branch" "$token"; then
              echo "::error::Main integration token must identify the PR branch exactly: ${expected_branch}"
              exit 1
            fi
            if git diff --quiet "$PR_BASE" "$PR_HEAD" -- "$token"; then
              echo "::error::Every PR to main must modify ${token}. This shared write serializes concurrent agents."
              exit 1
            fi
          fi

          echo "ONBOARD acknowledgement matches the exact Git blob."
          echo "Repository scan acknowledgement matches the exact PR head."
          if [[ "$PR_BASE_REF" == "main" ]]; then
            echo "Main integration token matches the current base and PR branch."
          fi
