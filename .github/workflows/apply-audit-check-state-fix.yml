`          <span className={\`inline-block h-2 w-2 rounded-full \${status === 'merged' ? 'bg-[#34d399]' : status === 'failed' || status === 'checks_failed' ? 'bg-danger' : 'animate-pulse bg-accent'}\`} />`, 'title status dot')
          panel = replaceRequired(panel,
