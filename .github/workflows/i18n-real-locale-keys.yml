name: I18n Real Locale Keys

on:
  pull_request:
    branches:
      - main
    paths:
      - 'saas/**'
      - '.github/workflows/i18n-real-locale-keys.yml'

permissions:
  contents: write

concurrency:
  group: i18n-real-locale-keys-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-real-locale-keys
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore the obsolete generated-copy migration
        run: node scripts/restore-generated-ui-copy.mjs
      - name: Prepare migration safeguards
        run: node scripts/prepare-real-locale-migration.mjs
      - name: Move UI copy into locale dictionaries
        run: node scripts/migrate-page-copy-to-locales.mjs --write
      - name: Clear resolved legacy baseline
        run: node scripts/check-hardcoded-copy.mjs --write-baseline
      - name: Make locale-key guards blocking
        run: npm pkg set 'scripts.validate:i18n-copy=node scripts/check-hardcoded-copy.mjs && node scripts/migrate-page-copy-to-locales.mjs'
      - name: Reject generated English lookup tables
        run: test ! -e lib/i18n/generatedUiCopy.ts
      - name: Validate locale-key source
        run: npm run validate:i18n-copy
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ../typecheck.log
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../build.log
      - name: Unit and contract tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../npm-test.log
      - name: Capture migration evidence
        if: always()
        run: |
          node scripts/migrate-page-copy-to-locales.mjs > ../locale-key-report.txt 2>&1 || true
          git diff --stat > ../locale-key-stat.txt
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-real-locale-key-evidence
          path: |
            typecheck.log
            build.log
            npm-test.log
            locale-key-report.txt
            locale-key-stat.txt
          if-no-files-found: warn
      - name: Commit validated migration
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git config user.name 'SignalBoost Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas
          if git diff --cached --quiet; then
            echo 'No migration changes remain.' | tee ../push.log
          else
            git commit -m 'fix(i18n): move page copy into real locale keys'
            git format-patch --stdout "${EXPECTED_HEAD}..HEAD" > ../validated-i18n.patch
            git bundle create ../validated-i18n.bundle HEAD "^${EXPECTED_HEAD}"
            git fetch origin fix/i18n-real-locale-keys
            git push --verbose --force-with-lease="refs/heads/fix/i18n-real-locale-keys:${EXPECTED_HEAD}" origin HEAD:refs/heads/fix/i18n-real-locale-keys 2>&1 | tee ../push.log
          fi
      - name: Upload validated commit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-validated-commit
          path: |
            push.log
            validated-i18n.patch
            validated-i18n.bundle
          if-no-files-found: warn
