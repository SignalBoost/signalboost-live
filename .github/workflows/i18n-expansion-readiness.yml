# .github/workflows/i18n-expansion-readiness.yml
name: i18n eleven-language platform
on:
  pull_request:
    paths:
      - 'saas/lib/i18n/**'
      - 'saas/components/i18n/**'
      - 'saas/scripts/check-eleven-language-platform.mjs'
      - 'saas/scripts/check-eleven-language-coverage.mjs'
      - 'saas/scripts/audit-locale-structure.mjs'
      - 'saas/scripts/inventory-app-router-i18n.mjs'
      - 'saas/scripts/generated-ui-locale-utils.mjs'
      - 'saas/app/**'
      - 'saas/components/**'
      - 'saas/locales/*.json'
      - 'saas/public/i18n/*.json'
      - 'saas/marketing-sales-core/i18n/**'
      - 'saas/components/LanguageSuggestion.tsx'
      - 'saas/tests/sixLanguageCampaignPages.node.test.ts'
      - 'saas/tests/navbarLanguageOptions.node.test.ts'
      - 'saas/tests/platformElevenLanguageI18n.node.test.ts'
      - '.github/workflows/i18n-expansion-readiness.yml'
jobs:
  ensure-safe-expansion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce the eleven-language production contract
        run: node scripts/check-eleven-language-platform.mjs
      - name: Require complete coverage for every active language
        run: node scripts/check-eleven-language-coverage.mjs --require-all
      - name: Audit exact keys, types and interpolation tokens across all locale stores
        run: node scripts/audit-locale-structure.mjs --report .i18n-evidence/locale-structure.json
      - name: Upload locale structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eleven-language-structure-evidence
          path: saas/.i18n-evidence/locale-structure.json
          if-no-files-found: warn
      - name: Inventory actual routes for full-site localization work
        run: node scripts/inventory-app-router-i18n.mjs --report .i18n-evidence/app-route-inventory.json
      - name: Upload route inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-app-route-inventory
          path: saas/.i18n-evidence/app-route-inventory.json
          if-no-files-found: warn
      - name: Verify language picker, public campaign pages and platform language tests
        run: node --test tests/navbarLanguageOptions.node.test.ts tests/sixLanguageCampaignPages.node.test.ts tests/platformElevenLanguageI18n.node.test.ts
