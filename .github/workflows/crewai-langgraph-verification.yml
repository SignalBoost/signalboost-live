name: CrewAI LangGraph verification

on:
  push:
    branches:
      - feat/cos-crewai-specialist-crew-20260911
    paths:
      - '.github/workflows/crewai-langgraph-verification.yml'
      - 'scripts/patch_crewai_langgraph_delegation.py'
      - 'saas/lib/cos-core/orchestration/index.ts'
      - 'saas/lib/ai/cos/specialistCrewMission.ts'
      - 'saas/tests/cosSpecialistCrewMission.node.test.ts'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cos-crewai-specialist-crew-20260911
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Wire CrewAI through LangGraph
        run: python scripts/patch_crewai_langgraph_delegation.py

      - name: Install SaaS dependencies
        working-directory: saas
        run: npm ci

      - name: Test LangGraph and CrewAI delegation
        working-directory: saas
        run: node --test tests/cosLangGraph.node.test.ts tests/cosSpecialistCrewClient.node.test.ts tests/cosSpecialistCrewMission.node.test.ts

      - name: Typecheck SaaS
        working-directory: saas
        run: npm run typecheck

      - name: Commit verified LangGraph wiring
        run: |
          rm .github/workflows/crewai-langgraph-verification.yml
          rm scripts/patch_crewai_langgraph_delegation.py
          git config user.name 'SignalBoost Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/app/api/support/routeCoreLegacy.ts ONBOARD.md .github/workflows/crewai-langgraph-verification.yml scripts/patch_crewai_langgraph_delegation.py
          git commit -m 'feat(cos): verify CrewAI specialist missions with LangGraph'
          git push origin HEAD:feat/cos-crewai-specialist-crew-20260911
