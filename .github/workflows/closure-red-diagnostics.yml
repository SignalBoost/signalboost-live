name: V1 Red Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/closure-red-diagnostics.yml'
      - 'saas/**'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - shell: bash
        run: |
          set +e
          npm test > unit.log 2>&1; echo $? > unit.exit
          npm run verify:issue-205 > guards.log 2>&1; echo $? > guards.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: red-check-diagnostics
          path: |
            saas/unit.log
            saas/unit.exit
            saas/guards.log
            saas/guards.exit
      - run: test "$(cat unit.exit)" = 0 -a "$(cat guards.exit)" = 0
