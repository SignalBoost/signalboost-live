name: Phase 4 Lab ledger acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/lab-ledger-acceptance.yml'
      - 'saas/supabase/migrations/20261006190000_itmounts_lab_tenancy_credit_ledger.sql'
      - 'saas/supabase/migrations/20261006210000_lab_experiment_budget_enforcement.sql'
      - 'saas/supabase/migrations/20261008030000_lab_approved_usage_rates.sql'
      - 'saas/supabase/migrations/20261008040000_lab_rated_capture_receipts.sql'
      - 'saas/supabase/migrations/20261008050000_lab_capture_provenance_audit.sql'
      - 'saas/supabase/migrations/20261008060000_lab_capture_rate_reconciliation_audit.sql'
      - 'saas/tests/sql/lab-*.sql'
      - 'saas/tests/phase4StripeTestVerification.node.test.mjs'
      - 'saas/lib/billing/phase4StripeTestVerification.mjs'
      - 'saas/lib/billing/phase4StripeTestCheckout.mjs'
      - 'saas/tests/phase4StripeTestCheckout.node.test.mjs'
      - 'saas/lib/billing/phase4VerifiedTestSettlementEnvelope.mjs'
      - 'saas/lib/billing/phase4VerifiedTestSettlementHandoff.mjs'
      - 'saas/lib/billing/phase4CommercialWalletAudit.mjs'
      - 'saas/tests/phase4CommercialWalletAudit.node.test.mjs'
      - 'saas/tests/phase4VerifiedTestSettlementHandoff.node.test.mjs'
      - 'saas/tests/phase4StripeTestDatabaseIntegration.node.test.mjs'
      - 'saas/tests/phase4VerifiedTestSettlementEnvelope.node.test.mjs'
      - 'saas/supabase/migrations/20261008170000_lab_commercial_credit_wallet_foundation.sql'
      - 'saas/supabase/migrations/20261008180000_lab_commercial_atomic_grant_proof.sql'
      - 'saas/supabase/migrations/20261008190000_lab_commercial_event_claim_tenant_binding.sql'
      - 'saas/supabase/migrations/20261008200000_lab_commercial_grant_reconciliation.sql'
      - 'saas/supabase/migrations/20261008210000_lab_commercial_stripe_settlement_evidence.sql'
      - 'saas/supabase/migrations/20261008220000_lab_commercial_stripe_evidence_reconciliation.sql'
      - 'saas/supabase/migrations/20261008230000_lab_testmode_atomic_stripe_settlement.sql'
      - 'saas/supabase/migrations/20261008240000_lab_commercial_claim_reconciliation_source_binding.sql'
      - 'saas/supabase/migrations/20261009000000_lab_testmode_settlement_rate_guard.sql'
      - 'saas/supabase/migrations/20261009210000_lab_commercial_reconciliation_usage_safe.sql'
      - 'saas/supabase/migrations/20261009170000_lab_testmode_commercial_wallet_event.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-ledger:
    name: Disposable PostgreSQL ledger acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: lab_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: lab_acceptance
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap isolated Supabase-compatible roles
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL
      - name: Apply Lab migrations in chronological order
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261006190000_itmounts_lab_tenancy_credit_ledger.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261006210000_lab_experiment_budget_enforcement.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008030000_lab_approved_usage_rates.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008040000_lab_rated_capture_receipts.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008050000_lab_capture_provenance_audit.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008060000_lab_capture_rate_reconciliation_audit.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008170000_lab_commercial_credit_wallet_foundation.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008180000_lab_commercial_atomic_grant_proof.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008190000_lab_commercial_event_claim_tenant_binding.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008200000_lab_commercial_grant_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008210000_lab_commercial_stripe_settlement_evidence.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008220000_lab_commercial_stripe_evidence_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008230000_lab_testmode_atomic_stripe_settlement.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261008240000_lab_commercial_claim_reconciliation_source_binding.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261009000000_lab_testmode_settlement_rate_guard.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261009210000_lab_commercial_reconciliation_usage_safe.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261009170000_lab_testmode_commercial_wallet_event.sql
      - name: Verify tenancy and ledger adversarial invariants
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-enterprise-adversarial-acceptance.sql
      - name: Verify ledger event accounting and idempotency
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-credit-ledger-acceptance.sql
      - name: Verify experiment budget limits
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-experiment-budget-acceptance.sql
      - name: Verify concurrent reservations with independent database sessions
        shell: bash
        run: bash saas/tests/sql/lab-ledger-concurrency-acceptance.sh
      - name: Verify immutable measured-cost capture receipt contract
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-measured-capture-contract.sql
      - name: Verify immutable approved usage-rate contract
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-approved-rate-contract.sql
      - name: Verify rated capture receipt binding
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-rated-capture-acceptance.sql
      - name: Verify unrated legacy captures fail provenance audit
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-capture-provenance-audit.sql

      - name: Reject rated capture with forged rate arithmetic
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-capture-rate-reconciliation-acceptance.sql

      - name: Verify BYOI isolated experiment accounting
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-byoi-experiment-accounting-acceptance.sql

      - name: Verify inactive commercial wallet schema boundaries
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-commercial-wallet-foundation-acceptance.sql
      - name: Verify atomic commercial grant proof
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-commercial-atomic-grant-acceptance.sql

      - name: Reject cross-tenant commercial event claims
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-commercial-event-claim-tenant-acceptance.sql

      - name: Verify private commercial grant reconciliation
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-commercial-grant-reconciliation-acceptance.sql

      - name: Verify closed Stripe settlement evidence contract
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-commercial-stripe-settlement-evidence-acceptance.sql

      - name: Verify private Stripe evidence reconciliation
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-commercial-stripe-evidence-reconciliation-acceptance.sql

      - name: Prove atomic test-only Stripe wallet settlement
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-testmode-atomic-stripe-settlement-acceptance.sql

      - name: Guard USD test settlement credit rate conversion
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-testmode-settlement-rate-guard-acceptance.sql

      - name: Verify authoritative Stripe test-mode proof contract
        shell: bash
        run: node --test saas/tests/phase4StripeTestVerification.node.test.mjs

      - name: Verify Stripe test authoritative API retrieval boundary
        shell: bash
        run: node --test saas/tests/phase4StripeTestRetrieval.node.test.mjs

      - name: Verify signed and retrieved Stripe test evidence envelope
        shell: bash
        run: node --test saas/tests/phase4VerifiedTestSettlementEnvelope.node.test.mjs

      - name: Verify closed Stripe test settlement handoff
        shell: bash
        run: node --test saas/tests/phase4VerifiedTestSettlementHandoff.node.test.mjs

      - name: Verify commercial wallet balance invariants
        shell: bash
        run: node --test saas/tests/phase4CommercialWalletAudit.node.test.mjs

      - name: Verify test-only wallet reservation, capture and release
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-testmode-commercial-wallet-usage-acceptance.sql

      - name: Verify signed Stripe test evidence through PostgreSQL settlement and usage
        shell: bash
        run: node --test saas/tests/phase4StripeTestDatabaseIntegration.node.test.mjs

      - name: Verify closed LAB Stripe test Checkout contract
        shell: bash
        run: node --test saas/tests/phase4StripeTestCheckout.node.test.mjs
