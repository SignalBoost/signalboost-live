name: Require ONBOARD.md Acknowledgement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  onboarding-acknowledgement:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm ONBOARD acknowledgement gate is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo "A PR-body acknowledgement for ONBOARD.md is no longer required for merge."
          echo "This pass-through job preserves the existing status-check context for branch-protection compatibility."
          echo "All unrelated repository governance and safety checks remain unchanged."
