# .github/workflows/saas-ci.yml
name: SaaS CI

# Runs on pull requests that change SaaS code. The expensive 18-job suite is
# intentionally not repeated after merge; serialized PRs already validate the exact change.
# The typecheck job alone catches the class of error that has reached production
# before (e.g. a referenced-but-undefined function), without needing any secrets.

on:
  pull_request:
    paths:
      - 'saas/**'
      - '.github/workflows/saas-ci.yml'

permissions:
  contents: read

# The repository now exceeds Node's default ~2 GB heap during full TypeScript/Next analysis.
# Keep CI failures about code, not V8 allocation limits; hosted runners have sufficient RAM.
env:
  NODE_OPTIONS: '--max-old-space-size=7168'

defaults:
  run:
    working-directory: saas

concurrency:
  # Collapse repeated events for the same PR or branch/ref to the newest revision.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify SaaS CI scope
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect whether the full suite is required
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t changed < <(git diff --name-only "$base" "$head")

          full_suite=false
          for path in "${changed[@]}"; do
            case "$path" in
              saas/lib/provider-framework/*|saas/tests/providerFramework*.node.test.ts|saas/tests/provider-framework*.node.test.ts|.github/main-write-token)
                ;;
              *)
                full_suite=true
                break
                ;;
            esac
          done

          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n%s\n' "${changed[*]:-none}"
          echo "Full suite required: $full_suite"

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: node --max-old-space-size=7168 ./node_modules/typescript/bin/tsc --noEmit

  cos-fresh-routing:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS fresh-data routing policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify live-first routing, authority, structured evidence, and no local-model path
        run: node --test tests/cosFreshnessPolicy.node.test.ts tests/cosFreshLiveRouting.node.test.ts tests/cosFreshGrounding.node.test.ts tests/cosStructuredLiveInfo.node.test.ts

  cos-embedding-transport:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS embedding transport compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify governed readiness, passive no-wake, and native Ollama fallback
        run: npx --yes tsx --test tests/localEmbeddings.node.test.ts tests/localEmbeddingsNativeFallback.node.test.ts

  cos-cache-provenance:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS cache provenance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify cached origin lineage and replay retrieval separation
        run: npx --yes tsx --test tests/cosLiveSystemStateProvenance.node.test.ts tests/cosProvenanceFormat.node.test.ts

  cos-orchestration-action-classifier:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS orchestration action classifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify diagnostic questions never route to the governed-executor action path
        run: npx --yes tsx --test tests/cosOrchestrationActionClassifier.node.test.ts

  cos-definitional-answer-quality:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS definitional answer quality and canonical self-knowledge provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify definitional questions bypass the diagnostic-specificity cap and canonical self-knowledge is reported as a material contributor
        run: npx --yes tsx --test tests/cosDefinitionalAnswerQuality.node.test.ts

  provider-router-default-preference:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: Provider router default preference resolves to local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify a caller with no explicit preference and no env override reaches local reasoning, never a blocked hosted provider
        run: npx --yes tsx --test tests/providerRouterDefaultPreference.node.test.ts

  cos-quality-repair-audit:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS quality-repair audit persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify quality-repair audit persistence degrades safely without database configuration
        run: npx --yes tsx --test tests/qualityRepairDecisionLogging.node.test.ts

  cos-core-learning-curriculum:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS core learning curriculum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify every curriculum track routes to its own evaluation and safety boundary
        run: >-
          npx --yes tsx --test
          tests/cosCoreLearningCurriculum.node.test.ts
          tests/cosMlSystemsCurriculum.node.test.ts
          tests/cosCognitiveScienceCurriculum.node.test.ts
          tests/cosRoboticsEdgeAiCurriculum.node.test.ts
          tests/cosSpaceAppliedPhysicsCurriculum.node.test.ts
          tests/cosComputationalCreativityCurriculum.node.test.ts
          tests/cosIndustrialHmiCurriculum.node.test.ts
          tests/cosEnterpriseCurriculum.node.test.ts
          tests/cosCurriculumPriority.node.test.ts
          tests/cosCurriculumStudyGaps.node.test.ts
      - name: Verify curriculum topics are actually studied by the daily learning cycle
        run: npx --yes tsx --test tests/cosCurriculumStudyExecution.node.test.ts
      - name: Verify unstudyable chat fragments never become study subjects
        run: npx --yes tsx --test tests/cosLearningGapHygiene.node.test.ts
      - name: Verify tiered admission preserves raw quality and blocks weak evidence
        run: >-
          npx --yes tsx --test
          tests/cosTieredLearningAdmission.node.test.ts
          tests/cosTieredAdmissionFlow.node.test.ts
          tests/cosProbationaryPromotion.node.test.ts
      - name: Verify the independence dashboard never reports missing data as zero
        run: npx --yes tsx --test tests/cosIndependenceMetrics.node.test.ts
      - name: Verify declared-vs-learned curriculum coverage reporting
        run: npx --yes tsx --test tests/cosCurriculumCoverage.node.test.ts

  cos-university-programs:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS University time-bounded programs and admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify program calendars, credential immutability, and graduation timing
        run: >-
          node --import ./scripts/test-alias-loader.mjs --test
          tests/cosUniversityPrograms.node.test.ts
          tests/cosUniversityGraduation.node.test.ts
          tests/cosUniversityExamRemediation.node.test.ts
      - name: Verify Master's specialization catalog and host-computed admission
        run: >-
          node --import ./scripts/test-alias-loader.mjs --test
          tests/cosUniversityMasters.node.test.ts
          tests/cosUniversityAdmission.node.test.ts
          tests/cosUniversityAdmissionRunner.node.test.ts
          tests/cosUniversityActiveAcademicLane.node.test.ts
          tests/cosUniversityLearningAssurance.node.test.ts

  cos-platform-self-knowledge:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS platform self-knowledge policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify versioned internal facts, passive embeddings, and governed promotion ownership
        run: npx --yes tsx --test tests/platformSelfKnowledge.node.test.ts

  cos-continuous-independence:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS continuous independence learning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify episodic turns, explicit feedback, verified outcomes, and independence metric semantics
        run: npx --yes tsx --test tests/cosContinuousTurnLearning.node.test.ts tests/cosUserFeedbackLearning.node.test.ts tests/cosVerifiedProductionOutcome.node.test.ts tests/cosIndependenceMetrics.node.test.ts

  cos-capability-benchmark:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: COS capability benchmark contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify held-out benchmark scoring and provenance gates
        run: npx --yes tsx --test tests/cosCapabilityBenchmark.node.test.ts tests/cognitiveHeldOutCertification.node.test.ts

  concierge-visual-integrity:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: Concierge verified visual references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify named marks use authoritative assets and never generative reconstruction
        run: npx --yes tsx --test tests/conciergeVisuals.node.test.ts

  vercel-cos-gate:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: Vercel COS release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run the exact Vercel COS pre-build gate
        run: node scripts/vercel-cos-gates.mjs

  build:
    name: Production build (next build)
    runs-on: ubuntu-latest
    # Build can compile without real secrets; placeholders satisfy module-load client init.
    env:
      # Next 16 isolated build workers strip max-old-space-size from NODE_OPTIONS.
      # max-heap-size propagates to the worker. The repository now exceeds the old 4 GB
      # total-heap override during Next's TypeScript phase, so align this isolated worker
      # with the repo-wide 7 GB CI memory envelope rather than failing on V8 allocation.
      NODE_OPTIONS: '--max-heap-size=7168'
      # The separate Typecheck job above remains mandatory. This prevents Next's duplicate isolated
      # checker from OOMing after compilation; Production/Vercel do not receive this flag.
      CI_NEXT_BUILD_SKIP_TYPECHECK: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test

  issue-205-guards:
    needs: scope
    if: needs.scope.outputs.full_suite == 'true'
    name: Issue #205 enterprise guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Issue #205 architecture
        run: npm run verify:issue-205
