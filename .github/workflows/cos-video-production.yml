name: COS Video Production

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cos-video-production.yml'
      - 'saas/scripts/cos-video-production-entry.mjs'
      - 'saas/scripts/cos-video-production-worker.mjs'

permissions:
  contents: read

concurrency:
  group: cos-video-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight — required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY secret is missing"; exit 1; }

      - name: Preflight — worker file integrity
        run: |
          node --check saas/scripts/cos-video-production-entry.mjs
          node --check saas/scripts/cos-video-production-worker.mjs

      - run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@^2
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
          COS_VIDEO_RENDER_WEBHOOK_URL: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_URL }}
          COS_VIDEO_RENDER_WEBHOOK_TOKEN: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_TOKEN }}
          COS_VIDEO_MAX_JOBS_PER_RUN: ${{ vars.COS_VIDEO_MAX_JOBS_PER_RUN || '5' }}
        run: node scripts/cos-video-production-entry.mjs
