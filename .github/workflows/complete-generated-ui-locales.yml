name: Complete generated UI locales

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  models: read

concurrency:
  group: complete-generated-ui-locales-${{ github.event.pull_request.number }}-${{ github.actor == 'github-actions[bot]' && github.run_id || 'operator' }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Check out triggering PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Configure publication identity
        run: |
          git config user.name 'SignalBoost Automation'
          git config user.email 'actions@users.noreply.github.com'

      - name: Throttle GitHub Models translation requests
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'saas/scripts/translate-generated-ui-locales.mjs'
          const original = fs.readFileSync(file, 'utf8')
          let source = original
            .replace('maxTokens: 8000,\n      maxChars: 6000,\n      maxItems: 60,\n      requestConcurrency: 4,', 'maxTokens: 12000,\n      maxChars: 9000,\n      maxItems: 100,\n      requestConcurrency: 1,')
            .replace(
              `  const batchResults = await Promise.all(batches.map(async (batch, index) => {\n    console.log(\`[i18n] \${locale}: batch \${index + 1}/\${batches.length} (\${batch.length} values)\`)\n    return translateBatch(locale, batch)\n  }))`,
              `  const batchResults = []\n  for (let index = 0; index < batches.length; index += 1) {\n    const batch = batches[index]\n    console.log(\`[i18n] \${locale}: batch \${index + 1}/\${batches.length} (\${batch.length} values)\`)\n    batchResults.push(await translateBatch(locale, batch))\n    if (index + 1 < batches.length) await sleep(6000)\n  }`,
            )
          if (source === original) throw new Error('Translation throttling patch did not match the generator source.')
          fs.writeFileSync(file, source)
          NODE

      - name: Generate and publish each locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
        run: |
          set -euo pipefail
          for locale in es pt pl ru; do
            node saas/scripts/translate-generated-ui-locales.mjs --write --locale="$locale"
            git add "saas/locales/$locale.json"
            if ! git diff --cached --quiet; then
              git commit -m "fix(i18n): complete $locale generated UI dictionary"
              git push origin "HEAD:${HEAD_BRANCH}"
            fi
          done
          git checkout -- saas/scripts/translate-generated-ui-locales.mjs

      - name: Make five-language parity blocking
        working-directory: saas
        run: |
          npm pkg set 'scripts.validate:i18n-copy=node scripts/check-hardcoded-copy.mjs && node scripts/migrate-page-copy-to-locales.mjs && node scripts/check-generated-ui-locale-completeness.mjs'
          npm pkg set 'scripts.translate:i18n-generated-ui=node scripts/translate-generated-ui-locales.mjs --write'

      - name: Install dependencies
        working-directory: saas
        run: npm ci

      - name: Validate localization
        working-directory: saas
        run: npm run validate:i18n-copy

      - name: Type-check
        working-directory: saas
        run: npm run typecheck

      - name: Production build
        working-directory: saas
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Publish validated catalog guard
        run: |
          rm .github/workflows/complete-generated-ui-locales.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(i18n): enforce complete five-language UI catalogs'
          git push origin "HEAD:${HEAD_BRANCH}"
