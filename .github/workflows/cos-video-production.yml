name: COS Video Production

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cos-video-production.yml'
      - 'saas/scripts/cos-video-production-entry.mjs'
      - 'saas/scripts/cos-video-production-worker.mjs'
      - 'saas/scripts/cos-video-campaign-sync.mjs'
      - 'saas/scripts/cos-video-voice-worker.mjs'
      - 'saas/scripts/cos-video-voice-metadata-normalize.mjs'
      - 'scripts/brand-overlay-worker.mjs'

permissions:
  contents: read

concurrency:
  group: cos-video-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOLVED_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      RESOLVED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight — required secrets
        run: |
          test -n "$RESOLVED_SUPABASE_URL" || { echo "Missing GitHub Actions secret: add SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$RESOLVED_SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing GitHub Actions secret: add SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "Supabase worker credentials are configured."

      - name: Preflight — worker file integrity
        run: |
          node --check saas/scripts/cos-video-production-entry.mjs
          node --check saas/scripts/cos-video-production-worker.mjs
          node --check saas/scripts/cos-video-campaign-sync.mjs
          node --check saas/scripts/cos-video-voice-worker.mjs
          node --check saas/scripts/cos-video-voice-metadata-normalize.mjs
          node --check scripts/brand-overlay-worker.mjs

      - run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@^2
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Render queued base videos
        working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.RESOLVED_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
          COS_VIDEO_RENDER_WEBHOOK_URL: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_URL }}
          COS_VIDEO_RENDER_WEBHOOK_TOKEN: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_TOKEN }}
          COS_VIDEO_MAX_JOBS_PER_RUN: ${{ vars.COS_VIDEO_MAX_JOBS_PER_RUN || '5' }}
        run: node scripts/cos-video-production-entry.mjs

      - name: Sync completed base renders
        if: ${{ always() }}
        working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.RESOLVED_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
        run: node scripts/cos-video-campaign-sync.mjs

      - name: Create real voice and burned-in captions
        if: ${{ always() }}
        working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.RESOLVED_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
          COS_VIDEO_MAX_VOICE_PER_RUN: ${{ vars.COS_VIDEO_MAX_VOICE_PER_RUN || '3' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
        run: node scripts/cos-video-voice-worker.mjs

      - name: Normalize real voice metadata
        if: ${{ always() }}
        working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.RESOLVED_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cos-video-voice-metadata-normalize.mjs

      - name: Burn final SignalBoost brand banner
        if: ${{ always() }}
        env:
          SUPABASE_URL: ${{ env.RESOLVED_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.RESOLVED_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
        run: node scripts/brand-overlay-worker.mjs
