name: I18n Full Inventory

on:
  pull_request:
    paths:
      - 'saas/**'
      - '.github/workflows/i18n-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-remove-hardcoded-english
      - name: Package remediation branch source
        run: tar --exclude='saas/node_modules' --exclude='saas/.next' --exclude='saas/coverage' -czf saas-source.tgz -C saas .
      - name: Upload remediation source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: i18n-remediation-source
          path: saas-source.tgz
          if-no-files-found: error
