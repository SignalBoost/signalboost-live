name: Audit Ruleset Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-ruleset-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint current main audit workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/audit-remediation-regression.yml > /tmp/audit-remediation-regression.yml
          bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -oneline /tmp/audit-remediation-regression.yml
