#
# Owner 2026-10-02: "PLAYWRIGHT WATCHDOG - independently proves the line."
#
# Two jobs, deliberately separate:
#
#   line-policy      Runs on every PR that touches the line. Proves the POLICY: one station per status, SLAs in
#                    minutes, parallel capacity, batched registration, and that the prover cannot report a pass it
#                    did not earn. Fast, no secrets, no deployment.
#
#   line-live-proof  Runs on a schedule against the live deployment. Proves the LINE: reads per-unit placement,
#                    waits at least one takt time, reads again, and shows that a real unit changed station. The
#                    uploaded report is the artifact worth showing a buyer - it carries the two samples, the delta
#                    and the verdict, produced outside the deployment. It reads the READ-ONLY observation route
#                    (/api/cron/cos-university-line-observation), never the controller, so it cannot drive the line
#                    it measures (owner 2026-10-06).
#
#   step1-evidence   Runs on the same schedule. Prints the Step 1 evidence report (/api/cron/cos-university-step1-evidence)
#                    for the 24h, 7d and all-time windows into this log and keeps the JSON. Read only: it starts no
#                    work and spends nothing. It recommends NOT_READY or INSUFFICIENT_EVIDENCE_FOR_READY and never
#                    READY; the Step 1 declaration is the owner's. A NOT_READY report is evidence, not a job failure:
#                    the job fails only when the report cannot be produced.
#
# Required repository secrets for the live job:
#   PRODUCTION_BASE_URL   e.g. https://<production host>   (no trailing slash)
#   CRON_SECRET           the same value the deployment uses
#
# If either is missing the live job FAILS rather than skipping. A watchdog that goes green because it could not run
# is worse than no watchdog: it is a green light wired to nothing.

name: Assembly Line Live Proof

on:
  schedule:
    # Every six hours. Each run spends one takt time waiting, by design.
    - cron: '41 */6 * * *'
  pull_request:
    paths:
      - 'saas/lib/ai/cos/cosUniversityAssemblyLine.ts'
      - 'saas/lib/ai/cos/cosUniversityAssemblyLineHandoff.ts'
      - 'saas/lib/ai/cos/cosUniversityLineMovementProof.ts'
      - 'saas/lib/ai/cos/cosUniversityLineRepairPlan.ts'
      - 'saas/lib/ai/cos/cosUniversityHoldoutExamSetRecovery.ts'
      - 'saas/lib/ai/cos/cosUniversityHoldoutExamItems.ts'
      - 'saas/app/api/cron/cos-university-holdout-exam-items/route.ts'
      - 'saas/tests/holdoutExamSetBurnout.node.test.ts'
      - 'saas/tests/cosUniversityHoldoutExamItems.node.test.ts'
      - 'saas/agent-gateway-host/university-distillation-recovery.ts'
      - 'saas/self-healing-host/university-distillation-monitoring.ts'
      - 'saas/tests/cosUniversityDistillationSelfHealing.node.test.ts'
      - 'saas/lib/ai/cos/cosUniversityLifecycleOrchestrator.ts'
      - 'saas/lib/ai/cos/cosUniversityLifecycleStall.ts'
      - 'saas/app/api/cron/cos-university-lifecycle-orchestrator/route.ts'
      - 'saas/app/api/cron/cos-university-graduate-activation/route.ts'
      - 'saas/tests/cosUniversityLifecycleOrchestrator.node.test.ts'
      - 'saas/tests/cosUniversityLifecycleStall.node.test.ts'
      - 'saas/tests/cosUniversityAssemblyLine.playwright.spec.ts'
      - 'saas/lib/ai/cos/cosUniversityLineObservation.ts'
      - 'saas/lib/ai/cos/cosUniversityReadOnlyDb.ts'
      - 'saas/lib/ai/cos/cosUniversityStep1Evidence.ts'
      - 'saas/app/api/cron/cos-university-line-observation/route.ts'
      - 'saas/app/api/cron/cos-university-step1-evidence/route.ts'
      - 'saas/tests/cosUniversityStep1Evidence.node.test.ts'
      - 'saas/lib/ai/cos/cosWorkforceVerificationTrace.ts'
      - 'saas/app/api/cron/cos-workforce-verification-trace/route.ts'
      - 'saas/tests/cosWorkforceVerificationTrace.node.test.ts'
      - 'saas/lib/ai/cos/cosUniversityEvaluationFailureTrace.ts'
      - 'saas/app/api/cron/cos-university-evaluation-failure-trace/route.ts'
      - 'saas/tests/cosUniversityEvaluationFailureTrace.node.test.ts'
      - 'saas/lib/ai/cos/cosUniversityCapabilityGainTrace.ts'
      - 'saas/app/api/cron/cos-university-capability-gain-trace/route.ts'
      - 'saas/tests/cosUniversityCapabilityGainTrace.node.test.ts'
      - '.github/workflows/assembly-line-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  line-policy:
    name: Line policy proof
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - name: Prove the four assembly-line rules and the prover's own honesty
        run: >-
          node --experimental-transform-types --import ./scripts/test-alias-loader.mjs --test
          tests/cosUniversityLifecycleOrchestrator.node.test.ts
          tests/cosUniversityLifecycleStall.node.test.ts
          tests/massGraduateRegistrationStarvation.node.test.ts
          tests/cosUniversityMassGraduateRegistration.node.test.ts
          tests/quarantineStallDrain.node.test.ts
          tests/cosUniversityDistillationSelfHealing.node.test.ts
          tests/holdoutExamSetBurnout.node.test.ts
          tests/cosUniversityHoldoutExamItems.node.test.ts
          tests/holdoutExamReadyThroughput.node.test.ts
          tests/cosUniversityStep1Evidence.node.test.ts
          tests/cosWorkforceVerificationTrace.node.test.ts
          tests/cosUniversityEvaluationFailureTrace.node.test.ts
          tests/cosUniversityCapabilityGainTrace.node.test.ts

  line-live-proof:
    name: Line movement proof against production
    # Never on a pull request: it takes a takt time and it reads the live deployment.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - name: Refuse to run blind
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -n "$PRODUCTION_BASE_URL" ] || missing="$missing PRODUCTION_BASE_URL"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Cannot prove the line without:$missing. Add them as repository secrets."
            exit 1
          fi
          echo "Proving against $PRODUCTION_BASE_URL"
      - run: npx playwright install --with-deps chromium
      - name: Sample the line twice and prove a unit moved
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx playwright test tests/cosUniversityAssemblyLine.playwright.spec.ts --reporter=html,line
      - name: Keep the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly-line-movement-proof-${{ github.run_id }}
          path: saas/playwright-report
          retention-days: 90

  step1-evidence:
    name: Step 1 evidence report from production
    # Never on a pull request: it reads the live deployment.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # checks: write only lets the last step publish the report text as a check run (see that step).
    permissions:
      contents: read
      checks: write
    steps:
      - name: Refuse to run blind
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -n "$PRODUCTION_BASE_URL" ] || missing="$missing PRODUCTION_BASE_URL"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Cannot read Step 1 evidence without:$missing. Add them as repository secrets."
            exit 1
          fi
      - name: Read the Step 1 evidence report (read only)
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          mkdir -p step1-evidence
          failed=0
          for window in 24h 7d all; do
            out="step1-evidence/step1-evidence-${window}.json"
            status=$(curl -sS --max-time 90 -o "$out" -w '%{http_code}' \
              -H "authorization: Bearer ${CRON_SECRET}" \
              "${PRODUCTION_BASE_URL}/api/cron/cos-university-step1-evidence?window=${window}") || status=000
            echo "::group::Step 1 evidence, window=${window} (HTTP ${status})"
            if [ "$status" = "200" ] && [ "$(jq -r '.ok' "$out" 2>/dev/null)" = "true" ]; then
              jq -r '.summary' "$out"
              echo
              jq -r '.funnelSummary' "$out"
            else
              echo "::error::Step 1 evidence for window=${window} could not be produced (HTTP ${status})."
              head -c 2000 "$out" 2>/dev/null || true
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
      - name: Read the Workforce verification trace (read only)
        if: always()
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          mkdir -p step1-evidence
          out="step1-evidence/workforce-verification-trace.json"
          status=$(curl -sS --max-time 90 -o "$out" -w '%{http_code}' \
            -H "authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_BASE_URL}/api/cron/cos-workforce-verification-trace") || status=000
          echo "::group::Workforce verification trace (HTTP ${status})"
          if [ "$status" = "200" ] && [ "$(jq -r '.ok' "$out" 2>/dev/null)" = "true" ]; then
            jq -r '.summary' "$out"
          else
            # Workforce is the next project (owner 2026-10-06), not Step 1: an unreadable trace is reported, never a
            # Step 1 job failure.
            echo "::warning::Workforce verification trace could not be produced (HTTP ${status}); next-project data, not a Step 1 failure."
            head -c 2000 "$out" 2>/dev/null || true
          fi
          echo "::endgroup::"
      - name: Read the evaluation failure trace (read only)
        if: always()
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          mkdir -p step1-evidence
          out="step1-evidence/evaluation-failure-trace.json"
          status=$(curl -sS --max-time 90 -o "$out" -w '%{http_code}' \
            -H "authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_BASE_URL}/api/cron/cos-university-evaluation-failure-trace") || status=000
          echo "::group::Evaluation failure trace (HTTP ${status})"
          if [ "$status" = "200" ] && [ "$(jq -r '.ok' "$out" 2>/dev/null)" = "true" ]; then
            jq -r '.summary' "$out"
          else
            # Diagnostic detail for the failure_attribution criterion; the Step 1 report itself already decides the job.
            echo "::warning::Evaluation failure trace could not be produced (HTTP ${status})."
            head -c 2000 "$out" 2>/dev/null || true
          fi
          echo "::endgroup::"
      - name: Read the capability gain trace (read only)
        if: always()
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          mkdir -p step1-evidence
          out="step1-evidence/capability-gain-trace.json"
          status=$(curl -sS --max-time 90 -o "$out" -w '%{http_code}' \
            -H "authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_BASE_URL}/api/cron/cos-university-capability-gain-trace") || status=000
          echo "::group::Capability gain trace (HTTP ${status})"
          if [ "$status" = "200" ] && [ "$(jq -r '.ok' "$out" 2>/dev/null)" = "true" ]; then
            jq -r '.summary' "$out"
          else
            # Diagnostic detail for the qualification criterion; the Step 1 report itself already decides the job.
            echo "::warning::Capability gain trace could not be produced (HTTP ${status})."
            head -c 2000 "$out" 2>/dev/null || true
          fi
          echo "::endgroup::"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-evidence-${{ github.run_id }}
          path: step1-evidence
          retention-days: 90
      # Job logs and artifacts are served from external blob storage, which API-only readers (agents working through
      # the GitHub REST API) cannot reach. A check run's output lives on api.github.com, so the same report text is
      # published as a neutral "Step 1 evidence report" check run on the exact commit. Read only; it gates nothing.
      - name: Publish the report as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          report() {
            for window in 24h 7d all; do
              f="step1-evidence/step1-evidence-${window}.json"
              echo "## Step 1 evidence, window=${window}"
              if [ "$(jq -r '.ok' "$f" 2>/dev/null)" = "true" ]; then
                jq -r '.summary' "$f"; echo; jq -r '.funnelSummary' "$f"
              else
                echo "Not produced in this run."
              fi
              echo
            done
            f="step1-evidence/step1-evidence-24h.json"
            echo "## Computer Science path (now)"
            if [ "$(jq -r '.ok' "$f" 2>/dev/null)" = "true" ]; then jq -r '.computerSciencePathSummary // "Not produced in this run."' "$f"; else echo "Not produced in this run."; fi
            echo
            f="step1-evidence/evaluation-failure-trace.json"
            echo "## Evaluation failure trace"
            if [ "$(jq -r '.ok' "$f" 2>/dev/null)" = "true" ]; then jq -r '.summary' "$f"; else echo "Not produced in this run."; fi
            echo
            f="step1-evidence/capability-gain-trace.json"
            echo "## Capability gain trace"
            if [ "$(jq -r '.ok' "$f" 2>/dev/null)" = "true" ]; then jq -r '.summary' "$f"; else echo "Not produced in this run."; fi
            echo
            f="step1-evidence/workforce-verification-trace.json"
            echo "## Workforce verification trace"
            if [ "$(jq -r '.ok' "$f" 2>/dev/null)" = "true" ]; then jq -r '.summary' "$f"; else echo "Not produced in this run."; fi
          }
          report > step1-report.md
          cat step1-report.md >> "$GITHUB_STEP_SUMMARY"
          # Check-run summaries are capped at 65,535 characters.
          head -c 60000 step1-report.md > step1-report.trunc.md
          jq -n --arg sha "$GITHUB_SHA" --arg title "Step 1 evidence, run ${GITHUB_RUN_ID}" --rawfile summary step1-report.trunc.md \
            '{name: "Step 1 evidence report", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: $title, summary: $summary}}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - --jq '"Published check run " + (.id|tostring)'
