name: COS Video Production

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cos-video-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # PREFLIGHT: fail loudly and clearly if the worker file is corrupted
      # (e.g. another file's content pasted over it) instead of dying with a
      # cryptic SyntaxError. Renders are DEAD until this file is valid.
      - name: Preflight — worker file integrity
        run: |
          if ! node --check saas/scripts/cos-video-production-worker.mjs; then
            echo "::error file=saas/scripts/cos-video-production-worker.mjs::MISFILED OR CORRUPTED WORKER — not valid JavaScript. Another file's content was likely pasted here. All video rendering is stopped until saas/scripts/cos-video-production-worker.mjs is restored."
            exit 1
          fi

      - run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@^2
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
          COS_VIDEO_RENDER_WEBHOOK_URL: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_URL }}
          COS_VIDEO_RENDER_WEBHOOK_TOKEN: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_TOKEN }}
          COS_VIDEO_WORKER_POLL_MS: ${{ vars.COS_VIDEO_WORKER_POLL_MS || '6000' }}
        run: node scripts/cos-video-production-worker.mjs
