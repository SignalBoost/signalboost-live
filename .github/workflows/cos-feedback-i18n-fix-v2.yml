name: COS feedback localization fix runner

on:
  push:
    branches: [feat/cos-user-feedback-learning-20260816]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cos-user-feedback-learning-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Centralize assistant feedback copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          translations = {}
          translations['en'] = {'helpful':'Helpful','notHelpful':'Not helpful','correctThis':'Correct this','correctionPlaceholder':'What should COS learn from this?','submitCorrection':'Submit correction','cancelCorrection':'Cancel','feedbackSaved':'Feedback saved for COS learning.','feedbackError':'Could not save feedback.'}
          translations['es'] = {'helpful':'Útil','notHelpful':'No útil','correctThis':'Corregir','correctionPlaceholder':'¿Qué debería aprender COS de esto?','submitCorrection':'Enviar corrección','cancelCorrection':'Cancelar','feedbackSaved':'Comentarios guardados para el aprendizaje de COS.','feedbackError':'No se pudieron guardar los comentarios.'}
          translations['pt'] = {'helpful':'Útil','notHelpful':'Não ajudou','correctThis':'Corrigir','correctionPlaceholder':'O que o COS deve aprender com isso?','submitCorrection':'Enviar correção','cancelCorrection':'Cancelar','feedbackSaved':'Feedback salvo para o aprendizado do COS.','feedbackError':'Não foi possível salvar o feedback.'}
          translations['pl'] = {'helpful':'Pomocne','notHelpful':'Niepomocne','correctThis':'Popraw','correctionPlaceholder':'Czego COS powinien się z tego nauczyć?','submitCorrection':'Wyślij poprawkę','cancelCorrection':'Anuluj','feedbackSaved':'Opinia zapisana do uczenia COS.','feedbackError':'Nie udało się zapisać opinii.'}
          translations['ru'] = {'helpful':'Полезно','notHelpful':'Не помогло','correctThis':'Исправить','correctionPlaceholder':'Что COS должен из этого извлечь?','submitCorrection':'Отправить исправление','cancelCorrection':'Отмена','feedbackSaved':'Отзыв сохранён для обучения COS.','feedbackError':'Не удалось сохранить отзыв.'}
          for lang, copy in translations.items():
              path = Path('saas/locales') / f'{lang}.json'
              data = json.loads(path.read_text())
              if 'assistantFeedback' in data:
                  raise SystemExit(f'{path}: assistantFeedback already exists')
              data['assistantFeedback'] = copy
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          page = Path('saas/app/dashboard/assistant/page.tsx')
          lines = page.read_text().splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if line.lstrip().startswith("helpful:      { en: 'Helpful'")), None)
          if start is None:
              raise SystemExit('inline feedback copy start not found')
          expected = ['helpful:', 'notHelpful:', 'correctThis:', 'correctionPlaceholder:', 'submitCorrection:', 'cancelCorrection:', 'feedbackSaved:', 'feedbackError:']
          for offset, key in enumerate(expected):
              if not lines[start + offset].lstrip().startswith(key):
                  raise SystemExit(f'feedback copy block mismatch at {key}')
          del lines[start:start + len(expected)]
          text = ''.join(lines)
          replacements = [('c(COPY.helpful, l)',"uiText('assistantFeedback.helpful')"),('c(COPY.notHelpful, l)',"uiText('assistantFeedback.notHelpful')"),('c(COPY.correctThis, l)',"uiText('assistantFeedback.correctThis')"),('c(COPY.correctionPlaceholder, l)',"uiText('assistantFeedback.correctionPlaceholder')"),('c(COPY.submitCorrection, l)',"uiText('assistantFeedback.submitCorrection')"),('c(COPY.cancelCorrection, l)',"uiText('assistantFeedback.cancelCorrection')"),('c(COPY.feedbackSaved, l)',"uiText('assistantFeedback.feedbackSaved')"),('c(COPY.feedbackError, l)',"uiText('assistantFeedback.feedbackError')")]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{old}: expected once, found {text.count(old)}')
              text = text.replace(old, new, 1)
          page.write_text(text)
          PY
      - name: Remove temporary workflows and commit
        run: |
          git rm .github/workflows/cos-feedback-i18n-fix.yml .github/workflows/cos-feedback-i18n-fix-v2.yml
          git config user.name 'SignalBoost CI'
          git config user.email 'cadomos@gmail.com'
          git add -A
          git commit -m 'fix(i18n): centralize COS feedback learning copy'
          git push origin HEAD:feat/cos-user-feedback-learning-20260816
