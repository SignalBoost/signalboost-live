name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: saas/package-lock.json
    - name: Install dependencies
      run: npm ci
      working-directory: saas
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: saas
    - name: Run Playwright tests
      run: |
        set +e
        npm run test:playwright > playwright-output.log 2>&1
        status=$?
        cat playwright-output.log
        exit $status
      working-directory: saas
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          saas/playwright-report/
          saas/playwright-output.log
        retention-days: 30
