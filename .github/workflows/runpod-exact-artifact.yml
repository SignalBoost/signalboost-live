name: RunPod Exact Artifact Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'runpod/exact-artifact/**'
      - '.github/workflows/runpod-exact-artifact.yml'
  push:
    branches: [main]
    paths:
      - 'runpod/exact-artifact/**'
      - '.github/workflows/runpod-exact-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable exact-artifact worker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/exact-artifact
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/signalboost/itmounts-exact-artifact:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable production reference
        if: github.event_name != 'pull_request'
        run: |
          test -n "${{ steps.build.outputs.digest }}"
          echo "ghcr.io/signalboost/itmounts-exact-artifact@${{ steps.build.outputs.digest }}" | tee exact-artifact-image.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: exact-artifact-image
          path: exact-artifact-image.txt
