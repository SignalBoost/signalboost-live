name: RunPod Exact Artifact Release

on:
  push:
    branches: [main]
    paths:
      - 'runpod/exact-artifact/**'
      - '.github/workflows/runpod-exact-artifact-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-exact-artifact-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable exact-artifact worker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/exact-artifact
          push: true
          tags: ghcr.io/signalboost/itmounts-exact-artifact:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable production reference
        run: |
          test -n "${{ steps.build.outputs.digest }}"
          echo "ghcr.io/signalboost/itmounts-exact-artifact@${{ steps.build.outputs.digest }}" | tee exact-artifact-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exact-artifact-image
          path: exact-artifact-image.txt
