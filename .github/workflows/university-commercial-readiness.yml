name: University commercialization readiness gate
on:
  pull_request:
    paths:
      - 'scripts/check-university-commercial-readiness.mjs'
      - 'saas/tests/universityCommercialReadiness.node.test.mjs'
      - '.github/workflows/university-commercial-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert missing University commercialization evidence fails closed
        run: node --test saas/tests/universityCommercialReadiness.node.test.mjs
