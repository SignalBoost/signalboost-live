name: V1 Unit Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/closure-unit-diagnostics.yml'
      - 'saas/**'

permissions:
  contents: read

jobs:
  unit-diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install SaaS dependencies
        run: npm install --no-audit --no-fund
      - name: Capture unit tests
        shell: bash
        run: |
          set +e
          npm test > unit-tests.log 2>&1
          status=$?
          cat unit-tests.log
          echo "$status" > unit-tests.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: |
            saas/unit-tests.log
            saas/unit-tests.exit
      - name: Enforce unit tests
        run: test "$(cat unit-tests.exit)" = "0"
