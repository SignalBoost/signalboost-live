name: COS feedback UI and docs final patch runner

on:
  push:
    branches: [feat/cos-user-feedback-learning-20260816]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cos-user-feedback-learning-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute staged deterministic patch
        run: |
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next}/^          PY$/{flag=0}flag{sub(/^          /,""); print}' .github/workflows/cos-feedback-ui-doc-patch.yml > /tmp/cos_feedback_patch.py
          test -s /tmp/cos_feedback_patch.py
          python /tmp/cos_feedback_patch.py
      - name: Remove temporary patch workflows
        run: git rm .github/workflows/cos-feedback-ui-doc-patch.yml .github/workflows/cos-feedback-ui-doc-patch-v2.yml .github/workflows/cos-feedback-ui-doc-patch-v3.yml
      - name: Commit patched UI and docs
        run: |
          git config user.name 'SignalBoost CI'
          git config user.email 'cadomos@gmail.com'
          git add -A
          git commit -m 'feat(cos): wire explicit user feedback learning UI [cos-feedback-patched]'
          git push origin HEAD:feat/cos-user-feedback-learning-20260816
