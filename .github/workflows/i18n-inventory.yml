name: I18n Full Inventory

on:
  pull_request:
    paths:
      - 'saas/**'
      - '.github/workflows/i18n-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture main revision
        run: |
          git rev-parse HEAD > main-commit.txt
          git rev-parse 'HEAD^{tree}' > main-tree.txt
      - name: Package current main source
        run: tar --exclude='saas/node_modules' --exclude='saas/.next' --exclude='saas/coverage' -czf saas-source.tgz -C saas .
      - name: Upload current main snapshot
        uses: actions/upload-artifact@v4
        with:
          name: i18n-current-main-source
          path: |
            saas-source.tgz
            main-commit.txt
            main-tree.txt
          if-no-files-found: error
