name: Audit Remediation Pipeline Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-remediation-pipeline-ui
          fetch-depth: 0

      - name: Connect approval to visible remediation lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('saas/app/dashboard/audit/page.tsx')
          page = page_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
            global page
            count = page.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected once, found {count}')
            page = page.replace(old, new)

          replace_once(
            "const res = await fetch('/api/hub/operator/audit/runs', { credentials: 'include' })",
            "const res = await fetch('/api/hub/operator/audit/runs', { credentials: 'include', cache: 'no-store' })",
            'history no-store',
          )

          poll_pattern = re.compile(
            r"  useEffect\(\(\) => \{\n"
            r"\s+const status = remediation\?\.lifecycleStatus\n"
            r"\s+if \(!selectedRunId \|\| !status \|\| \['merged', 'failed', 'partial'\]\.includes\(status\)\) return\n"
            r"\s+const id = setInterval\(\(\) => \{ void openRun\(selectedRunId\) \}, 10000\)\n"
            r"\s+return \(\) => clearInterval\(id\)\n"
            r"\s+\}, \[selectedRunId, remediation\?\.lifecycleStatus\]\)",
          )
          poll_replacement = """  useEffect(() => {
            const status = String(remediation?.lifecycleStatus || '')
            const approvedWithoutLifecycle = view?.status === 'approved' && !status
            const terminal = ['merged', 'failed', 'partial'].includes(status)
            if (!selectedRunId || (!approvedWithoutLifecycle && (!status || terminal))) return
            const id = setInterval(() => { void openRun(selectedRunId) }, 10000)
            return () => clearInterval(id)
          }, [selectedRunId, view?.status, remediation?.lifecycleStatus])"""
          page, count = poll_pattern.subn(poll_replacement, page)
          if count != 1:
            raise SystemExit(f'approved polling: expected once, found {count}')

          replace_once(
            'setError(null); setSelectedRunId(id)',
            'setError(null); setApprovalMessage(null); setSelectedRunId(id)',
            'clear stale approval banner',
          )
          replace_once(
            "const res = await fetch(`/api/hub/operator/audit/runs?runId=${encodeURIComponent(id)}`, { credentials: 'include' })",
            "const res = await fetch(`/api/hub/operator/audit/runs?runId=${encodeURIComponent(id)}`, { credentials: 'include', cache: 'no-store' })",
            'detail no-store',
          )
          replace_once(
            'const remediationState = (data.remediation || null) as RemediationLifecycleState | null',
            """const remediationState = (data.remediation || (r?.status === 'approved' ? {
                lifecycleStatus: 'preparing',
                findingsTotal: Number(r?.findings_count || 0),
                findingsApplied: 0,
                merged: false,
              } : null)) as RemediationLifecycleState | null""",
            'approved fallback state',
          )
          replace_once(
            'const lifecycle = (result.remediation || null) as RemediationLifecycleState | null',
            """const lifecycle = (result.remediation || {
                lifecycleStatus: result.status || 'preparing',
                findingsTotal: Number(result.findingsApproved || view.findingsCount || 0),
                findingsApplied: Number(result.findingsFixed || 0),
                merged: result.status === 'merged',
              }) as RemediationLifecycleState""",
            'approval response fallback',
          )

          page_path.write_text(page)

          test_path = Path('saas/tests/auditRemediationSystem.node.test.ts')
          test = test_path.read_text().rstrip()
          marker = "test('approved runs expose a visible remediation pipeline before the first lifecycle event'"
          if marker not in test:
            test += """

          test('approved runs expose a visible remediation pipeline before the first lifecycle event', () => {
            const dashboard = read('../app/dashboard/audit/page.tsx')
            const panel = read('../components/audit/RemediationLifecyclePanel.tsx')

            assert.match(dashboard, /approvedWithoutLifecycle/)
            assert.match(dashboard, /r\?\.status === 'approved'/)
            assert.match(dashboard, /lifecycleStatus: 'preparing'/)
            assert.match(dashboard, /cache: 'no-store'/)
            assert.match(panel, /stepApproval: 'Approval recorded'/)
            assert.match(panel, /stepPrepare: 'Prepare fixes'/)
            assert.match(panel, /stepChecks: 'PR and checks'/)
            assert.match(panel, /stepMerge: 'Merge to main'/)
            assert.match(panel, /stepVerified: 'Verified remediated'/)
            assert.match(panel, /aria-label=\{copy\.pipelineLabel\}/)
          })
          """
          test_path.write_text(test + '\n')
          PY

      - name: Remove one-time patch workflow and commit
        run: |
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/audit-remediation-pipeline-patch.yml
          git add saas/app/dashboard/audit/page.tsx saas/tests/auditRemediationSystem.node.test.ts
          git commit -m 'Connect audit approval to remediation pipeline'
          git push origin HEAD:fix/audit-remediation-pipeline-ui
