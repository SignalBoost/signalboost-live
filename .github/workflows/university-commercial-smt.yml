name: University commercial wallet SMT acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verification/university/**'
      - 'saas/lib/billing/phase4CommercialWalletAudit.mjs'
      - '.github/workflows/university-commercial-smt.yml'
permissions:
  contents: read
jobs:
  university-wallet-smt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SMT solver
        run: python -m pip install z3-solver==4.13.4.0
      - name: Generate symbolic cases and replay against actual wallet audit
        run: node --test verification/university/commercial_wallet_smt.test.mjs
