name: Neutralize adapter identifiers

on:
  push:
    branches:
      - feat/neutral-buyer-evidence-adapter-ids

permissions:
  contents: write

jobs:
  codemod-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neutral-buyer-evidence-adapter-ids
          fetch-depth: 0

      - name: Replace vendor-prefixed adapter literals with shared constants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('saas')
          sandbox_target = root / 'lib/browser-runtime/sandbox-adapter.ts'
          dry_target = root / 'lib/browser-runtime/adapter-identifiers.ts'
          old_sandbox = "signalboost.sandbox.v1"
          old_dry = "signalboost.browser-runtime.dry-run.v1"

          def rel_import(source: Path, target: Path) -> str:
              rel = os.path.relpath(target.with_suffix(''), source.parent).replace(os.sep, '/')
              if not rel.startswith('.'):
                  rel = './' + rel
              return rel + '.ts'

          def add_import(text: str, statement: str) -> str:
              if statement in text:
                  return text
              lines = text.splitlines()
              insert_at = 1 if lines and lines[0].startswith('// saas/') else 0
              lines.insert(insert_at, statement)
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          changed = []
          for path in root.rglob('*.ts'):
              text = path.read_text()
              original = text

              if old_sandbox in text:
                  if path == sandbox_target:
                      text = text.replace(f"'{old_sandbox}'", "'portable.browser-sandbox.v1'")
                      text = text.replace(f'"{old_sandbox}"', '"portable.browser-sandbox.v1"')
                  else:
                      text = text.replace(f"'{old_sandbox}'", 'SANDBOX_ADAPTER_ID')
                      text = text.replace(f'"{old_sandbox}"', 'SANDBOX_ADAPTER_ID')
                      statement = f"import {{ SANDBOX_ADAPTER_ID }} from '{rel_import(path, sandbox_target)}'"
                      text = add_import(text, statement)

              if old_dry in text:
                  if path == dry_target:
                      text = text.replace(f"'{old_dry}'", "'portable.browser-runtime.dry-run.v1'")
                      text = text.replace(f'"{old_dry}"', '"portable.browser-runtime.dry-run.v1"')
                  else:
                      text = text.replace(f"'{old_dry}'", 'BROWSER_RUNTIME_DRY_RUN_ADAPTER_ID')
                      text = text.replace(f'"{old_dry}"', 'BROWSER_RUNTIME_DRY_RUN_ADAPTER_ID')
                      statement = f"import {{ BROWSER_RUNTIME_DRY_RUN_ADAPTER_ID }} from '{rel_import(path, dry_target)}'"
                      text = add_import(text, statement)

              if text != original:
                  lines = text.splitlines()
                  expected = f"// {path.as_posix()}"
                  if not lines or lines[0] != expected:
                      lines.insert(0, expected)
                      text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
                  path.write_text(text)
                  changed.append(path.as_posix())

          print('\n'.join(changed))
          PY

      - name: Verify old adapter identifiers are absent
        shell: bash
        run: |
          ! grep -RFn "signalboost.sandbox.v1" saas
          ! grep -RFn "signalboost.browser-runtime.dry-run.v1" saas
          cd saas
          grep -rn "signalboost\." lib/browser-runtime lib/supervisor || true

      - name: Install dependencies
        working-directory: saas
        run: npm ci

      - name: Typecheck
        working-directory: saas
        run: npm run typecheck

      - name: Build
        working-directory: saas
        run: npm run build

      - name: Full tests
        working-directory: saas
        run: npm test

      - name: Buyer graph boundary guard
        working-directory: saas
        run: node --test tests/supervisorPortableHostContext.node.test.ts

      - name: Sandbox adapter focused test
        working-directory: saas
        run: node --test tests/browserSandboxAdapter.node.test.ts

      - name: Commit codemod results
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add saas
          if ! git diff --cached --quiet; then
            git commit -m "refactor(browser): neutralize adapter identifiers"
            git push origin HEAD:feat/neutral-buyer-evidence-adapter-ids
          fi
