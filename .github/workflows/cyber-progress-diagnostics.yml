name: Cyber Progress Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cybersecurity-live-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: saas
        run: npm ci --dangerously-allow-all-scripts
      - name: Capture focused tests and typecheck
        working-directory: saas
        run: |
          set +e
          npm run test:cyber-progress > ../cyber-progress-test.log 2>&1
          echo $? > ../cyber-progress-test.exit
          npx tsc --noEmit > ../cyber-progress-typecheck.log 2>&1
          echo $? > ../cyber-progress-typecheck.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-progress-diagnostics
          path: |
            cyber-progress-test.log
            cyber-progress-test.exit
            cyber-progress-typecheck.log
            cyber-progress-typecheck.exit
