name: Deploy PocketBase to Fly.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infrastructure/pocketbase/**"
      - ".github/workflows/deploy-pocketbase-fly.yml"

permissions:
  contents: read

concurrency:
  group: pocketbase-production-deploy
  cancel-in-progress: false

env:
  FLY_APP_NAME: signalboost-pocketbase-cadomos
  FLY_REGION: iad
  FLY_CONFIG: infrastructure/pocketbase/fly.toml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN secret is missing"; exit 1; }
          flyctl auth whoami

      - name: Create Fly app if needed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if flyctl status --app "$FLY_APP_NAME" >/dev/null 2>&1; then
            echo "Fly app already exists."
          else
            flyctl apps create "$FLY_APP_NAME" --yes
          fi

      - name: Create persistent volume if needed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if flyctl volumes list --app "$FLY_APP_NAME" --json | jq -e '.[] | select(.Name == "pocketbase_data")' >/dev/null; then
            echo "Persistent volume already exists."
          else
            flyctl volumes create pocketbase_data \
              --app "$FLY_APP_NAME" \
              --region "$FLY_REGION" \
              --size 1 \
              --yes
          fi

      - name: Deploy PocketBase
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config "$FLY_CONFIG" --remote-only

      - name: Verify PocketBase health
        run: |
          set -euo pipefail
          url="https://${FLY_APP_NAME}.fly.dev/api/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl --silent --show-error --output /tmp/pocketbase-health.json --write-out "%{http_code}" --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "PocketBase is healthy at $url"
              cat /tmp/pocketbase-health.json
              exit 0
            fi
            echo "Health attempt $attempt returned ${code:-network-error}; retrying..."
            sleep 10
          done
          echo "PocketBase deployment did not become healthy."
          exit 1
