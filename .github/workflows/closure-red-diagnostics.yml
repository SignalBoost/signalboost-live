name: V1 Red Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/closure-red-diagnostics.yml'
      - 'saas/**'

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Bind lazy evaluator claim to exact artifact and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          route_path = Path('saas/app/api/cron/cos-university-distilled-evaluation/route.ts')
          route = route_path.read_text()

          old = "const RUNPOD_ENDPOINT_HOST = /^[A-Za-z0-9_-]{3,120}\\.api\\.runpod\\.ai$/\n"
          new = old + "const EVALUATION_CANDIDATE_HEADER = 'x-itmounts-evaluation-candidate-id'\nconst EVALUATION_ARTIFACT_HASH_HEADER = 'x-itmounts-evaluation-artifact-hash'\n"
          if 'EVALUATION_CANDIDATE_HEADER' not in route:
              if old not in route: raise SystemExit('missing route header constant anchor')
              route = route.replace(old, new, 1)

          old = "async function claimRuntimeEvaluationAttempt(now: Date, routeDeadlineMs: number): Promise<RuntimeAttemptClaim> {"
          new = "async function claimRuntimeEvaluationAttempt(\n  now: Date,\n  routeDeadlineMs: number,\n  target: Readonly<{ candidateId: string; artifactHash: string }>,\n): Promise<RuntimeAttemptClaim> {"
          if 'target: Readonly<{ candidateId: string; artifactHash: string }>' not in route:
              if old not in route: raise SystemExit('missing claim signature anchor')
              route = route.replace(old, new, 1)

          old = """    .eq('status', 'evaluation_pending')
              .eq('trained_artifact_id', DISTILLED_ADAPTER_MODEL_ID)
              .order('created_at', { ascending: true })
              .limit(1)
          """
          new = """    .eq('status', 'evaluation_pending')
              .eq('trained_artifact_id', DISTILLED_ADAPTER_MODEL_ID)
              .eq('candidate_id', target.candidateId)
              .eq('trained_artifact_hash', target.artifactHash)
              .limit(1)
          """
          if ".eq('candidate_id', target.candidateId)" not in route:
              if old not in route: raise SystemExit('missing exact artifact query anchor')
              route = route.replace(old, new, 1)

          old = """    if (isRunpodEvaluationInference(url, init)) {
              if (!key) throw new Error('distilled_evaluation_runpod_key_missing')
              if (!runtimeAttempt) {
                const claimed = await claimRuntimeEvaluationAttempt(new Date(), input.routeDeadlineMs)
                if (claimed.ok === false) throw new RuntimeAttemptSkip(claimed.reason)
                runtimeAttempt = claimed
              }
              await proveRunpodReady({ origin: url.origin, fetchImpl: routeBoundFetch, routeDeadlineMs: input.routeDeadlineMs })
              ensureKeepalive(url.origin)

              const inferenceBudget = input.routeDeadlineMs - Date.now() - EVALUATION_ROUTE_RESERVE_MS
          """
          new = """    if (isRunpodEvaluationInference(url, init)) {
              if (!key) throw new Error('distilled_evaluation_runpod_key_missing')
              const forwardedHeaders = new Headers(init?.headers)
              const candidateId = forwardedHeaders.get(EVALUATION_CANDIDATE_HEADER)?.trim() || ''
              const artifactHash = (forwardedHeaders.get(EVALUATION_ARTIFACT_HASH_HEADER)?.trim() || '').toLowerCase()
              if (!candidateId || candidateId.length > 240 || !HEX64.test(artifactHash)) {
                throw new Error('distilled_evaluation_runtime_binding_missing_or_invalid')
              }
              forwardedHeaders.delete(EVALUATION_CANDIDATE_HEADER)
              forwardedHeaders.delete(EVALUATION_ARTIFACT_HASH_HEADER)
              if (!runtimeAttempt) {
                const claimed = await claimRuntimeEvaluationAttempt(new Date(), input.routeDeadlineMs, { candidateId, artifactHash })
                if (claimed.ok === false) throw new RuntimeAttemptSkip(claimed.reason)
                runtimeAttempt = claimed
              } else if (runtimeAttempt.candidateId !== candidateId || runtimeAttempt.artifactHash !== artifactHash) {
                throw new Error('distilled_evaluation_runtime_binding_changed')
              }
              await proveRunpodReady({ origin: url.origin, fetchImpl: routeBoundFetch, routeDeadlineMs: input.routeDeadlineMs })
              ensureKeepalive(url.origin)

              const inferenceBudget = input.routeDeadlineMs - Date.now() - EVALUATION_ROUTE_RESERVE_MS
          """
          if 'distilled_evaluation_runtime_binding_missing_or_invalid' not in route:
              if old not in route: raise SystemExit('missing lazy claim block anchor')
              route = route.replace(old, new, 1)

          old = """      guardedInit = {
                ...init,
                signal: AbortSignal.timeout(Math.min(RUNPOD_INFERENCE_TIMEOUT_MS, inferenceBudget)),
              }
          """
          new = """      guardedInit = {
                ...init,
                headers: forwardedHeaders,
                signal: AbortSignal.timeout(Math.min(RUNPOD_INFERENCE_TIMEOUT_MS, inferenceBudget)),
              }
          """
          if 'headers: forwardedHeaders' not in route:
              if old not in route: raise SystemExit('missing guarded init header anchor')
              route = route.replace(old, new, 1)
          route_path.write_text(route)

          evaluator_path = Path('saas/lib/ai/cos/cosUniversityDistilledArtifactEvaluation.ts')
          evaluator = evaluator_path.read_text()
          old = """  candidateId: string
            artifactId?: string | null
            artifactHash?: string | null
          """
          new = """  candidateId: string
            bindingArtifactHash: string
            artifactId?: string | null
            artifactHash?: string | null
          """
          if 'bindingArtifactHash: string' not in evaluator:
              if old not in evaluator: raise SystemExit('missing evaluator input type anchor')
              evaluator = evaluator.replace(old, new, 1)

          old = "headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },"
          new = """headers: {
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
                'x-itmounts-evaluation-candidate-id': input.candidateId,
                'x-itmounts-evaluation-artifact-hash': input.bindingArtifactHash,
              },"""
          if "'x-itmounts-evaluation-candidate-id'" not in evaluator:
              if old not in evaluator: raise SystemExit('missing evaluator headers anchor')
              evaluator = evaluator.replace(old, new, 1)

          old = """    feature: `distilled_eval_${input.suiteName}_baseline`,
              candidateId: input.candidateId,
            })
          """
          new = """    feature: `distilled_eval_${input.suiteName}_baseline`,
              candidateId: input.candidateId,
              bindingArtifactHash: input.artifactHash,
            })
          """
          if 'bindingArtifactHash: input.artifactHash' not in evaluator:
              if old not in evaluator: raise SystemExit('missing baseline binding anchor')
              evaluator = evaluator.replace(old, new, 1)

          old = """    feature: `distilled_eval_${input.suiteName}_candidate`,
              candidateId: input.candidateId,
              artifactId: input.artifactId,
          """
          new = """    feature: `distilled_eval_${input.suiteName}_candidate`,
              candidateId: input.candidateId,
              bindingArtifactHash: input.artifactHash,
              artifactId: input.artifactId,
          """
          if evaluator.count('bindingArtifactHash: input.artifactHash') < 2:
              if old not in evaluator: raise SystemExit('missing candidate binding anchor')
              evaluator = evaluator.replace(old, new, 1)
          evaluator_path.write_text(evaluator)

          runtime_test_path = Path('saas/tests/cosUniversityDistilledEvaluationRuntimeReady.node.test.ts')
          runtime_test = runtime_test_path.read_text()
          marker = "test('no-cost evaluator preflight can skip without consuming the wake attempt', () => {"
          added = """test('lazy wake claim is bound to the evaluator-selected candidate and artifact', () => {
            assert.match(route, /EVALUATION_CANDIDATE_HEADER = 'x-itmounts-evaluation-candidate-id'/)
            assert.match(route, /EVALUATION_ARTIFACT_HASH_HEADER = 'x-itmounts-evaluation-artifact-hash'/)
            assert.match(route, /\.eq\('candidate_id', target\.candidateId\)/)
            assert.match(route, /\.eq\('trained_artifact_hash', target\.artifactHash\)/)
            assert.match(route, /claimRuntimeEvaluationAttempt\(new Date\(\), input\.routeDeadlineMs, \{ candidateId, artifactHash \}\)/)
            assert.match(route, /runtimeAttempt\.candidateId !== candidateId \|\| runtimeAttempt\.artifactHash !== artifactHash/)
            assert.match(route, /forwardedHeaders\.delete\(EVALUATION_CANDIDATE_HEADER\)/)
            assert.match(route, /forwardedHeaders\.delete\(EVALUATION_ARTIFACT_HASH_HEADER\)/)
            assert.match(route, /headers: forwardedHeaders/)
          })

          """
          if "lazy wake claim is bound to the evaluator-selected candidate and artifact" not in runtime_test:
              if marker not in runtime_test: raise SystemExit('missing runtime test marker')
              runtime_test = runtime_test.replace(marker, added + marker, 1)
          runtime_test_path.write_text(runtime_test)

          eval_test_path = Path('saas/tests/cosUniversityDistilledArtifactEvaluation.node.test.ts')
          eval_test = eval_test_path.read_text()
          marker = "test('student never grades itself and teacher cannot be the independent evaluator', () => {"
          added = """test('evaluation requests carry exact internal candidate/artifact binding for the route fence', () => {
            const evaluator = source('../lib/ai/cos/cosUniversityDistilledArtifactEvaluation.ts')
            assert.match(evaluator, /bindingArtifactHash: string/)
            assert.match(evaluator, /'x-itmounts-evaluation-candidate-id': input\.candidateId/)
            assert.match(evaluator, /'x-itmounts-evaluation-artifact-hash': input\.bindingArtifactHash/)
            assert.equal((evaluator.match(/bindingArtifactHash: input\.artifactHash/g) || []).length, 2)
          })

          """
          if "evaluation requests carry exact internal candidate/artifact binding" not in eval_test:
              if marker not in eval_test: raise SystemExit('missing evaluator test marker')
              eval_test = eval_test.replace(marker, added + marker, 1)
          eval_test_path.write_text(eval_test)

          workflow = """name: V1 Red Diagnostics

          on:
            pull_request:
              paths:
                - '.github/workflows/closure-red-diagnostics.yml'
                - 'saas/**'

          permissions:
            contents: read

          jobs:
            diagnostics:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: saas
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                - run: npm install --no-audit --no-fund
                - shell: bash
                  run: |
                    set +e
                    npm test > unit.log 2>&1; echo $? > unit.exit
                    npm run verify:issue-205 > guards.log 2>&1; echo $? > guards.exit
                    npm run test:supervisor > supervisor.log 2>&1; echo $? > supervisor.exit
                    npm run validate:bpal > bpal.log 2>&1; echo $? > bpal.exit
                    exit 0
                - uses: actions/upload-artifact@v4
                  with:
                    name: red-check-diagnostics
                    path: |
                      saas/unit.log
                      saas/unit.exit
                      saas/guards.log
                      saas/guards.exit
                      saas/supervisor.log
                      saas/supervisor.exit
                      saas/bpal.log
                      saas/bpal.exit
                - shell: bash
                  run: |
                    test \"$(cat unit.exit)\" = 0
                    test \"$(cat guards.exit)\" = 0
                    test \"$(cat supervisor.exit)\" = 0
                    test \"$(cat bpal.exit)\" = 0
          """
          Path('.github/workflows/closure-red-diagnostics.yml').write_text(textwrap.dedent(workflow))
          PY
          git config user.name "SignalBoost"
          git config user.email "cadomos@gmail.com"
          git add saas/app/api/cron/cos-university-distilled-evaluation/route.ts saas/lib/ai/cos/cosUniversityDistilledArtifactEvaluation.ts saas/tests/cosUniversityDistilledEvaluationRuntimeReady.node.test.ts saas/tests/cosUniversityDistilledArtifactEvaluation.node.test.ts .github/workflows/closure-red-diagnostics.yml
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "fix(distillation): bind lazy evaluator claim identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
