name: Audit Sync Main Final

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-sync-main-final.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Merge current main and retain reviewed audit lifecycle files
        run: |
          set -euo pipefail
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                saas/lib/audit/approvedRunRemediationSystem.ts|\
                saas/lib/audit/remediationLifecycleRepair.ts|\
                saas/supabase/migrations/20260720_audit_remediation_lifecycle_v2.sql|\
                saas/lib/audit/approvedRunMergedRecovery.ts|\
                saas/lib/audit/approvedRunPartialRecovery.ts|\
                saas/lib/audit/approvedRunRemediationRetry.ts|\
                saas/lib/audit/approvedRunRemediation.ts|\
                saas/app/api/hub/operator/audit/approve-all/route.ts|\
                saas/app/dashboard/audit/page.tsx|\
                saas/components/audit/RemediationLifecyclePanel.tsx|\
                saas/tests/auditGlobalApproval.node.test.ts|\
                saas/tests/auditRemediationSystem.node.test.ts|\
                saas/tests/auditRemediationWorkflowTrigger.node.test.ts|\
                .github/workflows/audit-remediation-regression.yml)
                  git checkout --ours "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file"
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            git commit --no-edit
          fi

          git push origin HEAD:fix/audit-system-end-to-end
