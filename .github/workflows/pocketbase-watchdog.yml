name: PocketBase Health Watchdog

# Scheduled checks are intentionally disabled until PocketBase becomes the
# active production backend. Run this workflow manually after PocketBase is
# deployed and POCKETBASE_HEALTH_URL is configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate health URL
        env:
          POCKETBASE_HEALTH_URL: ${{ secrets.POCKETBASE_HEALTH_URL }}
        run: |
          test -n "$POCKETBASE_HEALTH_URL" || { echo "POCKETBASE_HEALTH_URL secret is missing"; exit 1; }

      - name: Check PocketBase health
        env:
          POCKETBASE_HEALTH_URL: ${{ secrets.POCKETBASE_HEALTH_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl --silent --show-error --output /tmp/pb-health.json --write-out "%{http_code}" \
              --max-time 15 "$POCKETBASE_HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "PocketBase is healthy."
              cat /tmp/pb-health.json
              exit 0
            fi
            echo "Attempt $attempt failed with HTTP ${code:-network-error}."
            sleep $((attempt * 10))
          done
          echo "PocketBase health check failed after 3 attempts."
          exit 1
