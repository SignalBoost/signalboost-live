name: Audit System Compile Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-system-compile-diagnostic.yml'
      - 'saas/app/dashboard/audit/page.tsx'
      - 'saas/components/audit/RemediationLifecyclePanel.tsx'
      - 'saas/lib/audit/**'
      - 'saas/app/api/hub/operator/audit/approve-all/route.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - name: Install dependencies
        working-directory: saas
        run: npm ci
      - name: Capture typecheck output
        working-directory: saas
        run: |
          set +e
          npm run typecheck > audit-system-typecheck.log 2>&1
          status=$?
          cat audit-system-typecheck.log
          echo "$status" > audit-system-typecheck.status
          exit 0
      - name: Capture production build output
        working-directory: saas
        run: |
          set +e
          npm run build > audit-system-build.log 2>&1
          status=$?
          tail -n 250 audit-system-build.log
          echo "$status" > audit-system-build.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: audit-system-compile-diagnostic
          path: |
            saas/audit-system-typecheck.log
            saas/audit-system-typecheck.status
            saas/audit-system-build.log
            saas/audit-system-build.status
          if-no-files-found: error
