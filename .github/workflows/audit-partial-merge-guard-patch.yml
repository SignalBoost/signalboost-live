name: Audit Partial Merge Guard Patch

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-partial-merge-guard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Prevent partial remediation from merging or finalizing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('saas/lib/audit/approvedRunRemediationSystem.ts')
          content = path.read_text()
          needle = """  const autoMerge = await queueAutoMerge(pr.number)
          """
          replacement = """  if (params.result.status === 'partial' || params.result.lifecycleStatus === 'partial') {
            const partial = systemResult(params.result, {
              ok: true,
              status: 'partial',
              lifecycleStatus: 'partial',
              autoMergeQueued: false,
              autoMergeError: '',
            })
            await writeLifecycleLog(params.admin, params.runId, params.actorUserId, partial)
            return partial
          }

          const autoMerge = await queueAutoMerge(pr.number)
          """
          count = content.count(needle)
          if count != 1:
            raise SystemExit(f'expected one merge boundary, found {count}')
          path.write_text(content.replace(needle, replacement))
          PY

      - name: Commit partial merge guard
        run: |
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/lib/audit/approvedRunRemediationSystem.ts
          git commit -m 'Block partial audit remediation from merging'
          git push origin HEAD:fix/audit-system-end-to-end
