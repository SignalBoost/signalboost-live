# .github/workflows/i18n-expansion-readiness.yml
name: i18n eleven-language platform
on:
  pull_request:
    paths:
      - 'saas/lib/i18n/**'
      - 'saas/components/i18n/**'
      - 'saas/scripts/check-eleven-language-platform.mjs'
      - 'saas/scripts/check-eleven-language-coverage.mjs'
      - 'saas/scripts/audit-locale-structure.mjs'
      - 'saas/scripts/inventory-app-router-i18n.mjs'
      - 'saas/scripts/generated-ui-locale-utils.mjs'
      - 'saas/app/**'
      - 'saas/components/**'
      - 'saas/locales/*.json'
      - 'saas/public/i18n/*.json'
      - 'saas/marketing-sales-core/i18n/**'
      - 'saas/components/LanguageSuggestion.tsx'
      - 'saas/scripts/export-eleven-language-translation-packages.mjs'
      - 'saas/scripts/check-translation-package-export.mjs'
      - 'saas/scripts/check-translated-package-negative-fixtures.mjs'
      - 'saas/scripts/validate-translated-packages.mjs'
      - 'saas/scripts/import-reviewed-language-packages.mjs'
      - 'saas/scripts/check-reviewed-package-import.mjs'
      - 'saas/scripts/translate-pending-language-packages.mjs'
      - 'saas/scripts/check-translation-engine-safety.mjs'
      - 'saas/scripts/check-six-language-batch-e2e.mjs'
      - 'saas/tests/sixLanguageCampaignPages.node.test.ts'
      - 'saas/tests/navbarLanguageOptions.node.test.ts'
      - 'saas/tests/platformElevenLanguageI18n.node.test.ts'
      - 'saas/scripts/check-rtl-logical-styles.mjs'
      - 'saas/tests/rtlLogicalStyles.node.test.ts'
      - 'saas/app/globals.css'
      - '.github/workflows/i18n-expansion-readiness.yml'
jobs:
  ensure-safe-expansion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - name: Install dependencies (TypeScript parser for the RTL styling guard)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce the eleven-language production contract
        run: node scripts/check-eleven-language-platform.mjs
      - name: Require complete coverage for every active language
        run: node scripts/check-eleven-language-coverage.mjs --require-all
      - name: Audit exact keys, types and interpolation tokens across all locale stores
        run: node scripts/audit-locale-structure.mjs --report .i18n-evidence/locale-structure.json
      - name: Upload locale structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eleven-language-structure-evidence
          path: saas/.i18n-evidence/locale-structure.json
          if-no-files-found: warn
      - name: Require direction-aware (RTL-safe) UI styling
        run: node scripts/check-rtl-logical-styles.mjs
      - name: Inventory actual routes for full-site localization work
        run: node scripts/inventory-app-router-i18n.mjs --report .i18n-evidence/app-route-inventory.json
      - name: Upload route inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-app-route-inventory
          path: saas/.i18n-evidence/app-route-inventory.json
          if-no-files-found: warn
      - name: Verify language picker, public campaign pages and platform language tests
        run: node --test tests/navbarLanguageOptions.node.test.ts tests/sixLanguageCampaignPages.node.test.ts tests/platformElevenLanguageI18n.node.test.ts tests/rtlLogicalStyles.node.test.ts
      - name: Verify translation-package export, reviewed import and draft engine tooling
        run: |
          node scripts/check-translation-package-export.mjs
          node scripts/check-translated-package-negative-fixtures.mjs
          node scripts/check-reviewed-package-import.mjs
          node scripts/check-translation-engine-safety.mjs
          node scripts/check-six-language-batch-e2e.mjs
