      - name: Notify Teams on success
        if: success()
        run: |
          curl -H 'Content-Type: application/json' \
          -d '{"text":"✅ COS edits applied and deployed successfully on ai-cos-branch."}' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Notify Teams on failure
        if: failure()
        run: |
          curl -H 'Content-Type: application/json' \
          -d '{"text":"❌ COS pipeline failed. Check logs for details."}' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
