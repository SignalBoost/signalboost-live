<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Unified SaaS dashboard wireframe</title>
  <desc id="desc">Cockpit dashboard with sidebar navigation and six SaaS module panels.</desc>
  <defs><style>.bg{fill:#060913}.panel{fill:#0b1a30;stroke:#1af0ff;stroke-opacity:.5;stroke-width:2}.gold{stroke:#ffc300}.txt{font-family:Inter,Arial,sans-serif;fill:#fff}.muted{fill:#9fb4c7}.cyan{fill:#9ff7ff}.h1{font-size:48px;font-weight:900}.h2{font-size:28px;font-weight:800}.sm{font-size:18px}</style></defs>
  <rect width="1440" height="1080" class="bg"/>
  <rect x="55" y="55" width="280" height="970" rx="30" class="panel gold"/>
  <text x="90" y="110" class="txt h2">SaaS Nav</text>
  <g class="txt sm">
    <text x="90" y="180">📣 Promote Business</text><text x="90" y="245">⭐ Reviews</text><text x="90" y="310">📅 Calendar</text><text x="90" y="375">▦ Spreadsheets</text><text x="90" y="440">🛰 Outreach</text><text x="90" y="505">🤖 Personal Assistant</text>
  </g>
  <rect x="370" y="55" width="1015" height="190" rx="30" class="panel"/>
  <text x="410" y="125" class="txt h1">Unified SaaS Command Dashboard</text>
  <text x="410" y="178" class="txt sm muted">Mission health, ARIA status, keyboard navigation, i18n telemetry.</text>
  <g transform="translate(370 285)">
    <g><rect width="318" height="225" rx="24" class="panel"/><text x="24" y="50" class="txt h2">Promote Business</text><text x="24" y="92" class="txt sm muted">Campaign builder</text><text x="24" y="126" class="txt sm muted">Analytics chart</text><polyline points="24,184 80,150 136,166 192,112 248,132 294,80" fill="none" stroke="#1af0ff" stroke-width="6"/></g>
    <g transform="translate(348 0)"><rect width="318" height="225" rx="24" class="panel"/><text x="24" y="50" class="txt h2">Reviews</text><text x="24" y="92" class="txt sm muted">Submission card</text><text x="24" y="126" class="txt sm muted">Moderation queue</text><rect x="24" y="164" width="260" height="20" rx="10" fill="#ffc300"/></g>
    <g transform="translate(696 0)"><rect width="318" height="225" rx="24" class="panel"/><text x="24" y="50" class="txt h2">Calendar</text><text x="24" y="92" class="txt sm muted">Monthly grid</text><text x="24" y="126" class="txt sm muted">Event modal</text><g stroke="#1af0ff" opacity=".7"><line x1="24" y1="155" x2="294" y2="155"/><line x1="24" y1="185" x2="294" y2="185"/><line x1="90" y1="140" x2="90" y2="205"/><line x1="170" y1="140" x2="170" y2="205"/><line x1="250" y1="140" x2="250" y2="205"/></g></g>
    <g transform="translate(0 260)"><rect width="318" height="225" rx="24" class="panel"/><text x="24" y="50" class="txt h2">Spreadsheets</text><text x="24" y="92" class="txt sm muted">Collaborative grid</text><text x="24" y="126" class="txt sm muted">Sharing panel</text><g stroke="#1af0ff" opacity=".7"><line x1="24" y1="155" x2="294" y2="155"/><line x1="24" y1="185" x2="294" y2="185"/><line x1="90" y1="140" x2="90" y2="205"/><line x1="170" y1="140" x2="170" y2="205"/><line x1="250" y1="140" x2="250" y2="205"/></g></g>
    <g transform="translate(348 260)"><rect width="318" height="225" rx="24" class="panel"/><text x="24" y="50" class="txt h2">Outreach</text><text x="24" y="92" class="txt sm muted">Campaign launch card</text><text x="24" y="126" class="txt sm muted">Concierge panel</text><polyline points="24,188 80,172 136,142 192,116 248,90 294,78" fill="none" stroke="#ffc300" stroke-width="6"/></g>
    <g transform="translate(696 260)"><rect width="318" height="225" rx="24" class="panel"/><text x="24" y="50" class="txt h2">Personal Assistant</text><text x="24" y="92" class="txt sm muted">Task list</text><text x="24" y="126" class="txt sm muted">Reminder timeline</text><circle cx="70" cy="175" r="12" fill="#1af0ff"/><line x1="82" y1="175" x2="270" y2="175" stroke="#1af0ff" stroke-width="5" stroke-linecap="round"/></g>
  </g>
</svg>
