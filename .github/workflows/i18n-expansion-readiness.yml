name: i18n expansion readiness
on:
  pull_request:
    paths:
      - 'saas/lib/i18n/**'
      - 'saas/components/i18n/**'
      - 'saas/scripts/check-language-expansion-readiness.mjs'
      - 'saas/scripts/check-eleven-language-coverage.mjs'
      - 'saas/scripts/audit-pending-locale-structure.mjs'
      - 'saas/locales/*.json'
      - 'saas/scripts/export-eleven-language-translation-packages.mjs'
      - 'saas/scripts/check-translation-package-export.mjs'
      - 'saas/scripts/check-translated-package-negative-fixtures.mjs'
      - 'saas/scripts/validate-translated-packages.mjs'
      - 'saas/scripts/import-reviewed-language-packages.mjs'
      - 'saas/scripts/check-reviewed-package-import.mjs'
      - 'saas/scripts/translate-pending-language-packages.mjs'
      - 'saas/scripts/check-translation-engine-safety.mjs'
      - 'saas/scripts/check-six-language-batch-e2e.mjs'
      - 'saas/scripts/check-five-language-platform.mjs'
      - 'saas/components/LanguageSuggestion.tsx'
      - 'saas/lib/i18n/pageLocales.ts'
      - 'saas/locales/pages.*.json'
      - 'saas/tests/sixLanguageCampaignPages.node.test.ts'
      - '.github/workflows/i18n-expansion-readiness.yml'
jobs:
  ensure-safe-expansion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect existing five-language production contract
        run: node scripts/check-five-language-platform.mjs
      - name: Check six-language roadmap and Arabic direction
        run: node scripts/check-language-expansion-readiness.mjs
      - name: Report eleven-language catalog gaps without claiming release readiness
        run: node scripts/check-eleven-language-coverage.mjs
      - name: Audit exact key types and interpolation tokens across all nine locale stores
        run: node scripts/audit-pending-locale-structure.mjs --report .i18n-evidence/six-locale-structure.json
      - name: Upload exact locale gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eleven-language-readiness-evidence
          path: saas/.i18n-evidence/six-locale-structure.json
          if-no-files-found: warn
      - name: Verify source translation packages for six pending languages
        run: node scripts/check-translation-package-export.mjs
      - name: Reject incomplete and omitted locale catalogs
        run: node scripts/check-translated-package-negative-fixtures.mjs
      - name: Reject unreviewed package imports and partial catalog writes
        run: node scripts/check-reviewed-package-import.mjs
      - name: Verify six translated campaign-page catalogs
        run: node --test tests/sixLanguageCampaignPages.node.test.ts
      - name: Verify translator opt-in safety offline
        run: node scripts/check-translation-engine-safety.mjs
      - name: Execute all six locale batches against offline mocked provider
        run: node scripts/check-six-language-batch-e2e.mjs
