name: COS Evidence Utilization Regression

on:
  pull_request:
    paths:
      - 'saas/lib/ai/cos/contextRelevance.ts'
      - 'saas/lib/ai/cos/cognitiveTurnExperience.ts'
      - 'saas/lib/ai/cos/evidenceSourceUse.ts'
      - 'saas/lib/ai/cos/evidenceSourceUseStore.ts'
      - 'saas/lib/ai/cos/evidenceSourceUseTurnContext.ts'
      - 'saas/lib/ai/cos/learnedEvidenceClass.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalContext.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalPolicy.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalPolicyLogic.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalValidation.ts'
      - 'saas/lib/ai/cos/capabilityBenchmarkRunner.ts'
      - 'saas/lib/ai/cos/reasonerOutput.ts'
      - 'saas/lib/ai/cos/turnExperienceStore.ts'
      - 'saas/app/api/admin/cos-evidence-source-use/route.ts'
      - 'saas/app/api/admin/cos-adaptive-retrieval/route.ts'
      - 'saas/supabase/migrations/20260821_cos_evidence_source_use.sql'
      - 'saas/supabase/migrations/20260822_cos_adaptive_retrieval_shadow.sql'
      - 'saas/tests/contextRelevance.node.test.ts'
      - 'saas/tests/cosEvidenceUtilization.node.test.ts'
      - 'saas/tests/cosEvidenceSourceUse.node.test.ts'
      - 'saas/tests/cosEvidenceCitation.node.test.ts'
      - 'saas/tests/cosAdaptiveRetrieval.node.test.ts'
      - '.github/workflows/cos-evidence-utilization.yml'
  push:
    branches: [main]
    paths:
      - 'saas/lib/ai/cos/contextRelevance.ts'
      - 'saas/lib/ai/cos/cognitiveTurnExperience.ts'
      - 'saas/lib/ai/cos/evidenceSourceUse.ts'
      - 'saas/lib/ai/cos/evidenceSourceUseStore.ts'
      - 'saas/lib/ai/cos/evidenceSourceUseTurnContext.ts'
      - 'saas/lib/ai/cos/learnedEvidenceClass.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalContext.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalPolicy.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalPolicyLogic.ts'
      - 'saas/lib/ai/cos/adaptiveRetrievalValidation.ts'
      - 'saas/lib/ai/cos/capabilityBenchmarkRunner.ts'
      - 'saas/lib/ai/cos/reasonerOutput.ts'
      - 'saas/lib/ai/cos/turnExperienceStore.ts'
      - 'saas/app/api/admin/cos-evidence-source-use/route.ts'
      - 'saas/app/api/admin/cos-adaptive-retrieval/route.ts'
      - 'saas/supabase/migrations/20260821_cos_evidence_source_use.sql'
      - 'saas/supabase/migrations/20260822_cos_adaptive_retrieval_shadow.sql'
      - 'saas/tests/contextRelevance.node.test.ts'
      - 'saas/tests/cosEvidenceUtilization.node.test.ts'
      - 'saas/tests/cosEvidenceSourceUse.node.test.ts'
      - 'saas/tests/cosEvidenceCitation.node.test.ts'
      - 'saas/tests/cosAdaptiveRetrieval.node.test.ts'
      - '.github/workflows/cos-evidence-utilization.yml'

jobs:
  evidence-utilization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify conservative relevance, utilization metrics, source attribution and adaptive shadow policy
        run: npx --yes tsx --test tests/contextRelevance.node.test.ts tests/cosEvidenceUtilization.node.test.ts tests/cosEvidenceSourceUse.node.test.ts tests/cosEvidenceCitation.node.test.ts tests/cosAdaptiveRetrieval.node.test.ts
