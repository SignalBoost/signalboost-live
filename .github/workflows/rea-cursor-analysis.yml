name: REA Cursor Analysis Worker
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Workflow run ID containing a private artifact named cursor-rea-input with app.asar"
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  rea:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Confirm supported runtime
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 24) process.exit(1)"
      - name: Verify REA executable
        run: |
          npx -y rea-agents@latest --help
          npx -y rea-agents@latest doctor --json > "$RUNNER_TEMP/rea-doctor.json" || true
          test -s "$RUNNER_TEMP/rea-doctor.json"
          echo "REA CLI and doctor executed; a missing native engine does not block Electron static analysis."
      - name: Download authorized analysis input
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: cursor-rea-input
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/rea-input
      - name: Run actual static analysis when an input was supplied
        if: ${{ inputs.artifact_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(find "$RUNNER_TEMP/rea-input" -type f -name '*.asar' -print -quit)"
          if [[ -z "$target" ]]; then echo "::error::Artifact has no ASAR application bundle"; exit 1; fi
          node scripts/rea-cursor-inspect.mjs "$target"
          test -s rea-local-results/cursor-static-analysis.json
          node -e "const x=require('./rea-local-results/cursor-static-analysis.json'); if(!x.evidence)process.exit(1)"
          echo "REA static analysis produced validated local JSON evidence."
      - name: No analysis input supplied
        if: ${{ inputs.artifact_run_id == '' }}
        run: echo "::notice::REA toolchain verified; no Cursor ASAR artifact was supplied. No application analysis claimed."
      - name: Remove local source and raw evidence
        if: always()
        run: rm -rf "$RUNNER_TEMP/rea-input" rea-local-results
