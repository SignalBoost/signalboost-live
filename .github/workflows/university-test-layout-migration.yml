name: University test layout migration

on:
  push:
    branches:
      - fix/university-test-layout-20260913

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Migrate university tests
        run: node saas/scripts/migrate-university-tests.mjs

      - name: Install SaaS dependencies
        working-directory: saas
        run: npm ci

      - name: Verify COS/Vercel gates
        working-directory: saas
        run: node scripts/vercel-cos-gates.mjs

      - name: Check patch integrity
        run: git diff --check

      - name: Remove one-time migration machinery
        run: |
          rm .github/workflows/university-test-layout-migration.yml
          rm saas/scripts/migrate-university-tests.mjs

      - name: Commit verified layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No migration changes produced"; exit 1; }
          git commit -m "test(university): organize university test suite"
          git push origin HEAD:fix/university-test-layout-20260913
