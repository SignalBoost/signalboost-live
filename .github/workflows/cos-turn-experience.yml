name: COS Turn Experience Regression

on:
  pull_request:
    paths:
      - 'saas/lib/ai/cos/turnExperience.ts'
      - 'saas/lib/ai/cos/turnExperienceStore.ts'
      - 'saas/lib/ai/cos/cosReasoner.ts'
      - 'saas/lib/ai/cos/cosFirstAnswer.ts'
      - 'saas/lib/ai/cos/cognitiveTurnExperience.ts'
      - 'saas/lib/ai/cos/evidenceSourceUseTurnContext.ts'
      - 'saas/lib/ai/cos/evidenceSourceUseStore.ts'
      - 'saas/lib/ai/cos/evidenceUtilizationBenchmark.ts'
      - 'saas/lib/ai/cos/capabilityBenchmarkRunner.ts'
      - 'saas/lib/ai/cos/cognitiveVerifiedOutcome.ts'
      - 'saas/lib/ai/cos/failureAutopsyPolicy.ts'
      - 'saas/lib/ai/cos/turnFailureAutopsy.ts'
      - 'saas/app/api/assistant/feedback/route.ts'
      - 'saas/app/api/admin/cos-turn-experience/route.ts'
      - 'saas/app/api/admin/cos-capability-benchmark/route.ts'
      - 'saas/app/api/admin/cos-evidence-utilization-benchmark/route.ts'
      - 'saas/app/api/admin/cos-failure-autopsy/route.ts'
      - 'saas/tests/cosTurnExperience.node.test.ts'
      - 'saas/tests/cosOutcomeCorrelation.node.test.ts'
      - 'saas/tests/cosFailureAutopsy.node.test.ts'
      - 'saas/supabase/migrations/20260821_cos_turn_experience.sql'
      - 'saas/supabase/migrations/20260821_cos_turn_outcomes_and_utilization_benchmark.sql'
      - 'saas/supabase/migrations/20260821_cos_general_failure_autopsy.sql'
      - '.github/workflows/cos-turn-experience.yml'

permissions:
  contents: read

jobs:
  turn-experience:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Test COS turn experience, outcome correlation and failure autopsy
        run: npx --yes tsx --test tests/cosTurnExperience.node.test.ts tests/cosOutcomeCorrelation.node.test.ts tests/cosFailureAutopsy.node.test.ts
      - name: Typecheck
        run: npm run typecheck
