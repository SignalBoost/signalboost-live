name: COS Commit Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - ai-cos-branch

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Vercel build output
        uses: actions/cache@v4
        with:
          path: .vercel/cache
          key: vercel-${{ runner.os }}-24-${{ github.sha }}
          restore-keys: |
            vercel-${{ runner.os }}-24-

      - name: Install dependencies
        run: npm ci

      - name: Run COS edits (safe mode v5)
        run: |
          DRY_RUN=false ROLLBACK_ALL=false node scripts/cos-edit.js

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Commit changes
        if: success()
        run: |
          git config --global user.name "COS Agent"
          git config --global user.email "cos@signalboostapp.com"
          git add .
          git commit -m "COS: Applied automated fixes"
          git push origin ai-cos-branch

      - name: Deploy to Vercel
        if: success()
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Slack Notifications
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "✅ COS outreach video published",
              "attachments": [
                {
                  "color": "#36a64f",
                  "fields": [
                    { "title": "Branch", "value": "${{ github.ref }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                    { "title": "Node.js Version", "value": "24", "short": true },
                    { "title": "Video URL", "value": "https://youtube.com/watch?v=XYZ123", "short": false },
                    { "title": "Duration", "value": "${{ job.duration }}", "short": true },
                    { "title": "Triggered By", "value": "${{ github.actor }}", "short": true }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "❌ COS pipeline failed",
              "attachments": [
                {
                  "color": "#ff0000",
                  "fields": [
                    { "title": "Branch", "value": "${{ github.ref }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                    { "title": "Node.js Version", "value": "24", "short": true },
                    { "title": "Triggered By", "value": "${{ github.actor }}", "short": true }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # Teams Notifications
      - name: Notify Teams on success
        if: success()
        run: |
          curl -H 'Content-Type: application/json' \
          -d '{
            "text": "✅ COS outreach video published",
            "sections": [{
              "facts": [
                { "name": "Branch", "value": "${{ github.ref }}" },
                { "name": "Commit", "value": "${{ github.sha }}" },
                { "name": "Node.js Version", "value": "24" },
                { "name": "Video URL", "value": "https://youtube.com/watch?v=XYZ123" },
                { "name": "Duration", "value": "${{ job.duration }}" },
                { "name": "Triggered By", "value": "${{ github.actor }}" }
              ]
            }]
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Notify Teams on failure
        if: failure()
        run: |
          curl -H 'Content-Type: application/json' \
          -d '{
            "text": "❌ COS pipeline failed",
            "sections": [{
              "facts": [
                { "name": "Branch", "value": "${{ github.ref }}" },
                { "name": "Commit", "value": "${{ github.sha }}" },
                { "name": "Node.js Version", "value": "24" },
                { "name": "Triggered By", "value": "${{ github.actor }}" }
              ]
            }]
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}

      # Email Notification
      - name: Notify via Email
        if: success()
        run: |
          echo "Subject: Outreach Video Published
          Hi Luis,

          Your outreach campaign video has been published successfully.

          Details:
          - Branch: ${{ github.ref }}
          - Commit: ${{ github.sha }}
          - Node.js Version: 24
          - Duration: ${{ job.duration }}
          - Triggered By: ${{ github.actor }}

          Video Link: https://youtube.com/watch?v=XYZ123

          Regards,
          COS" | sendmail luis@example.com
