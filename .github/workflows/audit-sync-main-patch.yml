name: Audit Sync Main Patch

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-sync-main-patch.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Merge current main and retain the reviewed controller
        run: |
          set -euo pipefail
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected='saas/lib/audit/approvedRunRemediationSystem.ts'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours "$expected"
            git add "$expected"
            git commit --no-edit
          fi

          git push origin HEAD:fix/audit-system-end-to-end
