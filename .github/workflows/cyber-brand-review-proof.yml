name: Cyber Brand Review Proof
on:
  push:
    branches: [fix/itmounts-cyber-display-brand-20260912]
    paths: [.github/workflows/cyber-brand-review-proof.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'SignalBoost/signalboost-live' && github.ref == 'refs/heads/fix/itmounts-cyber-display-brand-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only the three independently tested exact-blob corrections
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          const ops = [{"path":"saas/tests/cyberLegacyPresentation.node.test.ts","before":"821d6a860000d3695ff3cc872a64f940624fc0c3","replacements":[["    assert.equal(buttons(tree).length, status === 'completed' ? 0 : 1)","    assert.equal(buttons(tree).length, status === 'completed' ? 0 : 1)\n    if (status === 'completed') assert.match(visible, /Stored records and approval history are unchanged/)",1]],"append":"\n\ntest('product adjectives normalize without rewriting hyphenated technical identifiers', () => {\n  for (const adjective of ['powered', 'assisted', 'driven', 'generated', 'managed', 'enabled', 'based', 'backed', 'led']) {\n    for (const name of ['SignalBoost', 'SIGNALBOOST AI', 'SignalBoostAi']) {\n      assert.equal(cyberProductText(`${name}-${adjective} remediation`), `iTMounts-${adjective} remediation`)\n    }\n  }\n  for (const technical of ['signalboost-live', 'signalboost-api', 'signalboost-worker', 'signalboost-powered.ts', 'src/SignalBoost-powered', '`SignalBoost-powered`', 'https://example.com/SignalBoost-powered']) {\n    assert.equal(cyberProductText(technical), technical)\n  }\n})\n","after":"45a2f782a2aff93c1aa646bc8d3ae40d35709d8d"},{"path":"saas/app/dashboard/cybersecurity/page.tsx","before":"fd74b1816bb1445328f914d9942a3dcc3937b40b","replacements":[["{historicalDependency ? copy.savedPlanNotice : cyberProductText(r.summary)}</p>{guardianFinding ?","{historicalDependency ? copy.savedPlanNotice : cyberProductText(r.summary)}</p>{!historicalDependency && terminal ? <p className=\"mt-2 text-xs text-text-muted\" data-cyber-brand-notice>{copy.brandDisplayNotice}</p> : null}{guardianFinding ?",1]],"append":"","after":"a0fe95d76c6009f1c116fecf24722682766de8dc"},{"path":"saas/lib/cyber/cyberReportPresentation.ts","before":"2d15f2f689520af4b5d2dc2cdf88a78e867db9cd","replacements":[["    .map((part, index) => index % 2 ? part : part.replace(","    .map((part, index) => index % 2 ? part : part.replace(\n      // Descriptive compounds are product prose, not generic hyphenated identifiers.\n      // Paths, filenames, email addresses, URLs and code remain protected.\n      /(?<![\\p{L}\\p{N}_./\\\\@-])SignalBoost(?:Ai|\\s+AI)?(?=-(?:powered|assisted|driven|generated|managed|enabled|based|backed|led)(?![\\p{L}\\p{N}_/\\\\@-]|\\.[\\p{L}\\p{N}]))/giu,\n      name => publicBrandText(name),\n    ).replace(",1]],"append":"","after":"92db773c3f66f387d592d58271899884986f83cb"}];
          const hash = b => createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          for (const op of ops) {
            const original = readFileSync(op.path); assert.equal(hash(original), op.before);
            let text = original.toString('utf8');
            for (const [a,b,n] of op.replacements) { assert.equal(text.split(a).length - 1, n); text = text.split(a).join(b); }
            const bytes = Buffer.from(text + op.append); assert.equal(hash(bytes), op.after);
            writeFileSync(op.path, bytes);
            const dest = `brand-review-candidate/${op.path}`; mkdirSync(dirname(dest), {recursive:true}); writeFileSync(dest,bytes);
          }
          console.log('Three exact candidate blobs verified.');
          NODE
      - name: Install committed dependencies without lifecycle scripts
        working-directory: saas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run actual saved-card and related security regressions
        working-directory: saas
        run: node --test tests/cybersecurityLiveProgress.node.test.ts tests/cyberDependencyScanCoverage.node.test.ts tests/publicBrand.node.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: brand-review-candidate-${{ github.sha }}
          path: brand-review-candidate/
          if-no-files-found: error
          retention-days: 2
  blobs:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brand-review-candidate-${{ github.sha }}
          path: brand-review-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish verified blobs only, never refs or deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected = {
            'saas/tests/cyberLegacyPresentation.node.test.ts':'45a2f782a2aff93c1aa646bc8d3ae40d35709d8d',
            'saas/app/dashboard/cybersecurity/page.tsx':'a0fe95d76c6009f1c116fecf24722682766de8dc',
            'saas/lib/cyber/cyberReportPresentation.ts':'92db773c3f66f387d592d58271899884986f83cb'
          };
          for (const [path,sha] of Object.entries(expected)) {
            const bytes=readFileSync(`brand-review-candidate/${path}`);
            assert.equal(createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'),sha);
            const response=await fetch('https://api.github.com/repos/SignalBoost/signalboost-live/git/blobs',{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:bytes.toString('base64'),encoding:'base64'})});
            assert.equal(response.status,201); assert.equal((await response.json()).sha,sha); console.log(path,sha);
          }
          NODE
