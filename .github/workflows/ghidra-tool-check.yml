name: Ghidra headless tooling check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ghidra-tool-check.yml'
      - 'scripts/install-ghidra-rea.sh'
      - 'scripts/verify-ghidra-rea.sh'

permissions:
  contents: read

jobs:
  verify-ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned, SHA-256-verified Ghidra
        run: bash scripts/install-ghidra-rea.sh
      - name: Verify installed launcher
        run: bash scripts/verify-ghidra-rea.sh
      - name: Perform real headless analysis on a compiled ELF
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ghidra-probe.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("GHIDRA_REA_TEST_PROBE"); return 0; }
          EOF
          gcc -O0 -o /tmp/ghidra-probe /tmp/ghidra-probe.c
          file /tmp/ghidra-probe
          mkdir -p /tmp/ghidra-projects
          "$HOME/.local/opt/ghidra/support/analyzeHeadless" /tmp/ghidra-projects rea-smoke -import /tmp/ghidra-probe -deleteProject -max-cpu 2 -analysisTimeoutPerFile 120 2>&1 | tee /tmp/ghidra-analysis.log
          grep -Eq 'REPORT: Import succeeded|REPORT: Analysis succeeded' /tmp/ghidra-analysis.log
          ! grep -Eq 'REPORT: Import failed|REPORT: Analysis failed|Exception in thread' /tmp/ghidra-analysis.log
          echo "PASS: ELF import and headless analysis completed"
