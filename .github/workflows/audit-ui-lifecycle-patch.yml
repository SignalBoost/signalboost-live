name: Audit Lifecycle UI Patch

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-ui-lifecycle-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Harden Audit Console lifecycle rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('saas/app/dashboard/audit/page.tsx')
          content = page.read_text()
          page_replacements = [
            (
              "        status: remediationState?.merged ? 'remediated' : r?.status,",
              "        status: remediationState?.lifecycleStatus === 'merged' ? 'remediated' : r?.status,",
            ),
            (
              "        {!loading && view && view.findingsCount > 0 && (phase === 'DONE' || view.status === 'complete') && (",
              "        {!loading && !remediation && view && view.findingsCount > 0 && (phase === 'DONE' || view.status === 'complete') && (",
            ),
          ]
          for old, new in page_replacements:
            count = content.count(old)
            if count != 1:
              raise SystemExit(f'expected one page match, found {count}: {old!r}')
            content = content.replace(old, new)
          page.write_text(content)

          panel = Path('saas/components/audit/RemediationLifecyclePanel.tsx')
          panel_content = panel.read_text()
          panel_replacements = [
            (
              "  const status = state.merged ? 'merged' : String(state.lifecycleStatus || 'preparing')",
              "  const status = String(state.lifecycleStatus || (state.merged ? 'merged' : 'preparing'))",
            ),
            (
              "  const fixed = state.merged ? Number(state.findingsApplied || 0) : 0",
              "  const fixed = status === 'merged' ? Number(state.findingsApplied || 0) : 0",
            ),
          ]
          for old, new in panel_replacements:
            count = panel_content.count(old)
            if count != 1:
              raise SystemExit(f'expected one panel match, found {count}: {old!r}')
            panel_content = panel_content.replace(old, new)
          panel.write_text(panel_content)
          PY

      - name: Commit lifecycle UI hardening
        run: |
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/app/dashboard/audit/page.tsx saas/components/audit/RemediationLifecyclePanel.tsx
          git commit -m 'Harden audit remediation lifecycle rendering'
          git push origin HEAD:fix/audit-system-end-to-end
