name: iTMounts technical token inventory
on:
  push:
    branches: [fix/itmounts-brand-final-proof-20260912]
    paths: [.github/workflows/itmounts-technical-token-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'SignalBoost/signalboost-live' && github.ref == 'refs/heads/fix/itmounts-brand-final-proof-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only tracked runtime code tokens, not data or credentials
        run: |
          python3 - <<'PY'
          import pathlib, re, json, subprocess
          inventory = {}
          paths = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          for name in paths:
              p = pathlib.Path(name)
              if not name.startswith(('saas/lib/','saas/app/','saas/components/','saas/scripts/')): continue
              if p.suffix not in {'.ts','.tsx','.mjs','.js','.json'}: continue
              if any(s in p.parts for s in ['node_modules','tests','fixtures']): continue
              if p.stat().st_size > 1000000: continue
              for n,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  for token in re.findall(r'\bSignalBoost-[A-Za-z0-9_-]+',line,re.I):
                      places = inventory.setdefault(token,[])
                      if len(places)<3: places.append(f'{name}:{n}')
          print('TECHNICAL_TOKEN_INVENTORY='+json.dumps(inventory,sort_keys=True))
          PY
