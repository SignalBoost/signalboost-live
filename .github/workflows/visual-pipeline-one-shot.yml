name: Visual Pipeline One Shot

on:
  push:
    branches:
      - feat/cos-visual-reference-edit-contract-20260831

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact migration
        run: python .github/visual-pipeline-one-shot.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(visuals): migrate ingress assertions to unified classifier"
          git push
