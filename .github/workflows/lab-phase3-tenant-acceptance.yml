name: Phase 3 tenant hierarchy acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/lab-phase3-tenant-acceptance.yml'
      - 'saas/tests/sql/lab-phase3-two-tenants-acceptance.sql'
      - 'saas/supabase/migrations/20261006190000_itmounts_lab_tenancy_credit_ledger.sql'
      - 'saas/supabase/migrations/20261006210000_lab_experiment_budget_enforcement.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-adversarial:
    name: Two-tenant disposable PostgreSQL hierarchy proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: lab_phase3_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_phase3_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: lab_phase3_acceptance
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap test-only Supabase roles
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL
      - name: Install canonical Lab hierarchy and constraints
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261006190000_itmounts_lab_tenancy_credit_ledger.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261006210000_lab_experiment_budget_enforcement.sql
      - name: Require independent A and B artifact chains and reject forged parent references
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f saas/tests/sql/lab-phase3-two-tenants-acceptance.sql
