name: Run Cybersecurity Live Progress

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cybersecurity-live-progress
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply permanent implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-cybersecurity-live-progress.yml').read_text()
          marker = "          node <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          NODE", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-cybersecurity-live-progress.cjs').write_text('\n'.join(lines) + '\n')
          PY
          node /tmp/apply-cybersecurity-live-progress.cjs
          rm -f .github/workflows/run-cybersecurity-live-progress.yml noop.txt

      - name: Commit permanent implementation
        run: |
          git config user.name "SignalBoost Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add live cybersecurity progress monitor"
          git push origin HEAD:feat/cybersecurity-live-progress

      - name: Verify cybersecurity progress
        working-directory: saas
        run: npm ci --dangerously-allow-all-scripts && npm run test:cyber-progress && npm run typecheck
