# .github/workflows/builder-v2-verification.yml
# Builder V2 behaviour suites, including bounded model checking of the agent loop (builderV2ModelCheck).
# SymbolicTimeout runs in builder-v2-symbolic.yml with its Z3 input.
name: Builder V2 Verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime
        run: npm install --no-audit --no-fund
      - name: Builder V2 continuation liveness and idle guard
        run: node --experimental-transform-types --test tests/builderV2IdleSlices.node.test.ts
      - name: Builder V2 suites and bounded model check
        run: node --experimental-transform-types --test tests/builderV2Acceptance.node.test.ts tests/builderV2CanaryRouting.node.test.ts tests/builderV2JobCycle.node.test.ts tests/builderV2OwnerRouting.node.test.ts tests/builderV2BatchedActions.node.test.ts tests/builderV2Dispatcher.node.test.ts tests/builderV2InspectionLoop.node.test.ts tests/builderV2LatestProof.node.test.ts tests/builderV2ModelCheck.node.test.ts tests/builderV2OrderFlowScripted.node.test.ts tests/builderV2ProgressReport.node.test.ts tests/builderV2ResumeBudget.node.test.ts tests/builderV2SharedSurfaceRouting.node.test.ts tests/builderV2SliceProgress.node.test.ts tests/builderV2SupabaseStore.node.test.ts tests/builderV2SyntaxCheck.node.test.ts tests/builderV2TimeoutHostVerify.node.test.ts tests/builderV2TruncatedReplies.node.test.ts tests/builderV2TruncationAcceptance.node.test.ts tests/builderV2ModelRetry.node.test.ts tests/builderV2WorkingSet.node.test.ts tests/builderV2RepairConvergence.node.test.ts 
      - name: Builder recovery migration regression
        run: node --experimental-transform-types --test tests/builderStaleExpiryHeartbeatFence.node.test.ts tests/builderExhaustedCheckpointExpiry.node.test.ts
      - name: Builder V2 inference cap and deadline regression
        run: node --experimental-transform-types --test tests/builderInferenceBudget.node.test.ts
      - name: Verification campaign runner, ledger, host ports and admission
        run: node --experimental-transform-types --import ./scripts/test-alias-loader.mjs --test tests/builderVerificationCampaign.node.test.ts tests/builderVerificationCampaignHost.node.test.ts tests/builderCampaignFaults.node.test.ts tests/builderCampaignBrowser.node.test.ts tests/builderCampaignGovernanceFixture.node.test.ts
      - name: Builder V2 isolated publication boundary
        run: node --experimental-transform-types --test tests/builderV2IsolatedPublication.node.test.ts

  recovery-postgres:
    name: Builder recovery PostgreSQL behavior
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: builder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: builder_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Execute actual Builder recovery function and assert behavior
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f saas/tests/fixtures/builder-recovery-schema.sql
          psql -v ON_ERROR_STOP=1 -f saas/supabase/migrations/20261029145000_builder_expire_exhausted_checkpoint_claims.sql
          psql -v ON_ERROR_STOP=1 -f saas/tests/fixtures/builder-recovery-assertions.sql
          psql -v ON_ERROR_STOP=1 -f saas/tests/fixtures/customer-task-foundation-assertions.sql
          psql -v ON_ERROR_STOP=1 -f saas/tests/fixtures/builder-repair-plan-lifecycle-assertions.sql
          psql -v ON_ERROR_STOP=1 -f saas/tests/fixtures/cos-builder-history-identity-assertions.sql
          psql -v ON_ERROR_STOP=1 -f saas/tests/fixtures/cos-task-single-dispatch-assertions.sql
