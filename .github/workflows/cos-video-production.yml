name: COS Video Production

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cos-video-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install worker dependencies
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@^2 tsx@^4

      # Validate both the worker and its imported TypeScript TTS client.
      - name: Preflight — worker and shared TTS import integrity
        working-directory: saas
        run: npx tsx scripts/cos-video-production-worker.mjs --help

      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Run COS video production worker
        working-directory: saas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
          COS_VIDEO_RENDER_WEBHOOK_URL: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_URL }}
          COS_VIDEO_RENDER_WEBHOOK_TOKEN: ${{ secrets.COS_VIDEO_RENDER_WEBHOOK_TOKEN }}
          COS_VIDEO_WORKER_POLL_MS: ${{ vars.COS_VIDEO_WORKER_POLL_MS || '6000' }}

          # Shared provider chain: ElevenLabs -> OpenAI tts-1-hd -> local espeak.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_TIMEOUT_MS: ${{ vars.ELEVENLABS_TIMEOUT_MS || '10000' }}
          OPENAI_TTS_TIMEOUT_MS: ${{ vars.OPENAI_TTS_TIMEOUT_MS || '10000' }}

        run: npx tsx scripts/cos-video-production-worker.mjs
