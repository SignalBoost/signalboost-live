name: Audit Ruleset Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-ruleset-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect required workflow rules and empty run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EMPTY_RUN_ID: '29715110033'
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          run="$(api "https://api.github.com/repos/${GH_REPO}/actions/runs/${EMPTY_RUN_ID}")"
          echo 'EMPTY_RUN_METADATA:'
          printf '%s' "$run" | jq -c '{id,name,path,event,status,conclusion,head_branch,head_sha,workflow_id,display_title,run_attempt,referenced_workflows}'

          workflow_id="$(printf '%s' "$run" | jq -r '.workflow_id')"
          echo 'WORKFLOW_METADATA:'
          api "https://api.github.com/repos/${GH_REPO}/actions/workflows/${workflow_id}" | jq -c '{id,name,path,state,created_at,updated_at}'

          list="$(api "https://api.github.com/repos/${GH_REPO}/rulesets?includes_parents=true")"
          ids="$(printf '%s' "$list" | jq -r '.[].id')"
          if [ -z "$ids" ]; then
            echo 'RULESET_DIAGNOSTIC: no repository-visible rulesets returned'
            exit 0
          fi
          for id in $ids; do
            detail="$(api "https://api.github.com/repos/${GH_REPO}/rulesets/${id}?includes_parents=true")"
            printf '%s' "$detail" | jq -c '{id,name,target,enforcement,source_type,source,required_workflows:[.rules[]? | select(.type == "workflows") | .parameters.workflows[]? | {path,ref,sha,repository_id}]}'
          done
