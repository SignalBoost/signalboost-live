name: Audit Remediation Regression

on:
  # Generated ai/audit-run-* pull requests change application source files, not
  # necessarily audit infrastructure. A trigger-level paths filter would create
  # a required workflow record with zero jobs, blocking the approved remediation.
  # Run this focused validation for every PR targeting the protected branches.
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      global_approval:
        description: 'Run the approved audit-remediation validation batch. Source changes still require the existing preview and PR confirmation gate.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit-remediation:
    name: Verify audit consent and patch flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the only job allowed to execute dependency lifecycle scripts.
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
      NODE_VERSION: '24.x'
      NPM_POLICY: dangerously-allow-all-scripts
      npm_config_cache: ${{ runner.temp }}/npm-cache
      npm_config_ignore_scripts: 'false'
      npm_config_install_links: 'true'
    defaults:
      run:
        working-directory: saas
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install audit-remediation dependencies
        # npm ci installs the package-lock's directory, tarball, git, and HTTPS
        # dependency specs. The explicit policy is deliberately scoped to this job.
        run: npm ci --dangerously-allow-all-scripts

      - name: Run focused audit tests
        run: npm run test:audit-consent && node --test tests/auditRemediationWorkflowTrigger.node.test.ts

      - name: Run globally approved remediation batch
        if: github.event_name == 'workflow_dispatch' && inputs.global_approval
        # The batch validates every proposed remediation after owner approval.
        # Applying a patch remains guarded by PatchPreview's explicit PR confirmation.
        run: npm run test:audit-consent && node --test tests/auditRemediationWorkflowTrigger.node.test.ts

      - name: Verify worker guard
        working-directory: .
        run: node scripts/verify-workers.mjs

      - name: Write audit-remediation run log
        if: always()
        working-directory: .
        run: |
          status="${{ job.status }}"
          case "$status" in
            success) status="completed" ;;
            *) status="failed" ;;
          esac
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{\n  "runId": "%s",\n  "nodeVersion": "24.x",\n  "npmPolicy": "dangerously-allow-all-scripts",\n  "status": "%s",\n  "timestamp": "%s"\n}\n' \
            "${{ github.run_id }}" "$status" "$timestamp" | tee audit-remediation-run.json

      - name: Upload audit-remediation run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-run-${{ github.run_id }}
          path: audit-remediation-run.json
          if-no-files-found: error
