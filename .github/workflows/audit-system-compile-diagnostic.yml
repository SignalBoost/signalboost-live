name: Audit System Compile Fix

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-system-compile-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Remove unreachable partial branch after the merge guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('saas/lib/audit/approvedRunRemediationSystem.ts')
          content = path.read_text()
          old = """  const partial = params.result.status === 'partial'
          const pending = systemResult(params.result, {
            ok: true,
            status: partial ? 'partial' : autoMerge.queued ? 'auto_merge_queued' : 'pr_ready',
            lifecycleStatus: partial ? 'partial' : autoMerge.queued ? 'auto_merge_queued' : 'checks_pending',
            autoMergeQueued: autoMerge.queued,
            autoMergeError: autoMerge.queued ? '' : autoMerge.error,
          })"""
          new = """  const pending = systemResult(params.result, {
            ok: true,
            status: autoMerge.queued ? 'auto_merge_queued' : 'pr_ready',
            lifecycleStatus: autoMerge.queued ? 'auto_merge_queued' : 'checks_pending',
            autoMergeQueued: autoMerge.queued,
            autoMergeError: autoMerge.queued ? '' : autoMerge.error,
          })"""
          count = content.count(old)
          if count != 1:
            raise SystemExit(f'expected one unreachable partial block, found {count}')
          path.write_text(content.replace(old, new))
          PY

      - name: Commit compiler fix
        run: |
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/lib/audit/approvedRunRemediationSystem.ts
          git commit -m 'Remove unreachable audit partial branch'
          git push origin HEAD:fix/audit-system-end-to-end
