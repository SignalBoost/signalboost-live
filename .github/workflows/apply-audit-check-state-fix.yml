name: Apply Audit Check State Fix

on:
  push:
    branches:
      - fix/audit-check-failure-progress
    paths:
      - '.github/workflows/apply-audit-check-state-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-check-failure-progress
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply truthful failed-check and stalled-progress handling
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceRequired(value, before, after, label) {
            if (value.includes(after)) return value
            if (!value.includes(before)) throw new Error(`Missing expected ${label}`)
            return value.replace(before, after)
          }

          const systemPath = 'saas/lib/audit/approvedRunRemediationSystem.ts'
          let system = fs.readFileSync(systemPath, 'utf8')

          system = replaceRequired(system,
`export type AuditRemediationLifecycleStatus =
  | 'preparing'
  | 'checks_pending'
  | 'auto_merge_queued'
  | 'partial'
  | 'merged'
  | 'failed'`,
`export type AuditRemediationLifecycleStatus =
  | 'preparing'
  | 'checks_pending'
  | 'checks_failed'
  | 'repairing'
  | 'auto_merge_queued'
  | 'partial'
  | 'merged'
  | 'failed'`, 'lifecycle status union')

          system = replaceRequired(system,
`  localizationFilesChanged: number
}`,
`  localizationFilesChanged: number
  checkState: 'unknown' | 'pending' | 'failed' | 'success'
  failedChecks: string[]
  pendingChecks: string[]
  repairMessage: string
}`, 'system result check fields')

          system = replaceRequired(system,
`  mergeable: boolean | null
  mergeableState: string
}`,
`  mergeable: boolean | null
  mergeableState: string
  baseSha: string
  headRef: string
}`, 'pull request ref fields')

          system = replaceRequired(system,
`    mergeable: typeof data?.mergeable === 'boolean' ? data.mergeable : null,
    mergeableState: String(data?.mergeable_state || ''),`,
`    mergeable: typeof data?.mergeable === 'boolean' ? data.mergeable : null,
    mergeableState: String(data?.mergeable_state || ''),
    baseSha: String(data?.base?.sha || ''),
    headRef: String(data?.head?.ref || ''),`, 'pull request ref values')

          const checkHelpers = `

type CheckSummary = {
  state: 'unknown' | 'pending' | 'failed' | 'success'
  failed: string[]
  pending: string[]
  error: string
}

const PASSING_CHECK_CONCLUSIONS = new Set(['success', 'neutral', 'skipped'])

async function getCheckSummary(headSha: string): Promise<CheckSummary> {
  if (!headSha) return { state: 'unknown', failed: [], pending: [], error: 'The remediation head commit is missing.' }
  const [runs, statuses] = await Promise.all([
    github(\`/repos/\${REPO}/commits/\${encodeURIComponent(headSha)}/check-runs?per_page=100\`),
    github(\`/repos/\${REPO}/commits/\${encodeURIComponent(headSha)}/status\`),
  ])
  if (!runs.ok && !statuses.ok) {
    return { state: 'unknown', failed: [], pending: [], error: [runs.error, statuses.error].filter(Boolean).join(' | ') }
  }

  const failed = new Set<string>()
  const pending = new Set<string>()
  let observed = 0
  for (const run of Array.isArray(runs.data?.check_runs) ? runs.data.check_runs : []) {
    observed += 1
    const name = String(run?.name || 'GitHub check')
    if (String(run?.status || '') !== 'completed') pending.add(name)
    else if (!PASSING_CHECK_CONCLUSIONS.has(String(run?.conclusion || ''))) failed.add(name)
  }
  for (const status of Array.isArray(statuses.data?.statuses) ? statuses.data.statuses : []) {
    observed += 1
    const name = String(status?.context || 'GitHub status')
    const state = String(status?.state || '')
    if (state === 'pending') pending.add(name)
    else if (state === 'failure' || state === 'error') failed.add(name)
  }

  if (failed.size) return { state: 'failed', failed: [...failed].sort(), pending: [...pending].sort(), error: '' }
  if (pending.size || observed === 0) return { state: 'pending', failed: [], pending: [...pending].sort(), error: '' }
  return { state: 'success', failed: [], pending: [], error: '' }
}

async function branchIsBehind(pr: PullRequestRef): Promise<{ behind: boolean; error: string }> {
  if (!pr.baseSha || !pr.headSha) return { behind: false, error: '' }
  const compared = await github(\`/repos/\${REPO}/compare/\${encodeURIComponent(pr.baseSha)}...\${encodeURIComponent(pr.headSha)}\`)
  if (!compared.ok) return { behind: false, error: compared.error }
  return { behind: Number(compared.data?.behind_by || 0) > 0, error: '' }
}

async function updatePullRequestBranch(pr: PullRequestRef): Promise<{ updated: boolean; error: string }> {
  const result = await github(\`/repos/\${REPO}/pulls/\${pr.number}/update-branch\`, {
    method: 'PUT',
    body: JSON.stringify({ expected_head_sha: pr.headSha }),
  })
  if (result.ok) return { updated: true, error: '' }
  if (result.status === 409 || result.status === 422) return { updated: false, error: result.error }
  return { updated: false, error: result.error }
}
`
          system = replaceRequired(system,
`async function ensurePullRequest(branch: string, title: string, body: string): Promise<{ ok: boolean; value?: PullRequestRef; error: string }> {`,
checkHelpers + `
async function ensurePullRequest(branch: string, title: string, body: string): Promise<{ ok: boolean; value?: PullRequestRef; error: string }> {`, 'check helpers insertion')

          system = replaceRequired(system,
`    mergeCommitSha: '',
    localizationFilesChanged: 0,
    ...patch,`,
`    mergeCommitSha: '',
    localizationFilesChanged: 0,
    checkState: 'unknown',
    failedChecks: [],
    pendingChecks: [],
    repairMessage: '',
    ...patch,`, 'system result defaults')

          system = replaceRequired(system,
`    .select('payload')
    .eq('run_id', runId)
    .order('created_at', { ascending: false })`,
`    .select('payload')
    .eq('run_id', runId)
    .eq('payload->>kind', 'audit_batch_remediation')
    .order('created_at', { ascending: false })`, 'lifecycle log query')

          system = replaceRequired(system,
`    previous?.findingsApplied === payload.findingsApplied &&
    previous?.filesChanged === payload.filesChanged`,
`    previous?.findingsApplied === payload.findingsApplied &&
    previous?.filesChanged === payload.filesChanged &&
    previous?.checkState === payload.checkState &&
    JSON.stringify(previous?.failedChecks || []) === JSON.stringify(payload.failedChecks || []) &&
    previous?.repairMessage === payload.repairMessage`, 'lifecycle log dedup')

          const checkHandling = `

  const checks = await getCheckSummary(pr.headSha)
  if (checks.state === 'failed') {
    const behind = await branchIsBehind(pr)
    if (behind.behind) {
      const update = await updatePullRequestBranch(pr)
      if (update.updated) {
        const repairing = systemResult(params.result, {
          ok: true,
          status: 'pr_ready',
          lifecycleStatus: 'repairing',
          checkState: 'pending',
          failedChecks: checks.failed,
          pendingChecks: [],
          repairMessage: 'SignalBoost AI updated the remediation branch with the current main branch. Protected checks are restarting.',
          autoMergeQueued: false,
          autoMergeError: '',
        })
        await writeLifecycleLog(params.admin, params.runId, params.actorUserId, repairing)
        return repairing
      }
    }

    const checksFailed = systemResult(params.result, {
      ok: true,
      status: 'pr_ready',
      lifecycleStatus: 'checks_failed',
      checkState: 'failed',
      failedChecks: checks.failed,
      pendingChecks: checks.pending,
      repairMessage: '',
      autoMergeQueued: false,
      autoMergeError: \`Protected checks failed: \${checks.failed.join(', ') || 'unknown check'}\${behind.error ? \`. Branch comparison also failed: \${behind.error}\` : ''}\`,
    })
    await writeLifecycleLog(params.admin, params.runId, params.actorUserId, checksFailed)
    return checksFailed
  }
`
          system = replaceRequired(system,
`

const autoMerge = await queueAutoMerge(pr.number)`,
checkHandling + `

  const autoMerge = await queueAutoMerge(pr.number)`, 'failed-check handling')

          system = replaceRequired(system,
`  if (!autoMerge.queued) {
    const directMerge = await mergeCleanPullRequest(pr)`,
`  if (!autoMerge.queued && checks.state === 'success') {
    const directMerge = await mergeCleanPullRequest(pr)`, 'direct merge check gate')

          system = replaceRequired(system,
`  const pending = systemResult(params.result, {
    ok: true,
    status: autoMerge.queued ? 'auto_merge_queued' : 'pr_ready',
    lifecycleStatus: autoMerge.queued ? 'auto_merge_queued' : 'checks_pending',
    autoMergeQueued: autoMerge.queued,
    autoMergeError: autoMerge.queued ? '' : autoMerge.error,
  })`,
`  const pending = systemResult(params.result, {
    ok: true,
    status: autoMerge.queued ? 'auto_merge_queued' : 'pr_ready',
    lifecycleStatus: checks.state === 'success' && autoMerge.queued ? 'auto_merge_queued' : 'checks_pending',
    checkState: checks.state,
    failedChecks: checks.failed,
    pendingChecks: checks.pending,
    repairMessage: '',
    autoMergeQueued: autoMerge.queued,
    autoMergeError: autoMerge.queued ? '' : (autoMerge.error || checks.error),
  })`, 'pending check result')

          fs.writeFileSync(systemPath, system)

          const panelPath = 'saas/components/audit/RemediationLifecyclePanel.tsx'
          let panel = fs.readFileSync(panelPath, 'utf8')
          panel = replaceRequired(panel,
`  lifecycleStatus?: 'preparing' | 'checks_pending' | 'auto_merge_queued' | 'partial' | 'merged' | 'failed' | string`,
`  lifecycleStatus?: 'preparing' | 'checks_pending' | 'checks_failed' | 'repairing' | 'auto_merge_queued' | 'partial' | 'merged' | 'failed' | string`, 'panel status union')
          panel = replaceRequired(panel,
`  lifecycleUpdatedAt?: string
}`,
`  lifecycleUpdatedAt?: string
  checkState?: 'unknown' | 'pending' | 'failed' | 'success'
  failedChecks?: string[]
  pendingChecks?: string[]
  repairMessage?: string
}`, 'panel check fields')
          panel = replaceRequired(panel,
`  heartbeatStale: string
  activityComplete: string`,
`  heartbeatStale: string
  checksFailedActivity: string
  repairingActivity: string
  stalledActivity: string
  failedChecksLabel: string
  activityComplete: string`, 'copy fields')

          const localeAdditions = [
            ["heartbeatStale: 'No recent system heartbeat',", "heartbeatStale: 'No recent system heartbeat', checksFailedActivity: 'GitHub checks failed — AI repair required', repairingActivity: 'AI is repairing the remediation branch', stalledActivity: 'No forward progress — recovery required', failedChecksLabel: 'Failed checks',"],
            ["heartbeatStale: 'Sin señal reciente del sistema',", "heartbeatStale: 'Sin señal reciente del sistema', checksFailedActivity: 'Fallaron las verificaciones de GitHub — la IA debe reparar', repairingActivity: 'La IA está reparando la rama de corrección', stalledActivity: 'Sin progreso — se requiere recuperación', failedChecksLabel: 'Verificaciones fallidas',"],
            ["heartbeatStale: 'Sem sinal recente do sistema',", "heartbeatStale: 'Sem sinal recente do sistema', checksFailedActivity: 'As verificações do GitHub falharam — a IA precisa reparar', repairingActivity: 'A IA está reparando a ramificação de correção', stalledActivity: 'Sem progresso — recuperação necessária', failedChecksLabel: 'Verificações com falha',"],
            ["heartbeatStale: 'Brak ostatniego sygnału systemu',", "heartbeatStale: 'Brak ostatniego sygnału systemu', checksFailedActivity: 'Kontrole GitHub nie powiodły się — AI musi naprawić', repairingActivity: 'AI naprawia gałąź poprawek', stalledActivity: 'Brak postępu — wymagane odzyskiwanie', failedChecksLabel: 'Nieudane kontrole',"],
            ["heartbeatStale: 'Нет недавнего сигнала системы',", "heartbeatStale: 'Нет недавнего сигнала системы', checksFailedActivity: 'Проверки GitHub не пройдены — ИИ должен исправить', repairingActivity: 'ИИ исправляет ветку изменений', stalledActivity: 'Нет прогресса — требуется восстановление', failedChecksLabel: 'Неудачные проверки',"],
          ]
          for (const [before, after] of localeAdditions) panel = replaceRequired(panel, before, after, `locale activity copy ${before}`)

          panel = replaceRequired(panel,
`  if (status === 'failed') return { title: copy.failed, detail: copy.detailFailed, tone: 'border-danger/50 text-danger' }
  if (status === 'partial')`,
`  if (status === 'failed' || status === 'checks_failed') return { title: copy.failed, detail: copy.detailFailed, tone: 'border-danger/50 text-danger' }
  if (status === 'repairing') return { title: copy.checksPending, detail: copy.detailChecks, tone: 'border-accent/50 text-accent' }
  if (status === 'partial')`, 'state copy check statuses')
          panel = replaceRequired(panel,
`  if (status === 'checks_pending' || status === 'partial') return 2`,
`  if (status === 'checks_pending' || status === 'checks_failed' || status === 'repairing' || status === 'partial') return 2`, 'active stage checks')
          panel = replaceRequired(panel,
`  if (status === 'failed') return Math.max(20, activeStage(status, state) * 20)`,
`  if (status === 'failed' || status === 'checks_failed') return Math.max(20, activeStage(status, state) * 20)`, 'progress failed checks')
          panel = replaceRequired(panel,
`  if (status === 'failed') return 'failed'
  if (status === 'partial') return 'warning'`,
`  if (status === 'failed' || status === 'checks_failed') return 'failed'
  if (status === 'partial' || status === 'repairing') return 'warning'`, 'stage tone checks')
          panel = replaceRequired(panel,
`function activityState(copy: Copy, status: string, heartbeatAge: number | null) {
  if (status === 'merged' || status === 'partial') return { label: copy.activityComplete, color: '#34d399', live: false }
  if (status === 'failed') return { label: copy.activityStopped, color: '#fca5a5', live: false }
  if (heartbeatAge === null)`,
`function activityState(copy: Copy, status: string, heartbeatAge: number | null, changedAge: number | null) {
  if (status === 'merged' || status === 'partial') return { label: copy.activityComplete, color: '#34d399', live: false }
