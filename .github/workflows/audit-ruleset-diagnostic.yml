name: Audit Ruleset Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-ruleset-diagnostic.yml'

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  inspect-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect invalid audit workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EMPTY_RUN_ID: '29715386952'
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          run="$(api "https://api.github.com/repos/${GH_REPO}/actions/runs/${EMPTY_RUN_ID}")"
          echo 'EMPTY_RUN_METADATA:'
          printf '%s' "$run" | jq -c '{id,name,path,event,status,conclusion,head_branch,head_sha,workflow_id,check_suite_id,display_title,run_attempt,referenced_workflows}'

          workflow_id="$(printf '%s' "$run" | jq -r '.workflow_id')"
          echo 'WORKFLOW_METADATA:'
          api "https://api.github.com/repos/${GH_REPO}/actions/workflows/${workflow_id}" | jq -c '{id,name,path,state,created_at,updated_at}'

          suite_id="$(printf '%s' "$run" | jq -r '.check_suite_id')"
          echo 'CHECK_RUNS:'
          checks="$(api "https://api.github.com/repos/${GH_REPO}/check-suites/${suite_id}/check-runs")"
          printf '%s' "$checks" | jq -c '.check_runs[]? | {id,name,status,conclusion,details_url,output}'

          for check_id in $(printf '%s' "$checks" | jq -r '.check_runs[]?.id'); do
            echo "ANNOTATIONS_FOR_${check_id}:"
            api "https://api.github.com/repos/${GH_REPO}/check-runs/${check_id}/annotations" | jq -c '.[]? | {path,start_line,end_line,annotation_level,title,message,raw_details}'
          done
