name: Require ONBOARD.md Critical File Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  critical-onboard-maintenance:
    name: Critical files require ONBOARD.md update or no-change statement
    runs-on: ubuntu-latest
    steps:
      - name: Confirm ONBOARD merge gate is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo "ONBOARD.md updates and PR-body exception statements are no longer required for merge."
          echo "This pass-through job keeps the existing status-check name available so branch protection does not deadlock."
          echo "All other lint, test, security, approval, and role-validation checks remain unchanged."
