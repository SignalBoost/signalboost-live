name: COS feedback localization fix

on:
  push:
    branches: [feat/cos-user-feedback-learning-20260816]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cos-user-feedback-learning-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Centralize assistant feedback copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          translations = {
            'en': {
              'helpful': 'Helpful',
              'notHelpful': 'Not helpful',
              'correctThis': 'Correct this',
              'correctionPlaceholder': 'What should COS learn from this?',
              'submitCorrection': 'Submit correction',
              'cancelCorrection': 'Cancel',
              'feedbackSaved': 'Feedback saved for COS learning.',
              'feedbackError': 'Could not save feedback.',
            },
            'es': {
              'helpful': 'Útil',
              'notHelpful': 'No útil',
              'correctThis': 'Corregir',
              'correctionPlaceholder': '¿Qué debería aprender COS de esto?',
              'submitCorrection': 'Enviar corrección',
              'cancelCorrection': 'Cancelar',
              'feedbackSaved': 'Comentarios guardados para el aprendizaje de COS.',
              'feedbackError': 'No se pudieron guardar los comentarios.',
            },
            'pt': {
              'helpful': 'Útil',
              'notHelpful': 'Não ajudou',
              'correctThis': 'Corrigir',
              'correctionPlaceholder': 'O que o COS deve aprender com isso?',
              'submitCorrection': 'Enviar correção',
              'cancelCorrection': 'Cancelar',
              'feedbackSaved': 'Feedback salvo para o aprendizado do COS.',
              'feedbackError': 'Não foi possível salvar o feedback.',
            },
            'pl': {
              'helpful': 'Pomocne',
              'notHelpful': 'Niepomocne',
              'correctThis': 'Popraw',
              'correctionPlaceholder': 'Czego COS powinien się z tego nauczyć?',
              'submitCorrection': 'Wyślij poprawkę',
              'cancelCorrection': 'Anuluj',
              'feedbackSaved': 'Opinia zapisana do uczenia COS.',
              'feedbackError': 'Nie udało się zapisać opinii.',
            },
            'ru': {
              'helpful': 'Полезно',
              'notHelpful': 'Не помогло',
              'correctThis': 'Исправить',
              'correctionPlaceholder': 'Что COS должен из этого извлечь?',
              'submitCorrection': 'Отправить исправление',
              'cancelCorrection': 'Отмена',
              'feedbackSaved': 'Отзыв сохранён для обучения COS.',
              'feedbackError': 'Не удалось сохранить отзыв.',
            },
          }

          for lang, copy in translations.items():
            path = Path(f'saas/locales/{lang}.json')
            data = json.loads(path.read_text())
            if 'assistantFeedback' in data:
              raise SystemExit(f'{path}: assistantFeedback already exists')
            data['assistantFeedback'] = copy
            path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          page = Path('saas/app/dashboard/assistant/page.tsx')
          text = page.read_text()
          copy_lines = """  helpful:      { en: 'Helpful', es: 'Útil', pt: 'Útil', pl: 'Pomocne', ru: 'Полезно' },
  notHelpful:   { en: 'Not helpful', es: 'No útil', pt: 'Não ajudou', pl: 'Niepomocne', ru: 'Не помогло' },
  correctThis:  { en: 'Correct this', es: 'Corregir', pt: 'Corrigir', pl: 'Popraw', ru: 'Исправить' },
  correctionPlaceholder: { en: 'What should COS learn from this?', es: '¿Qué debería aprender COS de esto?', pt: 'O que o COS deve aprender com isso?', pl: 'Czego COS powinien się z tego nauczyć?', ru: 'Что COS должен из этого извлечь?' },
  submitCorrection: { en: 'Submit correction', es: 'Enviar corrección', pt: 'Enviar correção', pl: 'Wyślij poprawkę', ru: 'Отправить исправление' },
  cancelCorrection: { en: 'Cancel', es: 'Cancelar', pt: 'Cancelar', pl: 'Anuluj', ru: 'Отмена' },
  feedbackSaved: { en: 'Feedback saved for COS learning.', es: 'Comentarios guardados para el aprendizaje de COS.', pt: 'Feedback salvo para o aprendizado do COS.', pl: 'Opinia zapisana do uczenia COS.', ru: 'Отзыв сохранён для обучения COS.' },
  feedbackError: { en: 'Could not save feedback.', es: 'No se pudieron guardar los comentarios.', pt: 'Não foi possível salvar o feedback.', pl: 'Nie udało się zapisać opinii.', ru: 'Не удалось сохранить отзыв.' },
"""
          if text.count(copy_lines) != 1:
            raise SystemExit(f'expected one inline feedback copy block, found {text.count(copy_lines)}')
          text = text.replace(copy_lines, '', 1)
          replacements = {
            'c(COPY.helpful, l)': "uiText('assistantFeedback.helpful')",
            'c(COPY.notHelpful, l)': "uiText('assistantFeedback.notHelpful')",
            'c(COPY.correctThis, l)': "uiText('assistantFeedback.correctThis')",
            'c(COPY.correctionPlaceholder, l)': "uiText('assistantFeedback.correctionPlaceholder')",
            'c(COPY.submitCorrection, l)': "uiText('assistantFeedback.submitCorrection')",
            'c(COPY.cancelCorrection, l)': "uiText('assistantFeedback.cancelCorrection')",
            'c(COPY.feedbackSaved, l)': "uiText('assistantFeedback.feedbackSaved')",
            'c(COPY.feedbackError, l)': "uiText('assistantFeedback.feedbackError')",
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{old}: expected once, found {count}')
            text = text.replace(old, new, 1)
          page.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/cos-feedback-i18n-fix.yml
          git config user.name 'SignalBoost CI'
          git config user.email 'cadomos@gmail.com'
          git add -A
          git commit -m 'fix(i18n): centralize COS feedback learning copy'
          git push origin HEAD:feat/cos-user-feedback-learning-20260816
