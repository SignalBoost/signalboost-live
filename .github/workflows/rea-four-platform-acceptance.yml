name: REA four-platform evidence acceptance
on:
  pull_request:
    paths:
      - 'verification/rea/four-platform-evidence.json'
      - 'scripts/rea-builder-transfer.mjs'
      - 'scripts/rea-four-platform.test.mjs'
      - '.github/workflows/rea-four-platform-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/rea-four-platform.test.mjs scripts/rea-builder-transfer.test.mjs
      - run: node scripts/rea-builder-transfer.mjs verification/rea/four-platform-evidence.json /tmp/rea-four-platform-result.json
