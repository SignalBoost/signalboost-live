# .github/workflows/diag-builder-job.yml
# Temporary, branch-only: reads one Builder job and its workspace, encrypted to an operator key. Never merged.
name: diag-builder-job
on:
  push:
    branches: [diag/builder-job-e98aa467]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Read job and workspace (encrypted output only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA+PDSrLXBy+9tgFL5DI60
          O3ThW0d5dQCkWie19YbBuRxISXMNXM2ArQ3QQvA/coObliOMdke63lj6u4P6HXZA
          yJhTm/Xm/2C7VIdnP8OWqvNeAv4Z041Sk+qpgwizGTzVTE37TJmFYgOfz6MoOrTn
          XwmeAbRP9klAuC6FTVq8AZVVTXy8uGerIjN8dyXg11SKLMD1tuf20RqAJHLWKp3o
          5DwmiP+wwUaSQBd4GvsN/UCitwxaqhEijl6fyszHPxQNf5M7d6nMKJJNhY/u4MHk
          SeYB+xfULEVA6h2SWMt8ciRYvqHMEthuzQIhlBwdFGWElTFiNBpi80VR5Kb4wNcv
          2cCLIq/XaQhdk63FyXRdxxTSEi13kGxutGEWlKx9zT57i4jJqp160EdKk19eqzsK
          avPh0gFwqnEEgipivy5YH7AF472j6nTvNhuO+QIYigRIzAPCoBRgGpDCamBQXdqF
          SQJu1KD88lnpUIGquPCEBc2dPMpbA6dHLhKPcz5IKkuDAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          node - <<'JS'
          const fs = require('fs')
          const h = { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: 'Bearer ' + process.env.SUPABASE_SERVICE_ROLE_KEY }
          const get = async q => { const r = await fetch(process.env.SUPABASE_URL + '/rest/v1/' + q, { headers: h }); if (!r.ok) throw new Error(r.status + ' ' + q.split('?')[0]); return r.json() }
          ;(async () => {
            const [job] = await get('builder_jobs?id=eq.e98aa467-3d1f-438f-ac59-0d345dd191e1&select=status,error,claim_generation,created_at,finished_at,checkpoint,result,workspace_id')
            const files = await get('builder_workspace_files?workspace_id=eq.' + job.workspace_id + '&select=path,content,updated_at')
            for (const f of files) if (String(f.content).startsWith('base64:')) f.content = Buffer.from(f.content.slice(7), 'base64').toString('utf8')
            fs.writeFileSync('dump.json', JSON.stringify({ job, files }))
            console.log('rows', files.length)
          })().catch(e => { console.error(e.message); process.exit(1) })
          JS
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in dump.json -out dump.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.bin -out k.enc
          rm -f dump.json k.bin
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: |
            dump.enc
            k.enc
          retention-days: 1
