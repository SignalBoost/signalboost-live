name: PR 927 Replay Nonprotected Fixes

on:
  push:
    branches:
      - fix/pr927-owner-verified-repair
    paths:
      - '.github/workflows/pr927-replay-nonprotected.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr927-owner-verified-repair
          fetch-depth: 0
      - name: Replay verified non-protected files
        shell: bash
        run: |
          set -euo pipefail
          source_sha='d1c49ddc861c8ebde7020cc9120934e49b7b669d'
          git fetch origin "$source_sha"
          files=(
            saas/lib/supervisor/assessment-ledger.ts
            saas/package.json
            saas/press-media-host/engine.ts
            saas/tests/platformHealthMonitor.node.test.ts
            saas/tests/pressCampaignBuckets.node.test.ts
            saas/tests/prospectIntelligenceFoundation.node.test.ts
            saas/tests/providerHubLiveDataReadAdapter.node.test.ts
            saas/tests/remainingPortableLiveSources.node.test.ts
          )
          for file in "${files[@]}"; do
            git show "$source_sha:$file" > "$file"
          done
          git config user.name 'SignalBoost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "${files[@]}"
          git diff --cached --check
          git commit -m 'fix(ci): replay non-protected verification corrections'
          git push origin HEAD:fix/pr927-owner-verified-repair
