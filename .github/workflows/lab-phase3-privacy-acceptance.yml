name: Phase 3 privacy egress acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/lab-phase3-privacy-acceptance.yml'
      - 'saas/lib/ai/cos/itmountsLabEgressPolicy.ts'
      - 'saas/tests/itmountsLabEgressPolicy.node.test.ts'
      - 'saas/lib/ai/cos/itmountsLabEgressExecution.ts'
      - 'saas/tests/itmountsLabEgressExecution.node.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-egress:
    name: Privacy tier fail-closed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Phase 3 privacy policy, including unknown tiers
        working-directory: saas
        run: node --test tests/itmountsLabEgressPolicy.node.test.ts tests/itmountsLabEgressExecution.node.test.ts
