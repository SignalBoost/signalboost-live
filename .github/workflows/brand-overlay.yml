name: COS Brand Overlay (FFmpeg)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may add a few minutes of lag)
  workflow_dispatch: {}       # manual "Run workflow" button for instant testing

concurrency:
  group: cos-brand-overlay
  cancel-in-progress: false   # never kill a run mid-render

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # PREFLIGHT: fail loudly if the worker file is corrupted (e.g. YAML or
      # TypeScript pasted over it) instead of a cryptic instant SyntaxError.
      - name: Preflight — worker file integrity
        run: |
          if ! node --check scripts/brand-overlay-worker.mjs; then
            echo "::error file=scripts/brand-overlay-worker.mjs::MISFILED OR CORRUPTED WORKER — not valid JavaScript. Another file's content was likely pasted here. All video branding is stopped until scripts/brand-overlay-worker.mjs is restored."
            exit 1
          fi

      - name: Install worker dependencies
        # The worker imports @supabase/supabase-js. Install only what the
        # script needs; pulling the full Next.js dependency tree here would
        # waste minutes per run.
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@^2

      - name: Install FFmpeg + fonts
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Run brand overlay worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Same bucket knob as cos-video-production.yml and Vercel. All three
          # runtimes MUST agree or objects strand ("Bucket not found").
          COS_VIDEO_RENDER_BUCKET: ${{ vars.COS_VIDEO_RENDER_BUCKET || 'video-renders' }}
        run: node scripts/brand-overlay-worker.mjs
