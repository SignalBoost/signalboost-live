name: iTMounts preserve technical evidence
on:
  push:
    branches: [fix/itmounts-brand-final-proof-20260912]
    paths: [.github/workflows/itmounts-preserve-technical-blobs.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'SignalBoost/signalboost-live' && github.ref == 'refs/heads/fix/itmounts-brand-final-proof-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4161e8d1be3d4fe6f44e63a6ac69d50c9a07d20b
          persist-credentials: false
      - name: Prepare two hash-verified blobs only; never update refs or Production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.request
          def gh(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          hp='saas/lib/cyber/cyberReportPresentation.ts'
          tp='saas/tests/cyberLegacyPresentation.node.test.ts'
          s=Path(hp).read_text()
          u=Path(tp).read_text()
          assert gh(s.encode())=='227ded2f518f1f07eaa2131c35e860d05daa12ab'
          assert gh(u.encode())=='686e4de2e71a9b55b5c90b72d3d827777dea1ca1'
          registry='''// Exact runtime identifiers observed in the current repository source inventory.
          // These are evidence values (User-Agents, schema names and runtime IDs), not product
          // adjectives. Keep this list reconciled when implementation identifiers are added.
          const LEGACY_TECHNICAL_IDENTIFIERS = new Set([
            'signalboost-api', 'signalboost-worker', 'signalboost-live', 'signalboost-clean',
            'signalboost-assistant', 'signalboost-cos', 'signalboost-cos-builder',
            'signalboost-cos-business-intelligence-corpus', 'signalboost-cos-platform-engineer',
            'signalboost-locale-completion', 'signalboost-provider-version', 'signalboost-request-id',
            'signalboost-url-intelligence', 'signalboost-universalprovider',
            'signalboost-verified-person-visual', 'signalboost-verified-visual',
            'signalboost-host', 'signalboost-anon', 'signalboost-assistant-transport',
            'signalboost-audio', 'signalboost-audit', 'signalboost-aws-access-key',
            'signalboost-aws-secret-key', 'signalboost-backup-cos-v1',
            'signalboost-base-v2-clean-background', 'signalboost-base-v3-fast-720p',
            'signalboost-base-v4-clean-full-screen', 'signalboost-brand-banner-v2-prominent-full-width',
            'signalboost-builder-job-v1', 'signalboost-campaign-copy-v2-clean',
            'signalboost-captions-v2-solid-panel', 'signalboost-captions-v3-solid-panel',
            'signalboost-captions-v4-solid-panel', 'signalboost-chief-of-staff', 'signalboost-cloud',
            'signalboost-concierge-panel', 'signalboost-copy-v3-customer-only',
            'signalboost-copy-v4-customer-only', 'signalboost-cos-blueprint',
            'signalboost-cos-blueprint-v1', 'signalboost-cos-brain-v1',
            'signalboost-cos-continuity-v1', 'signalboost-cos-engineering',
            'signalboost-cos-integrity-v3', 'signalboost-cos-verify',
            'signalboost-data-center-diagnostic-error-v1', 'signalboost-data-center-diagnostic-v1',
            'signalboost-dc-simulator', 'signalboost-demo', 'signalboost-demo-drill',
            'signalboost-external-ai', 'signalboost-host-context', 'signalboost-i18n-sweep',
            'signalboost-identity', 'signalboost-language-purity-v1', 'signalboost-learning-admission',
            'signalboost-memory-vs-cache', 'signalboost-operator', 'signalboost-platform',
            'signalboost-reference', 'signalboost-reference-acceptance',
            'signalboost-reference-diagnostic-assignment', 'signalboost-reference-live',
            'signalboost-reference-self-healing-diagnostic-http', 'signalboost-repair',
            'signalboost-saas-api', 'signalboost-self-healing-supervisor',
            'signalboost-supervisor-signature', 'signalboost-surface', 'signalboost-vector-space',
          ])
          // Runtime-generated names append IDs/version labels to these observed prefixes.
          const LEGACY_TECHNICAL_PREFIXES = [
            'signalboost-live-', 'signalboost-api-', 'signalboost-worker-',
            'signalboost-console-', 'signalboost-vault-rotated-', 'signalboost-banner-upgrade-',
            'signalboost-base-video-', 'signalboost-creative-', 'signalboost-deck-',
            'signalboost-fast-final-', 'signalboost-self-healing-supervisor-',
            'signalboost-video-', 'signalboost-voice-',
          ]

          '''
          s=s.replace('/** Display product prose only; never pass the result to persistence or authorization. */',registry+'/** Display product prose only; never pass the result to persistence or authorization. */')
          start=s.index('  // Mailto headers are part of the URI.')
          end=s.index('  // This is token shielding',start)
          s=s[:start]+'''  // Punctuation is legal URL/IRI path or query data, not a reliable prose boundary.
            // Preserve the complete lexical URI (including mailto headers) byte-for-byte.
            // Ambiguous adjacent text stays technical; clearly separated prose is normalized.
            const url = /(?:[a-z][a-z0-9+.-]*:\\/\\/|git@|mailto:)[^\\s<>"`]+/
          '''+s[end:]
          start=s.index('      // Known bare implementation identifiers')
          end=s.index('      return publicBrandText(brand)',start)
          s=s[:start]+'''      const identity = token.toLowerCase()
                if (LEGACY_TECHNICAL_IDENTIFIERS.has(identity)
                  || LEGACY_TECHNICAL_PREFIXES.some(prefix => identity.startsWith(prefix))) return token
          '''+s[end:]
          start=s.index('    let protectedLength = match[0].length')
          end=s.index('\n  }\n  return rendered',start)
          s=s[:start]+'''    rendered += prose(value.slice(cursor, match.index)) + match[0]
              cursor = match.index + match[0].length'''+s[end:]
          u=u.replace(', \'mailto:SignalBoost@example.com\']) {\n    for (const separator', "]) {\n    for (const separator")
          u=u.replace("test('natural-language punctuation after a URL does not shield following product prose', () => {", "test('Unicode punctuation stays in URI tokens while clearly separated prose normalizes', () => {")
          u=u.replace("assert.equal(cyberProductText(`${link}${punctuation}SignalBoost prepared a plan`), `${link}${punctuation}iTMounts prepared a plan`)", "assert.equal(cyberProductText(`${link}${punctuation}SignalBoost prepared a plan`), `${link}${punctuation}SignalBoost prepared a plan`)\n      assert.equal(cyberProductText(`${link}${punctuation} SignalBoost prepared a plan`), `${link}${punctuation} iTMounts prepared a plan`)")
          u=u.replace("test('ASCII sentence punctuation after a bare URL does not swallow product prose', () => {", "test('ASCII punctuation does not reclassify valid URI suffixes as product prose', () => {")
          u=u.replace("assert.equal(cyberProductText(`${link}${punctuation}${name} prepared a plan`), `${link}${punctuation}${branded} prepared a plan`)", "assert.equal(cyberProductText(`${link}${punctuation}${name} prepared a plan`), `${link}${punctuation}${name} prepared a plan`)\n        assert.equal(cyberProductText(`${link}${punctuation} ${name} prepared a plan`), `${link}${punctuation} ${branded} prepared a plan`)")
          u=u.replace("test('the reported recipient-free mailto header stops before dash-separated prose', () => {\n  assert.equal(cyberProductText('mailto:?subject=Status—SignalBoost prepared a plan'), 'mailto:?subject=Status—iTMounts prepared a plan')\n})", "test('the reported recipient-free mailto header is preserved until an unambiguous separator', () => {\n  const ambiguous = 'mailto:?subject=Status—SignalBoost prepared a plan'\n  assert.equal(cyberProductText(ambiguous), ambiguous)\n  assert.equal(cyberProductText('mailto:?subject=Status — SignalBoost prepared a plan'), 'mailto:?subject=Status — iTMounts prepared a plan')\n  assert.equal(cyberProductText('mailto:SignalBoost@example.com?subject=SignalBoost'), 'mailto:SignalBoost@example.com?subject=SignalBoost')\n})")
          u+='''
          test('actual technical User-Agent and schema identifiers stay exact in saved prose', () => {
            const identifiers = [
              'SignalBoost-COS-Builder', 'signalboost-audit', 'SignalBoost-COS-Platform-Engineer',
              'SignalBoost-COS-Business-Intelligence-Corpus', 'SignalBoost-Provider-Version',
              'SignalBoost-Request-Id', 'SignalBoost-URL-Intelligence', 'SignalBoost-UniversalProvider',
              'SignalBoost-Verified-Person-Visual', 'SignalBoost-Locale-Completion',
              'signalboost-builder-job-v1', 'signalboost-cos-brain-v1', 'signalboost-cloud',
              'signalboost-host-context', 'signalboost-self-healing-supervisor', 'signalboost-clean',
              'signalboost-reference-diagnostic-assignment', 'signalboost-assistant-transport',
              'signalboost-aws-access-key', 'SignalBoost-Console-123', 'SignalBoost-Vault-Rotated-123',
            ]
            for (const identity of identifiers) {
              assert.equal(cyberProductText(identity), identity)
              assert.equal(cyberProductText(`SignalBoost recorded ${identity} as a technical identifier.`), `iTMounts recorded ${identity} as a technical identifier.`)
            }
            for (const adjective of ['owned', 'selected', 'specific', 'created', 'provided', 'verified', 'assisted']) {
              assert.equal(cyberProductText(`SignalBoost-${adjective} remediation`), `iTMounts-${adjective} remediation`)
            }
          })

          test('legal punctuation inside URL paths is never rewritten based on the following word', () => {
            for (const separator of [',', ';', '!', ')', '—', '–', '，', '。']) {
              const url = `https://example.com/path/SignalBoost${separator}SignalBoost`
              assert.equal(cyberProductText(`${url} reference`), `${url} reference`)
              assert.equal(cyberProductText(`${url} reference for SignalBoost`), `${url} reference for iTMounts`)
            }
          })
          '''
          candidates={hp:(s,'5c72605d92b2930761fc9ba7fc183af63b57b9fd'),tp:(u,'31cdf181843b3e728816a8130bb5a8b5ead83964')}
          for path,(content,expected) in candidates.items():
              assert gh(content.encode())==expected, 'Local-tested hash mismatch: '+path
          for path,(content,expected) in candidates.items():
              request=urllib.request.Request('https://api.github.com/repos/SignalBoost/signalboost-live/git/blobs',data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
              assert blob['sha']==expected
              print(path,blob['sha'])
          PY
