name: Builder symbolic safety model
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verification/builder/**'
      - '.github/workflows/builder-symbolic.yml'
permissions:
  contents: read
jobs:
  apalache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check bounded lease and verification safety
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/verification/builder:/model:ro" ghcr.io/apalache-mc/apalache:main check --init=Init --next=Next --inv=Safety --length=8 /model/BuilderLease.tla
