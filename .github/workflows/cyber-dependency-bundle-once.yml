name: Cyber dependency bundle preparation
on:
  push:
    branches: ['prep/cyber-dependency-patches-20260911']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'SignalBoost/signalboost-live' && github.ref == 'refs/heads/prep/cyber-dependency-patches-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate only dependency files and verify focused versions
        run: node .github/cyber-dependency-bundle-once.mjs prepare
      - name: Store verified unreachable blobs only (no ref or merge writes)
        run: node .github/cyber-dependency-bundle-once.mjs upload-blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyber-dependency-bundle-${{ github.run_id }}
          path: .cyber-patch-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
