name: Audit System Compile Fix

on:
  push:
    branches:
      - fix/audit-system-end-to-end
    paths:
      - '.github/workflows/audit-system-compile-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/audit-system-end-to-end
          fetch-depth: 0

      - name: Remove unreachable partial branch after the merge guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('saas/lib/audit/approvedRunRemediationSystem.ts')
          lines = path.read_text().splitlines()
          partial_line = "const partial = params.result.status === 'partial'"
          status_old = "status: partial ? 'partial' : autoMerge.queued ? 'auto_merge_queued' : 'pr_ready',"
          status_new = "status: autoMerge.queued ? 'auto_merge_queued' : 'pr_ready',"
          lifecycle_old = "lifecycleStatus: partial ? 'partial' : autoMerge.queued ? 'auto_merge_queued' : 'checks_pending',"
          lifecycle_new = "lifecycleStatus: autoMerge.queued ? 'auto_merge_queued' : 'checks_pending',"

          counts = {
            'partial': sum(line.strip() == partial_line for line in lines),
            'status': sum(line.strip() == status_old for line in lines),
            'lifecycle': sum(line.strip() == lifecycle_old for line in lines),
          }
          if counts != {'partial': 1, 'status': 1, 'lifecycle': 1}:
            raise SystemExit(f'unexpected compiler block counts: {counts}')

          output = []
          for line in lines:
            stripped = line.strip()
            indent = line[:len(line) - len(line.lstrip())]
            if stripped == partial_line:
              continue
            if stripped == status_old:
              output.append(indent + status_new)
            elif stripped == lifecycle_old:
              output.append(indent + lifecycle_new)
            else:
              output.append(line)
          path.write_text('\n'.join(output) + '\n')
          PY

      - name: Commit compiler fix
        run: |
          git config user.name 'SignalBoost Audit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/lib/audit/approvedRunRemediationSystem.ts
          git commit -m 'Remove unreachable audit partial branch'
          git push origin HEAD:fix/audit-system-end-to-end
