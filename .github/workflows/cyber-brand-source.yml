name: Cyber Brand Source Snapshot
on:
  push:
    branches: [fix/itmounts-cyber-display-brand-20260912]
    paths: [.github/workflows/cyber-brand-source.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'SignalBoost/signalboost-live' && github.ref == 'refs/heads/fix/itmounts-cyber-display-brand-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed exact-blob patch without writing any Git ref
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          const ops = [
            {"path":"saas/lib/cyber/cyberReportPresentation.ts","before":"510966b9bce67c6474d8b395e58078665822219a","replacements":[["// Read-only presentation helpers.","import { publicBrandText } from '../public-brand.ts'\n\n// Read-only presentation helpers.",1],["  en: {","  en: {\n    brandDisplayNotice: \"Product names are displayed as iTMounts. Stored records and approval history are unchanged.\",",1],["  es: {","  es: {\n    brandDisplayNotice: \"Los nombres del producto se muestran como iTMounts. Los registros guardados y el historial de aprobación no cambian.\",",1],["  pt: {","  pt: {\n    brandDisplayNotice: \"O nome do produto é exibido como iTMounts. Os registros salvos e o histórico de aprovação permanecem inalterados.\",",1],["  pl: {","  pl: {\n    brandDisplayNotice: \"Nazwa produktu jest wyświetlana jako iTMounts. Zapisane rekordy i historia akceptacji pozostają bez zmian.\",",1],["  ru: {","  ru: {\n    brandDisplayNotice: \"Название продукта отображается как iTMounts. Сохранённые записи и история одобрений не изменены.\",",1]],"append":"\n/** Display product prose only; never pass the result to persistence or authorization. */\nexport function cyberProductText(value: string | null | undefined): string {\n  if (!value) return ''\n  // Keep URLs (including query values) and inline code byte-for-byte. Adjacent path,\n  // package, email and identifier characters also distinguish technical names from prose.\n  return value.split(/(`[^`]*`|(?:[a-z][a-z0-9+.-]*:\\/\\/|mailto:|git@)[^\\s<>\"`]+)/gi)\n    .map((part, index) => index % 2 ? part : part.replace(\n      /(?<![\\p{L}\\p{N}_./\\\\@-])SignalBoost(?:Ai|\\s+AI)?(?![\\p{L}\\p{N}_/\\\\@-]|\\.[\\p{L}\\p{N}])/giu,\n      name => publicBrandText(name),\n    )).join('')\n}\n","after":"2d15f2f689520af4b5d2dc2cdf88a78e867db9cd"},
            {"path":"saas/tests/cyberLegacyPresentation.node.test.ts","before":"e7d4d0200e7ea76601118f155f56dc17955fca90","replacements":[["{ cyberReportPresentationCopy, dependencyRescanUrl, unclassifiedAdvisoryCount }","{ cyberReportPresentationCopy, dependencyRescanUrl, unclassifiedAdvisoryCount, cyberProductText }",2]],"append":"\n\ntest('saved remediation prose displays iTMounts without changing the historical record or links', () => {\n  const row = {\n    ...legacy(),\n    title: 'SignalBoost remediation plan: SignalBoost/signalboost-live',\n    summary: 'SignalBoost prepared a proposed remediation plan for 1 dependency advisory finding(s). Human approval is required before PR preparation or any code change.',\n    implementation_notes: 'SignalBoost prepared https://github.com/SignalBoost/signalboost-live/pull/1',\n    pull_request_url: 'https://github.com/SignalBoost/signalboost-live/pull/1',\n    fix_plan: {\n      summary: 'SignalBoost prepared a remediation plan. No code has been changed.',\n      proposedChanges: [{ packageName: 'postcss', currentVersion: '8.4.31', proposedAction: 'SignalBoost will verify the compatible version.' }],\n      validationSteps: ['SignalBoost must run the tests.'],\n      safetyControls: ['SignalBoost must preserve the approval boundary.'],\n    },\n  }\n  const freeze = (value: any): any => {\n    if (value && typeof value === 'object') { Object.values(value).forEach(freeze); Object.freeze(value) }\n    return value\n  }\n  freeze(row)\n  const before = JSON.stringify(row)\n  const tree = card(row)\n  const visible = text(tree, true)\n  assert.match(visible, /iTMounts prepared a proposed remediation plan/)\n  assert.match(visible, /iTMounts prepared a remediation plan/)\n  assert.match(visible, /iTMounts remediation plan: SignalBoost\\/signalboost-live/)\n  assert.match(visible, /iTMounts will verify/)\n  assert.match(visible, /iTMounts must run the tests/)\n  assert.match(visible, /iTMounts must preserve the approval boundary/)\n  assert.match(visible, /iTMounts prepared https:\\/\\/github.com\\/SignalBoost\\/signalboost-live\\/pull\\/1/)\n  assert.match(visible, /Human approval is required before PR preparation/)\n  assert.match(visible, /Stored records and approval history are unchanged/)\n  assert.doesNotMatch(visible, /SignalBoost prepared|SignalBoost must|SignalBoost will/)\n  const links = (n: any): any[] => Array.isArray(n) ? n.flatMap(links) : !n || typeof n !== 'object' ? [] : [...(n.type === 'a' ? [n.props.href] : []), ...links(n.props?.children)]\n  assert.ok(links(tree).includes(row.pull_request_url))\n  assert.equal(JSON.stringify(row), before)\n  assert.equal(buttons(tree).some(n => text(n) === 'Approve plan'), false)\n})\n\ntest('routine and completed remediation prose also uses the current brand without changing decisions', () => {\n  for (const status of ['in_progress', 'completed']) {\n    const row = { ...legacy(), status, human_approval_required: false, human_approved: false,\n      summary: 'User requested SignalBoost remediation assistance.',\n      implementation_notes: 'SignalBoost prepared the proposal, not a deployment.',\n      fix_plan: { summary: 'SIGNALBOOST AI prepared a plan.' } }\n    const before = JSON.stringify(row)\n    const tree = card(row)\n    const visible = text(tree, true)\n    assert.match(visible, /User requested iTMounts remediation assistance/)\n    assert.match(visible, /iTMounts prepared a plan/)\n    assert.match(visible, /iTMounts prepared the proposal, not a deployment/)\n    assert.equal(JSON.stringify(row), before)\n    assert.equal(buttons(tree).length, status === 'completed' ? 0 : 1)\n  }\n})\n\ntest('display branding preserves technical identities, URLs, email addresses and code', () => {\n  for (const technical of [\n    'SignalBoost/signalboost-live', 'signalboost/signalboost-live',\n    'https://github.com/SignalBoost/signalboost-live?label=SignalBoost#SignalBoost',\n    'https://saas.signalboostapp.com', 'mailto:SignalBoost@example.com',\n    'SignalBoost@example.com', 'ops@SignalBoost.com', 'git@github.com:SignalBoost/signalboost-live.git',\n    'signalboost-live', 'SIGNALBOOST_API_KEY', 'SignalBoost.ts', 'SignalBoost.com',\n    'src/SignalBoost', 'C:\\\\SignalBoost\\\\project', '`SignalBoost`',\n  ]) assert.equal(cyberProductText(technical), technical, technical)\n  const prose = 'SignalBoost prepared SignalBoost/signalboost-live; SignalBoost AI verified https://github.com/SignalBoost/signalboost-live.'\n  assert.equal(cyberProductText(prose), 'iTMounts prepared SignalBoost/signalboost-live; iTMounts verified https://github.com/SignalBoost/signalboost-live.')\n})\n\ntest('display branding handles legacy casing and prose in all five supported languages', () => {\n  for (const legacyName of ['SignalBoost', 'SIGNALBOOST', 'signalboost', 'SignalBoostAi', 'SignalBoost AI', 'signalboost ai']) {\n    for (const [before, after] of [['', ' prepared a plan.'], ['', ' preparó un plan.'], ['', ' preparou um plano.'], ['', ' przygotował plan.'], ['Платформа ', ' подготовила план.']]) {\n      assert.equal(cyberProductText(`${before}${legacyName}${after}`), `${before}iTMounts${after}`)\n    }\n  }\n  assert.equal(cyberProductText('(SignalBoost). SignalBoost: plan'), '(iTMounts). iTMounts: plan')\n  assert.equal(cyberProductText(undefined), '')\n  assert.equal(cyberProductText(null), '')\n  assert.equal(cyberProductText('iTMounts'), 'iTMounts')\n  for (const lang of ['en', 'es', 'pt', 'pl', 'ru']) assert.match(cyberReportPresentationCopy(lang).brandDisplayNotice, /iTMounts/)\n})\n","after":"821d6a860000d3695ff3cc872a64f940624fc0c3"},
            {"path":"saas/app/dashboard/cybersecurity/page.tsx","before":"21da921f60f159c011bb9219fffaa4d4cca5cef1","replacements":[["{ cyberReportPresentationCopy, dependencyRescanUrl, unclassifiedAdvisoryCount }","{ cyberReportPresentationCopy, dependencyRescanUrl, unclassifiedAdvisoryCount, cyberProductText }",1],["{error}</div>","{cyberProductText(error)}</div>",1],["{remediationMessage}</div>","{cyberProductText(remediationMessage)}</div>",1],["{r.title}","{cyberProductText(r.title)}",1],["{historicalDependency ? copy.savedPlanNotice : r.summary}","{historicalDependency ? copy.savedPlanNotice : cyberProductText(r.summary)}",1],["{copy.savedPlanArchive}</summary>","{copy.savedPlanArchive}</summary><p className=\"mt-2 text-xs text-text-muted\" data-cyber-brand-notice>{copy.brandDisplayNotice}</p>",1],["{r.summary}","{cyberProductText(r.summary)}",1],["{r.implementation_notes}","{cyberProductText(r.implementation_notes)}",2],["{plan.summary || copy.prepareDescription}","{cyberProductText(plan.summary || copy.prepareDescription)}",1],["{c.proposedAction}","{cyberProductText(c.proposedAction)}",1],["<li key={i}>{s}</li>","<li key={i}>{cyberProductText(s)}</li>",2]],"append":"","after":"fd74b1816bb1445328f914d9942a3dcc3937b40b"},
            {"path":"saas/scripts/vercel-cos-gates.mjs","before":"baac8266e16e5b49ca0dcf4156bf2f900c8ec1c6","replacements":[["  'tests/cyberDependencyScanCoverage.node.test.ts',","  'tests/cyberDependencyScanCoverage.node.test.ts',\n  'tests/cyberLegacyPresentation.node.test.ts',",1]],"append":"","after":"7952603c9a6b2231515c9005b112f3f4ea064ba0"},
            {"path":"ONBOARD.md","before":"8977628013bb9306ad0c989f8baab88b616509e4","replacements":[["# iTMounts Engineering Blueprint\n","# iTMounts Engineering Blueprint\n\n## Cybersecurity saved-message branding — 2026-09-12\n\nCybersecurity remediation titles, summaries, plan prose and implementation notes must render the\ncurrent iTMounts product name, including saved historical records. The read-only cyberProductText\nhelper preserves repository identifiers, URLs, email addresses, paths and inline code. Only the\ndisplay changes: original evidence, approval history, action payloads and authorization remain\nuntouched. Historical views disclose the display normalization in all five supported languages.\nThe real-card regression suite is required in unit CI and the Vercel deployment gate.\n\n",1]],"append":"","after":"5f09b043263e25608c5d7a5106a3a92b75005e22"}
          ];
          const hash = b => createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          mkdirSync('brand-candidate', {recursive:true});
          for (const op of ops) {
            const before = readFileSync(op.path); assert.equal(hash(before), op.before, `${op.path}: stale baseline`);
            let text = before.toString('utf8');
            for (const [from,to,count] of op.replacements) { assert.equal(text.split(from).length-1, count, `${op.path}: anchor count`); text = text.split(from).join(to); }
            const after = Buffer.from(text + op.append); assert.equal(hash(after), op.after, `${op.path}: candidate differs from locally tested bytes`);
            writeFileSync(op.path, after);
            const destination = `brand-candidate/${op.path}`; mkdirSync(dirname(destination), {recursive:true}); writeFileSync(destination, after);
          }
          writeFileSync('brand-candidate/manifest.json', JSON.stringify(ops.map(({path,after})=>({path,sha:after})), null, 2));
          console.log('All five candidate blobs match the independently tested patch.');
          NODE
      - name: Install committed SaaS dependencies without lifecycle scripts
        working-directory: saas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual rendering and related security regressions
        working-directory: saas
        run: node --test tests/cybersecurityLiveProgress.node.test.ts tests/cyberDependencyScanCoverage.node.test.ts tests/publicBrand.node.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-brand-candidate-${{ github.sha }}
          path: brand-candidate/
          if-no-files-found: error
          retention-days: 2
  publish-blobs:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cyber-brand-candidate-${{ github.sha }}
          path: brand-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Store five verified blobs only; never update refs or deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected = {
            'saas/lib/cyber/cyberReportPresentation.ts':'2d15f2f689520af4b5d2dc2cdf88a78e867db9cd',
            'saas/tests/cyberLegacyPresentation.node.test.ts':'821d6a860000d3695ff3cc872a64f940624fc0c3',
            'saas/app/dashboard/cybersecurity/page.tsx':'fd74b1816bb1445328f914d9942a3dcc3937b40b',
            'saas/scripts/vercel-cos-gates.mjs':'7952603c9a6b2231515c9005b112f3f4ea064ba0',
            'ONBOARD.md':'5f09b043263e25608c5d7a5106a3a92b75005e22',
          };
          const result = [];
          for(const [path,sha] of Object.entries(expected)) {
            const bytes=readFileSync(`brand-candidate/${path}`);
            assert.equal(createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'),sha);
            const response=await fetch('https://api.github.com/repos/SignalBoost/signalboost-live/git/blobs',{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:bytes.toString('base64'),encoding:'base64'})});
            assert.equal(response.status,201,`Blob upload failed: ${response.status}`);
            const body=await response.json();assert.equal(body.sha,sha);result.push({path,sha});
          }
          writeFileSync('brand-blobs.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-brand-blobs-${{ github.sha }}
          path: brand-blobs.json
          if-no-files-found: error
          retention-days: 2
