# .github/workflows/browser-agent-host.yml
#
# THE EXECUTION HOST.
#
# Chromium cannot run inside a Vercel serverless function, so the browser channel stops one
# step short of acting. This workflow is that step: a place where a real browser exists for
# as long as one task takes, and not a second longer.
#
# NOTE ON PLACEMENT: this file lives at the REPOSITORY ROOT under .github/workflows/, not
# under saas/. GitHub only reads workflows from the root. An earlier delivery of this file
# was committed into the wrong path and the host silently did not exist — dispatches would
# have gone to a workflow GitHub never saw.
#
# WHY GITHUB ACTIONS RATHER THAN A BROWSER VENDOR. This platform is a test rig, not the
# product. A buyer runs this on infrastructure they already pay for — Browserbase,
# BrowserStack, Sauce Labs, their own Selenium grid — and the portable already carries
# adapters for all of them. What was missing was a way to prove the loop closes without
# buying any of that first. Actions costs nothing here, runs Playwright natively, and
# retains a log per run, which is the same audit trail an enterprise would demand.
#
# THIS WORKFLOW IS NOT THE PRODUCT AND MUST NEVER BECOME A DEPENDENCY OF IT. Nothing in
# saas/lib/portable-browser imports anything from here; the direction is host → portable,
# never the reverse. A buyer reading this file should see an example they could replace in
# an afternoon.
#
# WHAT IT REFUSES TO DO — all enforced by the runner, listed here so a reviewer sees them
# without opening another file. It runs one package whose fingerprint it recomputes before
# touching a browser; it visits only the origin that package declares; it executes only the
# six step kinds the task contract allows; and it stops dead at any checkpoint rather than
# deciding approval was implied. Secrets are resolved from repository secrets by reference
# name — a package carrying a literal credential is rejected before Chromium starts.

name: Browser agent host

on:
  # Sent by POST /api/supervisor/browser-dispatch. This is the normal path.
  repository_dispatch:
    types: [browser-agent-package]
  # Manual paste, kept for debugging and for running a package without the app.
  workflow_dispatch:
    inputs:
      package:
        description: 'Browser runtime package JSON (paste the whole object)'
        required: true
        type: string
      allow_checkpoints:
        description: 'Continue past checkpoint steps — only when the approval already happened'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  # One repair at a time. Two browsers acting on the same system concurrently is how a
  # self-healing system creates the incident it was dispatched to fix.
  group: browser-agent-host
  cancel-in-progress: false

jobs:
  run-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright is a devDependency of the SaaS app and browsers are not cached here.
      # Installing chromium alone keeps the run near two minutes.
      - name: Install Playwright chromium
        working-directory: saas
        run: |
          npm install --no-save @playwright/test@^1.41.0
          npx playwright install --with-deps chromium

      - name: Write package to disk
        env:
          PACKAGE_JSON: ${{ github.event.inputs.package || toJSON(github.event.client_payload.package) }}
        run: |
          printf '%s' "$PACKAGE_JSON" > browser-package.json
          node -e "JSON.parse(require('fs').readFileSync('browser-package.json','utf8'))" \
            || { echo 'Package is not valid JSON.'; exit 1; }

      - name: Execute package
        working-directory: saas
        env:
          BROWSER_PACKAGE_PATH: ${{ github.workspace }}/browser-package.json
          BROWSER_RESULT_PATH: ${{ github.workspace }}/browser-result.json
          BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/browser-evidence
          BROWSER_ALLOW_CHECKPOINTS: ${{ github.event.inputs.allow_checkpoints || 'false' }}
          # Every value the package may reference, by name. A step asking for a reference
          # not listed here fails the step — it never falls back to a blank value, because
          # typing an empty password into a live form is its own kind of damage.
          BROWSER_VALUE_REFS: ${{ secrets.BROWSER_VALUE_REFS }}
          # Where the result is posted when the run finishes. Optional: without them the
          # evidence still lands as an artifact, so a missing callback loses convenience
          # rather than the record.
          BROWSER_HOST_CALLBACK_URL: ${{ secrets.BROWSER_HOST_CALLBACK_URL }}
          BROWSER_HOST_CALLBACK_SECRET: ${{ secrets.BROWSER_HOST_CALLBACK_SECRET }}
        run: node scripts/browser-agent-host/run-package.mjs

      # Uploaded whether the run passed or failed: a failed repair is the case you most
      # need the screenshots for.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            browser-result.json
            browser-evidence/
          retention-days: 30
          if-no-files-found: warn
