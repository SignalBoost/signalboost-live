name: V1 Red Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/closure-red-diagnostics.yml'
      - 'saas/**'

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Sync generated package lock on this PR branch
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "SignalBoost"
          git config user.email "cadomos@gmail.com"
          git add saas/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): sync hyparquet lock"
          git push origin HEAD:${{ github.head_ref }}
      - shell: bash
        run: |
          set +e
          npm test > unit.log 2>&1; echo $? > unit.exit
          npm run verify:issue-205 > guards.log 2>&1; echo $? > guards.exit
          npm run test:supervisor > supervisor.log 2>&1; echo $? > supervisor.exit
          npm run validate:bpal > bpal.log 2>&1; echo $? > bpal.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: red-check-diagnostics
          path: |
            saas/unit.log
            saas/unit.exit
            saas/guards.log
            saas/guards.exit
            saas/supervisor.log
            saas/supervisor.exit
            saas/bpal.log
            saas/bpal.exit
      - shell: bash
        run: |
          test "$(cat unit.exit)" = 0
          test "$(cat guards.exit)" = 0
          test "$(cat supervisor.exit)" = 0
          test "$(cat bpal.exit)" = 0
