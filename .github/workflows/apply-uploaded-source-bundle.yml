name: Apply uploaded source bundle

on:
  push:
    branches:
      - merge/uploaded-source-bundle-20260721

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .merge-payload/chunk* > /tmp/merge_payload.tgz
          echo "92e00345c74d086b745caf3e3371f9050b2911928d287c22549a1d18f8edea12  /tmp/merge_payload.tgz" | sha256sum --check --strict
          tar -xzf /tmp/merge_payload.tgz -C .
          rm -rf .merge-payload
          rm -f .github/workflows/apply-uploaded-source-bundle.yml

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Merge uploaded source bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
