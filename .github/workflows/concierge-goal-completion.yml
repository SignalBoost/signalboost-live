name: Concierge Goal Completion

on:
  pull_request:
    paths:
      - 'saas/app/api/visuals/**'
      - 'saas/lib/ai/cos/goalCompletion.ts'
      - 'saas/lib/cos/aiPort.ts'
      - 'saas/lib/visuals/freshGeneration.ts'
      - 'saas/lib/visuals/intent.ts'
      - 'saas/lib/visuals/personReferences.ts'
      - 'saas/tests/conciergeFreshVisualGeneration.node.test.ts'
      - 'saas/tests/conciergeGoalCompletion.node.test.ts'
      - 'saas/tests/conciergeVisualIntent.node.test.ts'
      - '.github/workflows/concierge-goal-completion.yml'
  push:
    branches: [main]
    paths:
      - 'saas/app/api/visuals/**'
      - 'saas/lib/ai/cos/goalCompletion.ts'
      - 'saas/lib/cos/aiPort.ts'
      - 'saas/lib/visuals/freshGeneration.ts'
      - 'saas/lib/visuals/intent.ts'
      - 'saas/lib/visuals/personReferences.ts'
      - 'saas/tests/conciergeFreshVisualGeneration.node.test.ts'
      - 'saas/tests/conciergeGoalCompletion.node.test.ts'
      - 'saas/tests/conciergeVisualIntent.node.test.ts'
      - '.github/workflows/concierge-goal-completion.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: saas

jobs:
  goal-completion-contract:
    name: Concierge objective completion and safe recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify objective state, replay boundary, named-person recovery, visual routing, and fresh generation
        run: npx --yes tsx --test tests/conciergeGoalCompletion.node.test.ts tests/conciergeVisualIntent.node.test.ts tests/conciergeFreshVisualGeneration.node.test.ts
