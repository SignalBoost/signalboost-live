name: Translation package tooling regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify review-gate regressions
        working-directory: saas
        run: node --test tests/sixLanguageReviewGate.node.test.mjs tests/stageReviewedLanguagePackages.node.test.mjs tests/euEnrollmentRouting.node.test.ts tests/euProjectReadiness.node.test.ts
      - name: Check enabled locale loader wiring
        working-directory: saas
        run: node scripts/check-pending-locale-wiring.mjs
