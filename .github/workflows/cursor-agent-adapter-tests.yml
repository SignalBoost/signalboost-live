name: Cursor Agent Adapter Tests
on:
  pull_request:
    paths:
      - 'saas/scripts/cursor-agent-acceptance.mjs'
      - 'saas/tests/cursorAgentAcceptance.node.test.mjs'
      - '.github/workflows/cursor-agent-adapter-tests.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Cursor adapter without external credentials
        working-directory: saas
        run: node --test tests/cursorAgentAcceptance.node.test.mjs
