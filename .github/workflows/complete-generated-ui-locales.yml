name: Validate generated UI locales

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/complete-generated-ui-locales.yml'
      - 'saas/locales/**'
      - 'saas/scripts/check-generated-ui-locale-completeness.mjs'
      - 'saas/scripts/generated-ui-locale-utils.mjs'
      - 'saas/scripts/repair-generated-ui-token-mismatches.mjs'
      - 'saas/scripts/translate-generated-ui-locales.mjs'
      - 'saas/scripts/translate-generated-ui-locales-public.mjs'
      - 'saas/package.json'
      - 'saas/package-lock.json'

permissions:
  contents: read

concurrency:
  group: validate-generated-ui-locales-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out triggering PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        working-directory: saas
        run: npm ci

      - name: Validate all five locale catalogs
        working-directory: saas
        run: npm run validate:i18n-copy

      - name: Type-check
        working-directory: saas
        run: npm run typecheck

      - name: Production build
        working-directory: saas
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
