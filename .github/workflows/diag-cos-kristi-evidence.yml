# .github/workflows/diag-cos-kristi-evidence.yml
# Temporary read-only evidence pull; removed from this branch right after it runs. Never merge.
name: Diag COS Kristi Evidence
on:
  push:
    branches: [diag/cos-kristi-evidence-20261015]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read recent owner turns
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_URL2: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const url = (process.env.SB_URL || process.env.SB_URL2 || '').replace(/\/$/, '')
          const key = process.env.SB_KEY || ''
          const esc = v => String(v).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A')
          const note = (t, v) => console.log(`::notice title=${t}::${esc(v)}`)
          const h = { apikey: key, Authorization: `Bearer ${key}` }
          const get = async path => { const r = await fetch(`${url}/rest/v1/${path}`, { headers: h }); return { status: r.status, body: await r.json().catch(() => null) } }
          const since = new Date(Date.now() - 3 * 3600_000).toISOString()
          const users = await get(`assistant_messages?select=id,conversation_id,created_at,content&role=eq.user&created_at=gte.${since}&content=ilike.*Kristi*&order=created_at.asc&limit=20`)
          note('kristi-user-turns', `http=${users.status} count=${Array.isArray(users.body) ? users.body.length : JSON.stringify(users.body).slice(0,300)}`)
          for (const u of (Array.isArray(users.body) ? users.body : [])) {
            const next = await get(`assistant_messages?select=role,created_at,content,provenance&conversation_id=eq.${u.conversation_id}&created_at=gte.${encodeURIComponent(u.created_at)}&order=created_at.asc&limit=4`)
            const rows = (Array.isArray(next.body) ? next.body : []).map(r => `${r.created_at} ${r.role} src=${r.provenance?.response_source || r.provenance?.source || r.provenance?.schema || '-'} status=${r.provenance?.status || '-'} :: ${String(r.content || '').replace(/\s+/g,' ').slice(0, 140)}`)
            note(`turn ${u.created_at}`, `conv=${u.conversation_id}\n` + rows.join('\n'))
          }
          const recent = await get(`assistant_messages?select=role,created_at,content,provenance&created_at=gte.${new Date(Date.now()-90*60_000).toISOString()}&order=created_at.asc&limit=40`)
          note('recent-turns', (Array.isArray(recent.body) ? recent.body : []).map(r => `${r.created_at} ${r.role} ${r.provenance?.response_source || r.provenance?.schema || '-'} :: ${String(r.content||'').replace(/\s+/g,' ').slice(0,70)}`).join('\n'))
          NODE
