name: I18n Failure Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/i18n-inventory.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-remove-hardcoded-english
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - name: Install dependencies
        working-directory: saas
        run: npm ci --dangerously-allow-all-scripts
      - name: Capture failing suites
        working-directory: saas
        shell: bash
        run: |
          set +e
          npm test > ../unit-tests.log 2>&1
          echo $? > ../unit-tests.status
          npm run test:audit-remediation > ../audit-remediation.log 2>&1
          echo $? > ../audit-remediation.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-failure-diagnostics
          path: |
            unit-tests.log
            unit-tests.status
            audit-remediation.log
            audit-remediation.status
          if-no-files-found: error
