name: COS LangGraph bootstrap

on:
  push:
    branches:
      - feat/cos-langgraph-langchain-20260911
    paths:
      - '.github/workflows/cos-langgraph-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cos-langgraph-langchain-20260911
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install pinned LangGraph and LangChain Core
        working-directory: saas
        run: |
          npm install --save-exact @langchain/core@1.2.10 @langchain/langgraph@1.4.14
          npm pkg set 'scripts.test:cos-langgraph=node --test tests/cosLangGraph.node.test.ts'

      - name: Update ONBOARD handoff
        shell: python
        run: |
          from pathlib import Path
          path = Path('ONBOARD.md')
          text = path.read_text()
          text = text.replace('**Version:** 1.119', '**Version:** 1.120', 1)
          marker = '**Canonical public origin:** `https://itmounts.com`\n'
          section = '''\n## COS LangGraph + LangChain orchestration — 2026-09-11\n\nCOS now includes a bounded LangGraph orchestration seam under `saas/lib/cos-core/orchestration/`. The first governed graph implements `plan -> execute -> verify -> bounded repair -> re-verify`, with a hard maximum of three execution attempts and no authority-expanding behavior. LangGraph coordinates state transitions only; COS governance, Referee/policy enforcement, Enterprise Memory, learning, provider selection, authorization, audit, and Self-Healing remain authoritative outside the graph.\n\nThe integration pins `@langchain/langgraph` and `@langchain/core` and uses LangChain `RunnableLambda` as the graph node runtime. It intentionally does not replace COS with LangChain's separate agent abstraction or silently route inference to hosted model providers. This is implementation/test evidence only until merged, deployed, and exercised through a Production COS mission path.\n'''
          if '## COS LangGraph + LangChain orchestration — 2026-09-11' not in text:
              text = text.replace(marker, marker + section, 1)
          path.write_text(text)

      - name: Capture bounded COS graph verification
        working-directory: saas
        shell: bash
        run: |
          set +e
          npm run test:cos-langgraph 2>&1 | tee ../cos-langgraph-test.log
          printf '%s\n' "${PIPESTATUS[0]}" > ../cos-langgraph-test.exit
          exit 0

      - name: Capture repository typecheck
        working-directory: saas
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee ../cos-langgraph-typecheck.log
          printf '%s\n' "${PIPESTATUS[0]}" > ../cos-langgraph-typecheck.exit
          exit 0

      - name: Persist reproducible dependency state and diagnostics
        run: |
          git config user.name 'SignalBoost Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saas/package.json saas/package-lock.json ONBOARD.md cos-langgraph-test.log cos-langgraph-test.exit cos-langgraph-typecheck.log cos-langgraph-typecheck.exit
          git commit -m 'feat(cos): wire LangGraph and LangChain Core' || true
          git push origin HEAD:feat/cos-langgraph-langchain-20260911

      - name: Enforce verification
        run: |
          test "$(cat cos-langgraph-test.exit)" = "0"
          test "$(cat cos-langgraph-typecheck.exit)" = "0"

      - name: Remove bootstrap diagnostics
        run: |
          rm .github/workflows/cos-langgraph-bootstrap.yml
          rm -f cos-langgraph-test.log cos-langgraph-test.exit cos-langgraph-typecheck.log cos-langgraph-typecheck.exit
          git add -A .github/workflows/cos-langgraph-bootstrap.yml cos-langgraph-test.log cos-langgraph-test.exit cos-langgraph-typecheck.log cos-langgraph-typecheck.exit
          git commit -m 'chore(cos): remove LangGraph bootstrap diagnostics'
          git push origin HEAD:feat/cos-langgraph-langchain-20260911
