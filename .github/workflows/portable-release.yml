# .github/workflows/portable-release.yml
#
# Builds each portable that has a release spec, then verifies the artifact with
# a second script that shares no logic with the one that produced it.

name: Portable release

on:
  push:
    branches: [main]
    paths:
      - 'saas/lib/supervisor/**'
      - 'saas/lib/browser-runtime/**'
      - 'saas/provider-hub-core/**'
      - 'saas/portable-license/**'
      - 'saas/portable-release/**'
      - 'saas/scripts/package-portable.mjs'
      - 'saas/scripts/verify-release.mjs'
      - '.github/workflows/portable-release.yml'
  pull_request:
    paths:
      - 'saas/lib/supervisor/**'
      - 'saas/lib/browser-runtime/**'
      - 'saas/provider-hub-core/**'
      - 'saas/portable-license/**'
      - 'saas/portable-release/**'
      - 'saas/scripts/package-portable.mjs'
      - 'saas/scripts/verify-release.mjs'
      - '.github/workflows/portable-release.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - self-healing.release.json
          - provider-hub.release.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release
        working-directory: saas
        run: |
          set -euo pipefail
          node scripts/package-portable.mjs "portable-release/${{ matrix.spec }}" 2>&1 | tee portable-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-build-log-${{ matrix.spec }}
          path: saas/portable-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Locate the release directory
        id: release
        working-directory: saas
        run: |
          set -euo pipefail
          dir="$(find dist/portables -mindepth 2 -maxdepth 2 -type d | head -1)"
          test -n "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Verify the artifact independently
        working-directory: saas
        run: node scripts/verify-release.mjs "${{ steps.release.outputs.dir }}"

      - name: Verify checksums the way a buyer would
        working-directory: saas
        run: |
          set -euo pipefail
          cd "${{ steps.release.outputs.dir }}"
          sha256sum -c SHA256SUMS
          for f in *.tgz.sha256; do sha256sum -c "$f"; done

      - name: Prove the archive extracts and still verifies
        working-directory: saas
        run: |
          set -euo pipefail
          src="$PWD/${{ steps.release.outputs.dir }}"
          work="$(mktemp -d)"
          tar xzf "$src"/*.tgz -C "$work"
          node scripts/verify-release.mjs "$work"
          cd "$work"
          sha256sum -c SHA256SUMS
          test -f manifest.json
          test -f RELEASE-NOTES.md

      - name: Confirm no credential material is in the payload
        working-directory: saas
        run: |
          set -euo pipefail
          release_dir="${{ steps.release.outputs.dir }}"
          if grep -rInE '(BEGIN [A-Z ]*PRIVATE KEY|sk-[A-Za-z0-9]{20,}|xox[baprs]-)' "$release_dir/payload"; then
            echo "::error::credential-shaped material found in the payload"
            exit 1
          fi

      - name: Report
        working-directory: saas
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1] + "/manifest.json", "utf8"));
            const out = [];
            out.push("### " + (m.name || m.id) + "  `" + m.version + "`");
            out.push("");
            out.push("| | |");
            out.push("| --- | --- |");
            out.push("| commit | `" + String(m.sourceCommit).slice(0, 12) + "` |");
            out.push("| modules | " + m.moduleCount + " |");
            out.push("| payload files | " + m.files.length + " |");
            out.push("| host fallbacks | " + (m.runtime.externalDependencies || []).filter(d => d.hostFallback).length + " |");
            out.push("| naming exceptions | " + (m.namingExceptions || []).length + " |");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          ' "${{ steps.release.outputs.dir }}"

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.spec }}
          path: saas/dist/portables/**
          if-no-files-found: error
          retention-days: 90
