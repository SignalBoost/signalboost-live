apiVersion: apps/v1
kind: Deployment
metadata:
  name: cos-ai-ml-engineer
  namespace: cos-ai-department
  labels:
    app: cos-ai-department
    role: ml-engineer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cos-ai-department
      role: ml-engineer
  template:
    metadata:
      labels:
        app: cos-ai-department
        role: ml-engineer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: signalboost/cos-ai-department:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COS_AI_ROLE
              value: ml-engineer
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
