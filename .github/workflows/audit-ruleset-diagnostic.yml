name: Audit Ruleset Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-ruleset-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Print actionlint findings only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/contents/.github/workflows/audit-remediation-regression.yml?ref=main" \
            | jq -r '.content' | base64 --decode > /tmp/audit-remediation-regression.yml

          bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          set +e
          ./actionlint -oneline /tmp/audit-remediation-regression.yml > /tmp/actionlint.out 2>&1
          status=$?
          set -e
          echo "ACTIONLINT_STATUS=${status}"
          cat /tmp/actionlint.out
