name: Audit Ruleset Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/audit-ruleset-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Print actionlint findings for current main workflow
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/audit-remediation-regression.yml > /tmp/audit-remediation-regression.yml
          bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          set +e
          ./actionlint -oneline /tmp/audit-remediation-regression.yml > /tmp/actionlint.out 2>&1
          status=$?
          set -e
          echo "ACTIONLINT_STATUS=${status}"
          cat /tmp/actionlint.out
