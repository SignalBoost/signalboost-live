name: Apply Audit Completion Outcome

on:
  push:
    branches:
      - fix/audit-completion-outcome
    paths:
      - '.github/workflows/apply-audit-completion-outcome.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-completion-outcome
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply permanent completion-state presentation
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceRequired(value, before, after, label) {
            if (value.includes(after)) return value
            if (!value.includes(before)) throw new Error(`Missing expected ${label}`)
            return value.replace(before, after)
          }

          const pagePath = 'saas/app/dashboard/audit/page.tsx'
          let page = fs.readFileSync(pagePath, 'utf8')

          page = replaceRequired(page,
`  line?: number | null
}`,
`  line?: number | null
  fixed?: boolean
  fixed_at?: string | null
}`, 'finding fixed fields')

          page = replaceRequired(page,
`  filesScanned: string; findings: string; clean: string; emptyHint: string`,
`  filesScanned: string; findings: string; clean: string; remediatedClean: string; emptyHint: string`, 'completion copy type')

          const localeCopy = [
            ["    filesScanned: 'Files scanned', findings: 'Findings', clean: 'No findings — this scan came back clean.',", "    filesScanned: 'Files scanned', findings: 'Findings', clean: 'No findings — this scan came back clean.',\n    remediatedClean: 'No active findings remain — all approved findings were fixed and verified.',"],
            ["    filesScanned: 'Archivos analizados', findings: 'Hallazgos', clean: 'Sin hallazgos: este análisis salió limpio.',", "    filesScanned: 'Archivos analizados', findings: 'Hallazgos', clean: 'Sin hallazgos: este análisis salió limpio.',\n    remediatedClean: 'No quedan hallazgos activos: todos los hallazgos aprobados fueron corregidos y verificados.',"],
            ["    filesScanned: 'Arquivos analisados', findings: 'Constatações', clean: 'Nenhuma constatação — esta análise voltou limpa.',", "    filesScanned: 'Arquivos analisados', findings: 'Constatações', clean: 'Nenhuma constatação — esta análise voltou limpa.',\n    remediatedClean: 'Não restam constatações ativas — todas as constatações aprovadas foram corrigidas e verificadas.',"],
            ["    filesScanned: 'Przeskanowane pliki', findings: 'Wyniki', clean: 'Brak wyników — ten skan jest czysty.',", "    filesScanned: 'Przeskanowane pliki', findings: 'Wyniki', clean: 'Brak wyników — ten skan jest czysty.',\n    remediatedClean: 'Nie pozostały żadne aktywne wyniki — wszystkie zatwierdzone wyniki zostały naprawione i zweryfikowane.',"],
            ["    filesScanned: 'Просканировано файлов', findings: 'Замечания', clean: 'Замечаний нет — сканирование чистое.',", "    filesScanned: 'Просканировано файлов', findings: 'Замечания', clean: 'Замечаний нет — сканирование чистое.',\n    remediatedClean: 'Активных замечаний не осталось — все одобренные замечания исправлены и проверены.',"],
          ]
          for (const [before, after] of localeCopy) page = replaceRequired(page, before, after, `locale completion copy: ${before}`)

          page = replaceRequired(page,
`      const findings = (log?.findings as Finding[]) || (data.findings as Finding[]) || []`,
`      const findings = (data.findings as Finding[]) || (log?.findings as Finding[]) || []`, 'canonical finding rows')

          page = replaceRequired(page,
`      setProgress({ done: 0, total: 0 })
      setPhase(r?.status === 'complete' || r?.status === 'remediated' ? 'DONE' : null)`,
`      if (remediationState?.lifecycleStatus === 'merged') {
        setRuns(current => current.map(item => item.id === id ? { ...item, status: 'remediated' } : item))
        void loadHistory()
      }
      setProgress({ done: 0, total: 0 })
      setPhase(r?.status === 'complete' || r?.status === 'remediated' || remediationState?.lifecycleStatus === 'merged' ? 'DONE' : null)`, 'merged history refresh')

          page = replaceRequired(page,
`  const findings = view?.findings || []`,
`  const findings = (view?.findings || []).filter(finding => !finding.fixed)`, 'active finding filter')

          page = replaceRequired(page,
`                  <Stat label={copy.findings} value={String(view.findingsCount)} accent="text-accent" />`,
`                  <Stat label={copy.findings} value={String(findings.length)} accent="text-accent" />`, 'active finding stat')

          page = replaceRequired(page,
`                  <div className="rounded-md border border-border bg-surface p-4 text-sm text-text-muted">{copy.clean}</div>`,
`                  <div className="rounded-md border border-border bg-surface p-4 text-sm text-text-muted">{view.status === 'remediated' ? copy.remediatedClean : copy.clean}</div>`, 'remediated clean message')

          page = replaceRequired(page,
`                        {view.findingsCount} {copy.findings}`,
`                        {findings.length} {copy.findings}`, 'executive active count')

          fs.writeFileSync(pagePath, page)

          const testPath = 'saas/tests/auditAutonomousRemediation.node.test.ts'
          let test = fs.readFileSync(testPath, 'utf8')
          const testBlock = `

test('completed remediation presents zero active findings while retaining audit evidence', () => {
  const dashboard = read('../app/dashboard/audit/page.tsx')
  const onboard = read('../../ONBOARD.md')

  assert.match(dashboard, /fixed\\?: boolean/)
  assert.match(dashboard, /const findings = \\(data\\.findings as Finding\\[\\]\\) \\|\\| \\(log\\?\\.findings as Finding\\[\\]\\) \\|\\| \\[\\]/)
  assert.match(dashboard, /filter\\(finding => !finding\\.fixed\\)/)
  assert.match(dashboard, /value=\\{String\\(findings\\.length\\)\\}/)
  assert.match(dashboard, /view\\.status === 'remediated' \\? copy\\.remediatedClean : copy\\.clean/)
  assert.match(dashboard, /\\{findings\\.length\\} \\{copy\\.findings\\}/)
  assert.match(dashboard, /status: 'remediated'/)
  assert.match(onboard, /fixed findings remain durable audit evidence but must not be presented as active findings/i)
  assert.match(onboard, /live audit_findings\\.fixed state instead of the immutable scan log/i)
})
`
          if (!test.includes("completed remediation presents zero active findings")) test += testBlock
          fs.writeFileSync(testPath, test)

          const onboardPath = 'ONBOARD.md'
          let onboard = fs.readFileSync(onboardPath, 'utf8')
          onboard = replaceRequired(onboard,
`- One run-scoped owner approval authorizes the supported safe-fix lifecycle for that immutable audit run. SignalBoost AI prepares fixes, creates the protected branch and internal pull request, waits for required checks, merges automatically, verifies the result, and marks findings fixed only after merge confirmation.`,
`- One run-scoped owner approval authorizes the supported safe-fix lifecycle for that immutable audit run. SignalBoost AI prepares fixes, creates the protected branch and internal pull request, waits for required checks, merges automatically, verifies the result, and marks findings fixed only after merge confirmation.
- Fixed findings remain durable audit evidence but must not be presented as active findings after finalization. The Audit Console must use live audit_findings.fixed state instead of the immutable scan log for current status, show zero remaining when all findings are fixed, and keep the original approved/fixed totals as audit evidence.`, 'completed finding doctrine')
          fs.writeFileSync(onboardPath, onboard)

          fs.rmSync('.github/workflows/apply-audit-completion-outcome.yml')
          NODE

      - name: Verify focused audit regressions
        working-directory: saas
        run: npm ci --dangerously-allow-all-scripts && npm run test:audit-remediation && npm run typecheck

      - name: Commit permanent source changes
        run: |
          git config user.name "SignalBoost Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Show verified audit outcome instead of fixed findings"
          git push origin HEAD:fix/audit-completion-outcome
