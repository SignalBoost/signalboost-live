name: Phase 3 BYOI governed execution acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/lab-phase3-byoi-execution.yml'
      - 'saas/lib/ai/cos/labGovernedProviderExecution.ts'
      - 'saas/lib/ai/cos/labHarnessBoundProviderGrant.ts'
      - 'saas/lib/ai/cos/labTenantProviderGrantGuard.ts'
      - 'saas/tests/labGovernedProviderExecution.node.test.ts'
      - 'saas/lib/ai/cos/labProviderGovernedHarnessAdapter.ts'
      - 'saas/lib/ai/cos/labBuyerOwnedProviderDispatch.ts'
      - 'saas/tests/labProviderGovernedHarnessAdapter.node.test.ts'
      - 'saas/tests/labBuyerOwnedProviderDispatch.node.test.ts'
      - 'saas/tests/labBuyerOwnedProviderRealSocket.node.test.ts'
      - 'saas/lib/ai/cos/itmountsLabByoiExecution.ts'
      - 'saas/lib/ai/cos/itmountsLabByoiScope.ts'
      - 'saas/tests/itmountsLabByoiExecution.node.test.ts'
      - 'saas/tests/itmountsLabByoiScope.node.test.ts'
      - 'saas/tests/labPhase3SyntheticTenantAcceptance.node.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-execution:
    name: Freeze BYOI scope and verify revocation guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test tenant scope snapshot and double-preflight
        working-directory: saas
        run: node --test tests/labGovernedProviderExecution.node.test.ts tests/labProviderGovernedHarnessAdapter.node.test.ts tests/labBuyerOwnedProviderDispatch.node.test.ts tests/labBuyerOwnedProviderRealSocket.node.test.ts tests/itmountsLabByoiExecution.node.test.ts tests/itmountsLabByoiScope.node.test.ts tests/labPhase3SyntheticTenantAcceptance.node.test.ts
