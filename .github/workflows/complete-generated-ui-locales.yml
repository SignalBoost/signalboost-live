name: Complete generated UI locales

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  models: read

concurrency:
  group: complete-generated-ui-locales
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: fix/i18n-five-language-catalog
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Generate missing translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
          REMOVE_TRIGGER_WORKFLOW: '1'
        run: node saas/scripts/translate-generated-ui-locales.mjs --write

      - name: Make five-language parity blocking
        working-directory: saas
        run: |
          npm pkg set 'scripts.validate:i18n-copy=node scripts/check-hardcoded-copy.mjs && node scripts/migrate-page-copy-to-locales.mjs && node scripts/check-generated-ui-locale-completeness.mjs'
          npm pkg set 'scripts.translate:i18n-generated-ui=node scripts/translate-generated-ui-locales.mjs --write'

      - name: Publish generated locale candidates
        run: |
          git config user.name 'SignalBoost Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(i18n): complete all five generated UI dictionaries'
          git push origin HEAD:fix/i18n-five-language-catalog

      - name: Install dependencies
        working-directory: saas
        run: npm ci

      - name: Validate localization
        working-directory: saas
        run: npm run validate:i18n-copy

      - name: Type-check
        working-directory: saas
        run: npm run typecheck

      - name: Production build
        working-directory: saas
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
